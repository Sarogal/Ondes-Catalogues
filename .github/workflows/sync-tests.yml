name: Tests du synchroniseur

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/sync-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: P'tites Ondes — reproduction du garde GPS de production isolé
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python -m unittest discover -s tests -p 'test_ptitesondes_historical_gps*.py' -v
