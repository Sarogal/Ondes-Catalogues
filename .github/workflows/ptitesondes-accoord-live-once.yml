name: "P'tites Ondes — essai ponctuel Accoord (lecture seule)"
on:
  push:
    branches: [feat/ptitesondes-accoord-independent-schedule-20261112]
    paths:
      - '.github/workflows/ptitesondes-accoord-live-once.yml'
permissions:
  contents: read
jobs:
  proof:
    if: github.repository == 'Sarogal/Ondes-Catalogues'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: "Preuve du programme ACCOORD, UID public fixe, sans ecriture"
        shell: bash
        run: |
          set -euo pipefail
          if ! PYTHONPATH=scripts python - <<'PY' > "$RUNNER_TEMP/accoord-private-test.log" 2>&1
          from datetime import date
          from ptitesondes_candidate_promotion import (
              api_record, make_event, registry_location)
          from ptitesondes_full_candidate_audit import read_historic
          from merge_policy import valid
          from proof_text import verify_event
          from zoneinfo import ZoneInfo
          from datetime import datetime
          source="https://openagenda.com/nantesmetropole/events/contes-and-comptines"
          row=api_record("813941")
          print("STAGE ods_ok")
          baseline=read_historic()
          print("STAGE historic_ok")
          categories={x["category"] for x in baseline["events"]}
          fields=set().union(*(set(x) for x in baseline["events"]))
          today=datetime.now(ZoneInfo("Europe/Paris")).date()
          for day in ("2026-11-18","2026-11-25"):
              lead={"collector":"opendatasoft-index", "external_id":"813941",
                    "source_url":source, "title":"Contes & comptines",
                    "city":"Nantes",
                    "venue":"Centre socioculturel des Bourderies - ACCOORD",
                    "date_start":day,"date_end":day}
              place=registry_location(lead)
              print("STAGE registry_checked")
              if place is None: raise ValueError("registre GPS non vérifié")
              event=make_event(lead,row,place,today)
              print("STAGE structure_constructed")
              ok,why=valid(event,categories,fields,today)
              print("STAGE schema_checked", "pass" if ok else "fail")
              if not ok: raise ValueError("schéma public refusé : "+why)
              ok,why=verify_event(event,baseline["events"])
              safe_reasons = (
                ("preuve secondaire inaccessible", "secondary_network"),
                ("titre du spectacle absent", "secondary_heading"),
                ("destination jeune public", "secondary_audience"),
                ("adresse et ville", "secondary_address"),
                ("séance datée et horaire", "secondary_date"),
                ("musique ou conditions", "secondary_music_price"),
                ("séance hors saison", "secondary_season"),
                ("jour ou heure", "secondary_time"),
                ("page", "source_page"),
                ("URL", "source_url"),
              )
              code=next((tag for pattern,tag in safe_reasons
                        if pattern.casefold() in str(why).casefold()), "other")
              print("STAGE organizer_checked", "pass" if ok else "fail", code)
              if not ok: raise ValueError("preuve organisateur refusée : "+why)
          print("2 preuves strictes de dates contrôlées, sans publication")
          PY
          then
            grep -E "^STAGE " "$RUNNER_TEMP/accoord-private-test.log" || true
            echo "::error::Essai Accoord échoué ; aucun évènement accepté/publié."
            exit 1
          fi
          echo "Deux dates futures ont passé toutes les étapes métier sans publication."
