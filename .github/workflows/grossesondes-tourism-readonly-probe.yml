name: Grosses Ondes — diagnostic tourisme signé (lecture seule)

on:
  push:
    branches:
      - diagnostic/festivals-tourism-renewal-20261123
    paths:
      - .github/workflows/grossesondes-tourism-readonly-probe.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Vérifier la fiche touristique historique depuis GitHub
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / "scripts"))
          sys.path.insert(0, str(Path.cwd() / "festival-automation"))
          from dns_pinned_https import fetch_public_html
          from grossesondes_signed_institutional_renewal import (
              signed_tourism_urls, current_edition_dates,
              private_proposal, validate_verified_row,
          )
          hist=json.loads(Path("docs/grossesondes/festival-history.json").read_text(encoding="utf-8"))
          parent=next(x for x in hist["knownFestivals"] if x.get("slug") == "mauges-pit-fest")
          urls=signed_tourism_urls(parent)
          print("TOURISM_SIGNED_SOURCES",len(urls))
          assert len(urls) == 1, "Unexpected number of vetted URLs"
          html=fetch_public_html(urls[0])
          print("TOURISM_HTML_LENGTH",len(html))
          dates=current_edition_dates(html,parent,2027)
          print("TOURISM_REAL_DATES",tuple(d.isoformat() for d in dates) if dates else "NOT_PROVEN")
          if dates:
              row=private_proposal(parent,urls[0],2027,html,"2026-11-23")
              proven=validate_verified_row(row,parent,html,"2026-11-23") if row else None
              print("TOURISM_REAL_PROPOSAL",bool(row))
              print("TOURISM_REAL_PUBLISHER_PROOF",bool(proven))
              if proven:
                  from future_city_preflight import exact_edition_city
                  from official_admin_communes import verified_commune
                  claim=exact_edition_city(html, proven)
                  print("TOURISM_CURRENT_CITY_CLAIM",claim["city"] if claim else "NOT_PROVEN")
                  assert claim is not None, "Current tourist city not proven"
                  from official_admin_communes import normalize
                  assert normalize(claim["city"]) == normalize("Sèvremoine"), "Unexpected city"
                  direct_geocode=verified_commune(claim["city"])
                  print("TOURISM_CURRENT_CITY_GOVERNMENT",bool(direct_geocode))
                  for city, dept in [
                      (claim["city"], None),
                      (claim["city"], "49"),
                      ("Sèvremoine", None),
                      ("Sèvremoine", "49"),
                      ("SEVREMOINE", "49"),
                  ]:
                      result=verified_commune(city, known_department=dept)
                      print("TOURISM_PROBE_VARIANT",repr(city),dept,bool(result))
                  from grossesondes_institutional_edition import VisibleInstitutionHeadings
                  from source_qualification import normalized
                  import re
                  parser=VisibleInstitutionHeadings()
                  parser.feed(html)
                  parser.close()
                  exact=[i for i,h in enumerate(parser.headings)
                         if normalized(h) == normalized(parent["name"])]
                  if exact:
                      i=exact[0]
                      begin=parser.heading_starts[i]
                      end=parser.heading_starts[i+1] if i+1 < len(parser.headings) else len(parser.parts)
                      intro=" ".join(parser.parts[begin:end])
                      print("TOURISM_EVENT_INTRO",repr(" ".join(intro.split())[:470]))
                      print("TOURISM_EVENT_POSTAL_CLAIMS",re.findall(r"\\b([0-9]{5})\\s+([A-ZÀ-ÖØ-Þ][A-ZÀ-ÖØ-Þ '-]{2,55})",intro[:500]))
                  # Diagnostics only: the actual current tourism page visibly
                  # labels the administrative commune SÈVREMOINE (postal 49450).
                  # This call cannot authorize a public marker by itself.
                  city_probe=verified_commune("Sèvremoine", known_department="49")
                  print("TOURISM_FIXED_ADMIN_PROBE",bool(city_probe))
                  if city_probe:
                      print("TOURISM_FIXED_ADMIN_CITY",city_probe["city"])
                      print("TOURISM_FIXED_ADMIN_CODE",city_probe["codeInsee"])
                  if claim:
                      geocode=verified_commune(claim["city"], known_department=parent.get("department"))
                      print("TOURISM_ADMIN_CENTRE_OK",bool(geocode))
                      if geocode:
                          print("TOURISM_ADMIN_CODE",geocode["codeInsee"])
          if dates is None:
              from grossesondes_institutional_edition import VisibleInstitutionHeadings
              from grossesondes_official_html_edition import fold,explicit_ranges
              p=VisibleInstitutionHeadings()
              p.feed(html)
              p.close()
              print("TOURISM_VISIBLE_HEADERS",repr(p.headings[:14]))
              text=fold(" ".join(p.parts))
              print("TOURISM_VISIBLE_2027_DATE_RANGES",len(list(explicit_ranges(text,2027))))
          assert dates is not None and [x.isoformat() for x in dates] == ["2027-10-08","2027-10-09"]
          assert proven is not None
          PY
