name: GO v8 public status API discovery
on:
  push:
    branches: [audit/go-radio-v8-metadata-public-20261125]
    paths:
      - 'radio-catalog-lab/tools/go_radio_v8_status_api_probe.py'
      - 'radio-catalog-lab/tools/test_go_radio_v8_status_api_probe.py'
      - '.github/workflows/go-radio-v8-status-api-audit.yml'
permissions:
  contents: read
  actions: read
jobs:
  status-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography
      - run: python -m unittest discover -s radio-catalog-lab/tools -p test_go_radio_v8_status_api_probe.py
      - uses: actions/download-artifact@v4
        with:
          name: go-radio-v8-metadata-second-pass
          run-id: 45565994439
          github-token: ${{ github.token }}
          path: /tmp/go-second-pass
      - name: Discover public status metadata with exact stream mapping
        run: python radio-catalog-lab/tools/go_radio_v8_status_api_probe.py --second /tmp/go-second-pass/go-radio-v8-metadata-second-pass.json --output /tmp/go-radio-v8-status-api.json
      - uses: actions/upload-artifact@v4
        with:
          name: go-radio-v8-status-api-evidence
          path: /tmp/go-radio-v8-status-api.json
          retention-days: 7
          if-no-files-found: error
