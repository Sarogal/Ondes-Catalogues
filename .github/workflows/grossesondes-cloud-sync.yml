name: Grosses Ondes — synchronisation cloud securisee

on:
  pull_request:
    paths:
      - 'scripts/grossesondes_cloud_sync.py'
      - 'scripts/grossesondes_stage.py'
      - 'scripts/grossesondes_noel_2026.py'
      - 'tests/test_grosses_noel_2026.py'
      - 'tests/fixtures/noel-2026-reference.json'
      - '.github/workflows/grossesondes-cloud-sync.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/grossesondes-cloud-sync.yml'
      - 'scripts/grossesondes_cloud_sync.py'
      - 'scripts/grossesondes_stage.py'
      - 'scripts/grossesondes_noel_2026.py'
      - 'tests/test_grosses_noel_2026.py'
      - 'tests/fixtures/noel-2026-reference.json'
      - 'scripts/grossesondes_preview.py'
      - 'scripts/grossesondes_calendar_approval.py'
      - 'scripts/grossesondes_structured_tickets.py'
      - 'tests/test_grosses_structured_tickets.py'
      - 'tests/test_grosses_cloud_sync.py'
      - 'tests/test_grosses_field_proof.py'
      - 'scripts/grossesondes_generic_roster.py'
      - 'tests/test_grosses_generic_roster.py'
  schedule:
    - cron: '47 10 * * *'
    # Deuxième passage quotidien : GitHub peut retarder ou manquer un cron.
    - cron: '45 17 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Prévisualisation ou publication
        type: choice
        default: preview
        required: true
        options:
          - preview
          - publish
      retry_once:
        description: Réessai unique après une concurrence de publication
        type: boolean
        default: false

permissions:
  contents: write

# Preserve the common deployment lock AND do not replace older pending jobs.
# GitHub Actions queue:max allows up to 100 sequential waiting runs.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ondes-ci-grossesondes-cloud-{0}', github.event.pull_request.number) || 'ondes-cloud-publication' }}
  queue: max
  cancel-in-progress: false

jobs:
  tests_pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Vérifier tous les contrats sans accès aux secrets ni publication
        run: python -m unittest discover -s tests -p 'test_grosses_*.py' -v

  prepare:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || vars.GROSSES_ONDES_CLOUD_SYNC == 'enabled') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    timeout-minutes: 20
    outputs:
      deploy: ${{ steps.confirm.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Vérifier les tests de conservation et de contrôle documentaire
        run: python -m unittest discover -s tests -p 'test_grosses_*.py' -v
      - name: Préparer le candidat ou la modification contrôlée
        id: sync
        env:
          GROSSES_ONDES_INTAKE_READ_TOKEN: ${{ secrets.GROSSES_ONDES_INTAKE_READ_TOKEN }}
          GROSSES_ONDES_CLOUD_SYNC: ${{ vars.GROSSES_ONDES_CLOUD_SYNC }}
          MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && vars.GROSSES_ONDES_CLOUD_SYNC == 'enabled' && 'publish' || inputs.mode || 'preview' }}
        run: |
          python scripts/grossesondes_cloud_sync.py --mode "$MODE"
          if git diff --quiet -- docs/grossesondes/festivals.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Archiver le rapport de contrôle et le catalogue candidat
        uses: actions/upload-artifact@v7
        with:
          name: grossesondes-synchronisation-candidat
          path: /tmp/grossesondes_cloud/
          if-no-files-found: error
          retention-days: 14
      - name: Déterminer si une publication est explicitement autorisée
        id: decision
        env:
          CHANGED: ${{ steps.sync.outputs.changed }}
          GROSSES_ENABLED: ${{ vars.GROSSES_ONDES_CLOUD_SYNC }}
          MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && vars.GROSSES_ONDES_CLOUD_SYNC == 'enabled' && 'publish' || inputs.mode || 'preview' }}
        run: |
          if [ "$CHANGED" = "true" ] && [ "$GROSSES_ENABLED" = "enabled" ] && [ "$MODE" = "publish" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Aucun déploiement : mode preview, catalogue inchangé, ou autorisation absente."
          fi
      - name: Résumé des preuves et des publications réellement admissibles
        if: success()
        env:
          DEPLOY: ${{ steps.decision.outputs.deploy }}
        run: |
          python scripts/grossesondes_sync_summary.py \
            --report /tmp/grossesondes_cloud/report.json \
            --deploy "$DEPLOY" >> "$GITHUB_STEP_SUMMARY"
      - name: Archiver uniquement le calendrier officiellement prouvé dans Git
        id: commit_published
        if: ${{ steps.decision.outputs.deploy == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/grossesondes/festivals.json reviews/grossesondes-published-head.json
          git diff --cached --quiet && exit 1
          git commit -m "data(grossesondes): intégrer les éditions officiellement corroborées"
          # NEVER force-push, rebase or replay this candidate on a different HEAD.
          # A competing PR may have changed the publisher/validator since test.
          if git push origin HEAD:main > "$RUNNER_TEMP/festival-push-result.log" 2>&1; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          elif grep -Eq '\[rejected\].*(fetch first|non-fast-forward)' "$RUNNER_TEMP/festival-push-result.log"; then
            echo "::warning::Main a avancé : abandon du candidat local ; nouvelle validation requise."
            echo "retry_required=true" >> "$GITHUB_OUTPUT"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Impossible de pousser la publication ; aucun déploiement."
            exit 1
          fi
      - name: Refaire une seule vérification sur le nouveau main après conflit
        if: ${{ steps.commit_published.outputs.retry_required == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_ONCE: ${{ inputs.retry_once || false }}
        run: |
          set -euo pipefail
          if [ "$RETRY_ONCE" = "true" ]; then
            echo "::error::Conflit répété ; arrêt fermé jusqu'au prochain cycle normal."
            exit 1
          fi
          # workflow_dispatch is an independent, sequential run: tests, fresh
          # private intake, independent official proof, signed main recheck.
          gh workflow run grossesondes-cloud-sync.yml --repo "$GITHUB_REPOSITORY" \
            --ref main -f mode=publish -f retry_once=true
      - name: Autoriser Pages uniquement après push réel du commit prouvé
        id: confirm
        env:
          DECIDED: ${{ steps.decision.outputs.deploy }}
          PUSHED: ${{ steps.commit_published.outputs.pushed }}
        run: |
          if [ "$DECIDED" = "true" ] && [ "$PUSHED" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configurer GitHub Pages
        if: ${{ steps.confirm.outputs.deploy == 'true' }}
        uses: actions/configure-pages@v6
      - name: Construire le site JSON Pages
        if: ${{ steps.confirm.outputs.deploy == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/

  deploy:
    needs: prepare
    if: ${{ needs.prepare.outputs.deploy == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.published.outputs.page_url }}
    steps:
      - name: Déployer les JSON protégés sur GitHub Pages
        id: published
        uses: actions/deploy-pages@v5
