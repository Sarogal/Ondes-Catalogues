      - ".github/workflows/radio-catalog-daily-discovery.yml"
  workflow_dispatch:
    inputs:
      run_stream_probes:
        description: "Enable up to 20 safe audio sample probes (preview only)"
        required: false
        type: boolean
        default: true
  # Only GitHub's default branch executes scheduled workflows. This schedule
  # is dormant on this isolated review branch until explicitly approved.
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: go-radio-daily-discovery-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discovery-tests:
    name: Contract tests (offline, no catalogue writes)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public verification dependencies
        run: python -m pip install --disable-pip-version-check "cryptography==45.0.7" "jsonschema==4.23.0" "Pillow==11.3.0"
      - name: Validate candidate engine without network
        run: |
          python -m py_compile radio-catalog-lab/tools/radio_lab_first_release.py radio-catalog-lab/tools/radio_lab_provision.py
          python radio-catalog-lab/tools/radio_lab_first_release.py --help
          for mode in sign transport readback; do python "radio-catalog-lab/tools/radio_lab_successor_${mode}.py" --help; done
          python -m unittest discover -s radio-catalog-lab/tools -p "test_radio_daily*.py" -v
          python -m unittest discover -s radio-catalog-lab/tools -p "test_radio_catalog_daily_candidate_reconcile.py" -v
          python -m unittest discover -s radio-catalog-lab/tools -p "test_radio_stream_technical_probe.py" -v
          python -m unittest discover -s radio-catalog-lab/tools -p "test_radio_stream_playlist_preview.py" -v
          python -m unittest discover -s radio-catalog-lab/tools -p "test_radio_stream_socket_integration.py" -v
          python -m unittest discover -s radio-catalog-lab/tools -p "test_radio_stream_recheck_ledger.py" -v

  discovery-preview:
    name: Limited global radio scan — candidates only
    needs: discovery-tests
    runs-on: ubuntu-latest
    timeout-minutes: 18
    outputs:
      report-name: ${{ steps.report-identity.outputs.name }}
      candidate: ${{ steps.release-gate.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public verification dependencies
        run: python -m pip install --disable-pip-version-check "cryptography==45.0.7" "jsonschema==4.23.0" "Pillow==11.3.0"
      - name: Read durable discovery state
        uses: actions/checkout@v4
        with:
          ref: state/go-radio-autonomous
          path: go-radio-state-checkout
          persist-credentials: false
          sparse-checkout: |
            radio-discovery-state
      - name: Restore durable evidence or bootstrap once from validated collection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous="$RUNNER_TEMP/go-radio-previous"
          mkdir -p "$previous"
          state=go-radio-state-checkout/radio-discovery-state
          if [[ -f "$state/ledger.json" ]]; then
            cp "$state/ledger.json" "$previous/ledger.json"
            cp "$state/genre-hints.json" "$previous/candidates.json"
            if [[ -f "$state/metadata-preview.json" ]]; then
              cp "$state/metadata-preview.json" "$previous/metadata-preview.json"
            fi
            if [[ -f "$state/artist-research-preview.json" ]]; then
              cp "$state/artist-research-preview.json" "$previous/artist-research-preview.json"
            fi
            if [[ -f "$state/missing-logo-preview.json" ]]; then
              cp "$state/missing-logo-preview.json" "$previous/missing-logo-preview.json"
            fi
            if [[ -f "$state/logo-maintenance-preview.json" ]]; then
              cp "$state/logo-maintenance-preview.json" "$previous/logo-maintenance-preview.json"
            fi
            if [[ -f "$state/status-transition-preview.json" ]]; then
              cp "$state/status-transition-preview.json" "$previous/status-transition-preview.json"
            fi
            if [[ -f "$state/repair-confirmation-preview.json" ]]; then
              cp "$state/repair-confirmation-preview.json" "$previous/repair-confirmation-preview.json"
            fi
            if [[ -f "$state/repair-preview.json" ]]; then
              cp "$state/repair-preview.json" "$previous/repair-preview.json"
            fi
            if [[ -f "$state/maintenance-preview.json" ]]; then
              cp "$state/maintenance-preview.json" "$previous/maintenance-preview.json"
            fi
            if [[ -f "$state/recording-preview.json" ]]; then
              cp "$state/recording-preview.json" "$previous/recording-preview.json"
            fi
            if [[ -f "$state/wikidata-preview.json" ]]; then
              cp "$state/wikidata-preview.json" "$previous/wikidata-preview.json"
            fi
            if [[ -f "$state/logo-preview.json" ]]; then
              cp "$state/logo-preview.json" "$previous/logo-preview.json"
            fi
            if [[ -f "$state/hls-preview.json" ]]; then
              cp "$state/hls-preview.json" "$previous/hls-preview.json"
            fi
            if [[ -f "$state/continuity-preview.json" ]]; then
              cp "$state/continuity-preview.json" "$previous/continuity-preview.json"
            fi
            if [[ -f "$state/editorial-preview.json" ]]; then
              cp "$state/editorial-preview.json" "$previous/editorial-preview.json"
            fi
            if [[ -f "$state/qualification-dossiers.json" ]]; then
              cp "$state/qualification-dossiers.json" "$previous/qualification-dossiers.json"
            fi
            if [[ -f "$state/stream-evidence.json" ]]; then
              cp "$state/stream-evidence.json" "$previous/stream-evidence.json"
            fi
          else
            echo "Autonomous state missing; refusing V8 fallback" >&2
            exit 1
          fi
      - name: Scan Radio Browser without UUID allowlist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/go-radio-discovery"
          git -C go-radio-state-checkout rev-parse HEAD > "$RUNNER_TEMP/go-radio-discovery/state-parent.txt"
          retry="$RUNNER_TEMP/go-radio-discovery/discovery-retry.json"
          prior_retry=go-radio-state-checkout/radio-discovery-state/discovery-retry.json
          # On branch pushes, only a tiny real-network sample is used.
          # Scheduled/manual runs explore many music tags and rotated pages.
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            python radio-catalog-lab/tools/radio_daily_discovery.py \
              --tags "metal,punk,hard rock,black metal,thrash metal,trash metal,pagan metal,nu metal" \
              --names "metal,punk,hard rock,nu metal" \
              --page-size 50 --max-pages 1 --crawl-delay 0.3 \
              --prior-decisions go-radio-state-checkout/radio-discovery-state/decision-preview.json \
              --retry-state "$prior_retry" --retry-output "$retry" \
              --output "$RUNNER_TEMP/go-radio-discovery/candidates.json"
          else
            # Previous review-only tags are allowed to extend the taxonomy,
            # but never authorize a radio, stream, logo or station deletion.
            prior=()
            if [[ -f "$RUNNER_TEMP/go-radio-previous/candidates.json" ]]; then
              prior=(--previous-report "$RUNNER_TEMP/go-radio-previous/candidates.json")
            fi
            python radio-catalog-lab/tools/radio_daily_discovery.py \
              --page-size 100 --max-pages 3 --crawl-delay 0.3 \
              "${prior[@]}" \
              --prior-decisions go-radio-state-checkout/radio-discovery-state/decision-preview.json \
              --retry-state "$prior_retry" --retry-output "$retry" \
              --output "$RUNNER_TEMP/go-radio-discovery/candidates.json"
          fi
      - name: Authenticate current real catalogue and reconcile candidates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RADIO_LAB_PUBLIC_KEY: ${{ vars.RADIO_LAB_PUBLIC_KEY }}
          RADIO_LAB_KEY_ID: ${{ vars.RADIO_LAB_KEY_ID }}
        run: |
          set -euo pipefail
          PYTHONPATH=radio-catalog-lab/tools python - <<'PY'
          import os, json, subprocess, datetime
          from pathlib import Path
          from radio_daily_baseline_verify import cli_anchor, verify_baseline, strict_json
          from radio_daily_release_context import prepare, STATE_FILES
          from radio_daily_v9_generator import encode
          state=Path("go-radio-state-checkout/radio-discovery-state")
          tmp=Path(os.environ["RUNNER_TEMP"])
          root=tmp/"go-radio-discovery"
          pointer=(state/"release-anchor.json").read_bytes()
          body=(state/"release-baseline.json").read_bytes()
          old=strict_json((state/"release-context.json").read_bytes())
          p=strict_json(pointer)
          seq=p["release_sequence"]
          sha=p["content_sha256"]
          assert seq>=9 and old["selectedSequence"]==seq and old["selectedSha256"]==sha
          assert old["remoteReadbackVerified"] is True and old["deploymentVerified"] is True and old["simulated"] is False
          anchor=cli_anchor(sha,seq)
          verify_baseline(pointer,body,**anchor)
          # Never scan from a stale accepted state after an interrupted publication.
          head=json.loads(subprocess.check_output(["gh","api","repos/Sarogal/Ondes-Catalogues/git/ref/heads/radio-lab-publisher-rehearsal"]))["object"]["sha"]
          assert head==old["gitCommit"], "remote release differs from accepted state"
          day=datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          evidence={key:strict_json((state/name).read_bytes()) for key,name in STATE_FILES.items()}
          raw,selected,migrated,context=prepare(pointer,lambda path,length:body,
              day=day,state=evidence,prior_pointer=pointer,prior_body=body,**anchor)
          assert not migrated and selected["advanced"] is False
          context.update({k:old[k] for k in ("gitCommit","deploymentId","remoteReadbackVerified","deploymentVerified","simulated","mirroredLegacyArtwork")})
          (tmp/"go-radio-selected-pointer.json").write_bytes(pointer)
          (tmp/"go-radio-selected-baseline.json").write_bytes(raw)
          (root/"release-anchor.json").write_bytes(pointer)
          (root/"baseline-selection.json").write_bytes(encode(selected))
          (root/"release-context.json").write_bytes(encode(context))
          with open(os.environ["GITHUB_ENV"],"a") as env:
              for k,v in {"BASELINE_SHA256":sha,"BASELINE_SEQUENCE":seq,
                          "RADIO_LAB_PUBLIC_KEY":anchor["public_key"],"RADIO_LAB_KEY_ID":anchor["key_id"]}.items():
                  print(f"{k}={v}",file=env)
          print("REAL_RADIO_BASELINE",seq,sha,head)
          PY
          python radio-catalog-lab/tools/radio_catalog_daily_candidate_reconcile.py \
            --catalog "$RUNNER_TEMP/go-radio-selected-baseline.json" \
            --discovery "$RUNNER_TEMP/go-radio-discovery/candidates.json" \
            --output "$RUNNER_TEMP/go-radio-discovery/reconciliation-v8.json"
      - name: Retain cross-day candidates without approving any stream
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/go-radio-previous/ledger.json" ]]; then
            python radio-catalog-lab/tools/radio_daily_candidate_ledger.py \
              --scan "$RUNNER_TEMP/go-radio-discovery/candidates.json" \
              --output "$RUNNER_TEMP/go-radio-discovery/ledger.json" \
              --previous "$RUNNER_TEMP/go-radio-previous/ledger.json"
          else
            python radio-catalog-lab/tools/radio_daily_candidate_ledger.py \
              --scan "$RUNNER_TEMP/go-radio-discovery/candidates.json" \
              --output "$RUNNER_TEMP/go-radio-discovery/ledger.json"
          fi
      - name: Bounded audio byte sampling of new candidates
        if: github.event_name != 'workflow_dispatch' || inputs.run_stream_probes == true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "go-radio-discovery"
          discovery = json.loads((root / "candidates.json").read_text())
          reconciliation = json.loads((root / "reconciliation-v8.json").read_text())
          assert discovery["publicationAllowed"] is False
          assert reconciliation["automaticAdmissionAllowed"] is False
          candidates = {r["stationuuid"] for r in reconciliation["candidates"]
                        if r["classification"] == "unmapped_candidate"}
          discovery["candidates"] = [r for r in discovery["candidates"]
                                     if r["stationuuid"] in candidates
                                     and r.get("editorialSignal") != "electronic_context_review"]
          (root / "probe-candidates.json").write_text(json.dumps(discovery))
          PY
          previous=()
