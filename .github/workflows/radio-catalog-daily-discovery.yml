      - "radio-catalog-lab/tools/test_radio_daily_baseline_verify.py"
      - "radio-catalog-lab/tools/radio_daily_alternative_metadata.py"
      - "radio-catalog-lab/tools/test_radio_daily_alternative_metadata.py"
      - "radio-catalog-lab/tools/radio_daily_metadata_preview.py"
      - "radio-catalog-lab/tools/test_radio_daily_metadata_preview.py"
      - "radio-catalog-lab/tools/radio_daily_artist_research.py"
      - "radio-catalog-lab/tools/test_radio_daily_artist_research.py"
      - "radio-catalog-lab/tools/radio_daily_programme_preview.py"
      - "radio-catalog-lab/tools/test_radio_daily_programme_preview.py"
      - "radio-catalog-lab/tools/radio_daily_recording_preview.py"
      - "radio-catalog-lab/tools/test_radio_daily_recording_preview.py"
      - "radio-catalog-lab/tools/radio_daily_wikidata_preview.py"
      - "radio-catalog-lab/tools/test_radio_daily_wikidata_preview.py"
      - "radio-catalog-lab/tools/test_radio_daily_cross_source_preview.py"
      - "radio-catalog-lab/schemas/radio_catalog_v1.schema.json"
      - ".github/workflows/radio-catalog-daily-discovery.yml"
  workflow_dispatch:
    inputs:
      run_stream_probes:
        description: "Enable up to 20 safe audio sample probes (preview only)"
        required: false
        type: boolean
        default: true
  # Only GitHub's default branch executes scheduled workflows. This schedule
  # is dormant on this isolated review branch until explicitly approved.
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: go-radio-daily-discovery-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discovery-tests:
    name: Contract tests (offline, no catalogue writes)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public verification dependencies
        run: python -m pip install --disable-pip-version-check "cryptography==45.0.7" "jsonschema==4.23.0" "Pillow==11.3.0"
      - name: Validate candidate engine without network
        run: |
          python -m unittest discover -s radio-catalog-lab/tools -p "test_radio_daily*.py" -v
          python -m unittest discover -s radio-catalog-lab/tools -p "test_radio_catalog_daily_candidate_reconcile.py" -v
          python -m unittest discover -s radio-catalog-lab/tools -p "test_radio_stream_technical_probe.py" -v
          python -m unittest discover -s radio-catalog-lab/tools -p "test_radio_stream_playlist_preview.py" -v
          python -m unittest discover -s radio-catalog-lab/tools -p "test_radio_stream_socket_integration.py" -v
          python -m unittest discover -s radio-catalog-lab/tools -p "test_radio_stream_recheck_ledger.py" -v

  discovery-preview:
    name: Limited global radio scan — candidates only
    needs: discovery-tests
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public verification dependencies
        run: python -m pip install --disable-pip-version-check "cryptography==45.0.7" "jsonschema==4.23.0" "Pillow==11.3.0"
      - name: Read durable discovery state
        uses: actions/checkout@v4
        with:
          ref: state/go-radio-discovery-preview
          path: go-radio-state-checkout
          persist-credentials: false
          sparse-checkout: |
            radio-discovery-state
      - name: Restore durable evidence or bootstrap once from validated collection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous="$RUNNER_TEMP/go-radio-previous"
          mkdir -p "$previous"
          state=go-radio-state-checkout/radio-discovery-state
          if [[ -f "$state/ledger.json" ]]; then
            cp "$state/ledger.json" "$previous/ledger.json"
            cp "$state/genre-hints.json" "$previous/candidates.json"
            if [[ -f "$state/metadata-preview.json" ]]; then
              cp "$state/metadata-preview.json" "$previous/metadata-preview.json"
            fi
            if [[ -f "$state/artist-research-preview.json" ]]; then
              cp "$state/artist-research-preview.json" "$previous/artist-research-preview.json"
            fi
            if [[ -f "$state/missing-logo-preview.json" ]]; then
              cp "$state/missing-logo-preview.json" "$previous/missing-logo-preview.json"
            fi
            if [[ -f "$state/logo-maintenance-preview.json" ]]; then
              cp "$state/logo-maintenance-preview.json" "$previous/logo-maintenance-preview.json"
            fi
            if [[ -f "$state/status-transition-preview.json" ]]; then
              cp "$state/status-transition-preview.json" "$previous/status-transition-preview.json"
            fi
            if [[ -f "$state/repair-confirmation-preview.json" ]]; then
              cp "$state/repair-confirmation-preview.json" "$previous/repair-confirmation-preview.json"
            fi
            if [[ -f "$state/repair-preview.json" ]]; then
              cp "$state/repair-preview.json" "$previous/repair-preview.json"
            fi
            if [[ -f "$state/maintenance-preview.json" ]]; then
              cp "$state/maintenance-preview.json" "$previous/maintenance-preview.json"
            fi
            if [[ -f "$state/recording-preview.json" ]]; then
              cp "$state/recording-preview.json" "$previous/recording-preview.json"
            fi
            if [[ -f "$state/wikidata-preview.json" ]]; then
              cp "$state/wikidata-preview.json" "$previous/wikidata-preview.json"
            fi
            if [[ -f "$state/logo-preview.json" ]]; then
              cp "$state/logo-preview.json" "$previous/logo-preview.json"
            fi
            if [[ -f "$state/hls-preview.json" ]]; then
              cp "$state/hls-preview.json" "$previous/hls-preview.json"
            fi
            if [[ -f "$state/continuity-preview.json" ]]; then
              cp "$state/continuity-preview.json" "$previous/continuity-preview.json"
            fi
            if [[ -f "$state/editorial-preview.json" ]]; then
              cp "$state/editorial-preview.json" "$previous/editorial-preview.json"
            fi
            if [[ -f "$state/qualification-dossiers.json" ]]; then
              cp "$state/qualification-dossiers.json" "$previous/qualification-dossiers.json"
            fi
            if [[ -f "$state/stream-evidence.json" ]]; then
              cp "$state/stream-evidence.json" "$previous/stream-evidence.json"
            fi
          else
            # Bootstrap from the last verified v8 reconciliation, never
            # silently reset an existing state on a transport error.
            gh run download 45606141697 --repo "$GITHUB_REPOSITORY" \
              --name go-radio-discovery-45606141697 --dir "$previous"
            test -f "$previous/ledger.json"
          fi
      - name: Scan Radio Browser without UUID allowlist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/go-radio-discovery"
          git -C go-radio-state-checkout rev-parse HEAD > "$RUNNER_TEMP/go-radio-discovery/state-parent.txt"
          # On branch pushes, only a tiny real-network sample is used.
          # Scheduled/manual runs explore many music tags and rotated pages.
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            python radio-catalog-lab/tools/radio_daily_discovery.py \
              --tags "metal,punk,hard rock,black metal,thrash metal,trash metal,pagan metal,nu metal" \
              --names "metal,punk,hard rock,nu metal" \
              --page-size 50 --max-pages 1 --crawl-delay 0.3 \
              --output "$RUNNER_TEMP/go-radio-discovery/candidates.json"
          else
            # Previous review-only tags are allowed to extend the taxonomy,
            # but never authorize a radio, stream, logo or station deletion.
            prior=()
            if [[ -f "$RUNNER_TEMP/go-radio-previous/candidates.json" ]]; then
              prior=(--previous-report "$RUNNER_TEMP/go-radio-previous/candidates.json")
            fi
            python radio-catalog-lab/tools/radio_daily_discovery.py \
              --page-size 100 --max-pages 3 --crawl-delay 0.3 \
              "${prior[@]}" \
              --output "$RUNNER_TEMP/go-radio-discovery/candidates.json"
          fi
      - name: Select signed bootstrap and reconcile candidates (read-only)
        shell: bash
        env:
          BOOTSTRAP_SHA256: f57e65f24f5ddd3a567907b28903fc309ea4c16747873b39f8d5a44348266f40
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/go-radio-selected-baseline.json"
          curl --fail --silent --show-error --max-time 45 --max-filesize 2000000 \
            "https://raw.githubusercontent.com/Sarogal/Ondes-Catalogues/feature/go-radio-test-v2-isolated-20261123/grossesondes/radio-test-v2/releases/${BOOTSTRAP_SHA256}.json" \
            --output "$baseline"
          printf '%s  %s\n' "$BOOTSTRAP_SHA256" "$baseline" | sha256sum --check --strict
          pointer="$RUNNER_TEMP/go-radio-selected-pointer.json"
          curl --fail --silent --show-error --max-time 45 --max-filesize 16384 \
            "https://raw.githubusercontent.com/Sarogal/Ondes-Catalogues/feature/go-radio-test-v2-isolated-20261123/grossesondes/radio-test-v2/current.json" \
            --output "$pointer"
          # A persisted signed anchor must authenticate against the pinned bootstrap.
          # A missing anchor is allowed only during this explicit v8 bootstrap rollout.
          anchor=go-radio-state-checkout/radio-discovery-state/release-anchor.json
          if [[ -e "$anchor" ]]; then
            PYTHONPATH=radio-catalog-lab/tools python - "$anchor" <<'PY'
          import sys
          from pathlib import Path
          from radio_daily_baseline_verify import verify_pointer
          path=Path(sys.argv[1])
          if not path.is_file() or path.stat().st_size > 16384:
              raise ValueError("invalid durable release anchor")
          verify_pointer(path.read_bytes())
          PY
          fi
          python radio-catalog-lab/tools/radio_daily_release_context.py \
            --pointer "$pointer" --baseline "$baseline" \
            --previous-dir "$RUNNER_TEMP/go-radio-previous" \
            --day "$(date -u +%F)" \
            --selection-report "$RUNNER_TEMP/go-radio-discovery/baseline-selection.json" \
            --report "$RUNNER_TEMP/go-radio-discovery/release-context.json"
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          context=json.loads((Path(os.environ["RUNNER_TEMP"])/"go-radio-discovery/release-context.json").read_text())
          assert context["signatureVerified"] is True and context["publicationAllowed"] is False
          sha=context["selectedSha256"]
          seq=context["selectedSequence"]
          assert re.fullmatch("[0-9a-f]{64}",sha) and type(seq) is int and seq>=8
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write(f"BASELINE_SHA256={sha}\nBASELINE_SEQUENCE={seq}\n")
          PY
          # The verified pointer is public material, not a signing key.
          cp "$pointer" "$RUNNER_TEMP/go-radio-discovery/release-anchor.json"
          # Digest is pinned to the previously signed TEST v8. This is a
          # classification-only report, not authority to admit or sign.
          python radio-catalog-lab/tools/radio_catalog_daily_candidate_reconcile.py \
            --catalog "$baseline" \
            --discovery "$RUNNER_TEMP/go-radio-discovery/candidates.json" \
            --output "$RUNNER_TEMP/go-radio-discovery/reconciliation-v8.json"
      - name: Retain cross-day candidates without approving any stream
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/go-radio-previous/ledger.json" ]]; then
            python radio-catalog-lab/tools/radio_daily_candidate_ledger.py \
              --scan "$RUNNER_TEMP/go-radio-discovery/candidates.json" \
              --output "$RUNNER_TEMP/go-radio-discovery/ledger.json" \
              --previous "$RUNNER_TEMP/go-radio-previous/ledger.json"
          else
            python radio-catalog-lab/tools/radio_daily_candidate_ledger.py \
              --scan "$RUNNER_TEMP/go-radio-discovery/candidates.json" \
              --output "$RUNNER_TEMP/go-radio-discovery/ledger.json"
          fi
      - name: Bounded audio byte sampling of new candidates
        if: github.event_name != 'workflow_dispatch' || inputs.run_stream_probes == true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "go-radio-discovery"
          discovery = json.loads((root / "candidates.json").read_text())
          reconciliation = json.loads((root / "reconciliation-v8.json").read_text())
          assert discovery["publicationAllowed"] is False
          assert reconciliation["automaticAdmissionAllowed"] is False
          candidates = {r["stationuuid"] for r in reconciliation["candidates"]
                        if r["classification"] == "unmapped_candidate"}
          discovery["candidates"] = [r for r in discovery["candidates"]
                                     if r["stationuuid"] in candidates
                                     and r.get("editorialSignal") != "electronic_context_review"]
          (root / "probe-candidates.json").write_text(json.dumps(discovery))
          PY
          previous=()
          if [[ -f "$RUNNER_TEMP/go-radio-previous/stream-evidence.json" ]]; then
            previous=(--previous-evidence "$RUNNER_TEMP/go-radio-previous/stream-evidence.json")
          fi
          python radio-catalog-lab/tools/radio_stream_technical_probe.py \
            --discovery "$RUNNER_TEMP/go-radio-discovery/probe-candidates.json" \
            --output "$RUNNER_TEMP/go-radio-discovery/technical-probes.json" \
            --limit 20 --workers 4 --allow-network "${previous[@]}"
      - name: Track technical samples over separate days (never approve streams)
        if: github.event_name != 'workflow_dispatch' || inputs.run_stream_probes == true
        shell: bash
        run: |
          set -euo pipefail
          previous=()
          if [[ -f "$RUNNER_TEMP/go-radio-previous/stream-evidence.json" ]]; then
            previous=(--previous "$RUNNER_TEMP/go-radio-previous/stream-evidence.json")
          fi
          python radio-catalog-lab/tools/radio_stream_recheck_ledger.py \
            --probe "$RUNNER_TEMP/go-radio-discovery/technical-probes.json" \
            --output "$RUNNER_TEMP/go-radio-discovery/stream-evidence.json" \
            "${previous[@]}"
      - name: Preview candidate logo sources (no approval)
        if: github.event_name != 'workflow_dispatch' || inputs.run_stream_probes == true
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/go-radio-discovery"
          previous=()
          if [[ -f "$RUNNER_TEMP/go-radio-previous/logo-preview.json" ]]; then
            previous=(--previous "$RUNNER_TEMP/go-radio-previous/logo-preview.json")
          fi
          python radio-catalog-lab/tools/radio_daily_logo_preview.py \
            --discovery "$root/candidates.json" \
            --reconciliation "$root/reconciliation-v8.json" \
            --stream "$root/stream-evidence.json" \
            --output "$root/logo-preview.json" --limit 8 --allow-network "${previous[@]}"
      - name: Collect independent homepage format indications (no approval)
        if: github.event_name != 'workflow_dispatch' || inputs.run_stream_probes == true
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/go-radio-discovery"
          previous=()
          if [[ -f "$RUNNER_TEMP/go-radio-previous/editorial-preview.json" ]]; then
            previous=(--previous "$RUNNER_TEMP/go-radio-previous/editorial-preview.json")
          fi
          python radio-catalog-lab/tools/radio_daily_editorial_preview.py \
            --discovery "$root/candidates.json" --reconciliation "$root/reconciliation-v8.json" \
            --output "$root/editorial-preview.json" --limit 8 --allow-network "${previous[@]}"
      - name: Observe spaced audio windows on one connection
        if: github.event_name != 'workflow_dispatch' || inputs.run_stream_probes == true
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/go-radio-discovery"
          previous=()
          if [[ -f "$RUNNER_TEMP/go-radio-previous/continuity-preview.json" ]]; then
            previous=(--previous "$RUNNER_TEMP/go-radio-previous/continuity-preview.json")
          fi
          python radio-catalog-lab/tools/radio_daily_continuity_preview.py \
            --discovery "$root/candidates.json" --reconciliation "$root/reconciliation-v8.json" \
            --audio "$root/stream-evidence.json" --editorial "$root/editorial-preview.json" \
            --output "$root/continuity-preview.json" --limit 6 --allow-network "${previous[@]}"
      - name: Inspect bounded HLS manifest progression
        if: github.event_name != 'workflow_dispatch' || inputs.run_stream_probes == true
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/go-radio-discovery"
          previous=()
          if [[ -f "$RUNNER_TEMP/go-radio-previous/hls-preview.json" ]]; then
            previous=(--previous "$RUNNER_TEMP/go-radio-previous/hls-preview.json")
          fi
          python radio-catalog-lab/tools/radio_daily_hls_preview.py \
            --discovery "$root/candidates.json" --reconciliation "$root/reconciliation-v8.json" \
            --audio "$root/stream-evidence.json" --output "$root/hls-preview.json" \
            --limit 4 --allow-network "${previous[@]}"
      - name: Join qualification evidence by UUID (no admission)
        if: github.event_name != 'workflow_dispatch' || inputs.run_stream_probes == true
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/go-radio-discovery"
          previous=()
          if [[ -f "$RUNNER_TEMP/go-radio-previous/qualification-dossiers.json" ]]; then
            previous=(--previous "$RUNNER_TEMP/go-radio-previous/qualification-dossiers.json")
          fi
          python radio-catalog-lab/tools/radio_daily_qualification_dossiers.py \
            --discovery "$root/candidates.json" --reconciliation "$root/reconciliation-v8.json" \
            --ledger "$root/ledger.json" --stream "$root/stream-evidence.json" \
            --logo "$root/logo-preview.json" --editorial "$root/editorial-preview.json" --continuity "$root/continuity-preview.json" --hls "$root/hls-preview.json" --output "$root/qualification-dossiers.json" \
            --baseline-sha256 "$BASELINE_SHA256" "${previous[@]}"
      - name: Evaluate decision policy (staging review only)
        if: github.event_name != 'workflow_dispatch' || inputs.run_stream_probes == true
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/go-radio-discovery"
          python radio-catalog-lab/tools/radio_daily_decision_preview.py \
            --discovery "$root/candidates.json" --dossiers "$root/qualification-dossiers.json" \
