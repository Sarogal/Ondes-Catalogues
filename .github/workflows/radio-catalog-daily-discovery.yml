            --output "$root/repair-confirmation-preview.json" --limit 4 --allow-network "${previous[@]}"
      - name: Generate digest-only maintenance repair plan (never a catalogue)
        if: github.event_name != 'workflow_dispatch' || inputs.run_stream_probes == true
        shell: bash
        run: |
