          fi
          python radio-catalog-lab/tools/radio_daily_status_preview.py \
            --baseline "$RUNNER_TEMP/go-radio-selected-baseline.json" --baseline-sha256 "$BASELINE_SHA256" --maintenance "$root/maintenance-preview.json" \
            --repair-plan "$root/repair-plan-preview.json" --output "$root/status-transition-preview.json" \
            --limit 4 --allow-network "${previous[@]}"
      - name: Audit existing signed logo sources (no artwork writes)
        if: github.event_name != 'workflow_dispatch' || inputs.run_stream_probes == true
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/go-radio-discovery"
          previous=()
          if [[ -f "$RUNNER_TEMP/go-radio-previous/logo-maintenance-preview.json" ]]; then
            previous=(--previous "$RUNNER_TEMP/go-radio-previous/logo-maintenance-preview.json")
          fi
          python radio-catalog-lab/tools/radio_daily_logo_maintenance.py \
            --baseline "$RUNNER_TEMP/go-radio-selected-baseline.json" --baseline-sha256 "$BASELINE_SHA256" --output "$root/logo-maintenance-preview.json" \
            --limit 8 --allow-network "${previous[@]}"
      - name: Search station-bound missing artwork (review only)
        if: github.event_name != 'workflow_dispatch' || inputs.run_stream_probes == true
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/go-radio-discovery"
          previous=()
          if [[ -f "$RUNNER_TEMP/go-radio-previous/missing-logo-preview.json" ]]; then
