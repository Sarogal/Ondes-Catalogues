          fi
          python radio-catalog-lab/tools/radio_daily_missing_logo.py \
            --baseline "$RUNNER_TEMP/go-radio-selected-baseline.json" --baseline-sha256 "$BASELINE_SHA256" --output "$root/missing-logo-preview.json" \
            --limit 4 --allow-network "${previous[@]}"
      - name: Generate single unsigned catalogue candidate (artifact only)
        if: github.event_name != 'workflow_dispatch' || inputs.run_stream_probes == true
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/go-radio-discovery"
          python radio-catalog-lab/tools/radio_daily_unified_generator.py \
            --pointer "$RUNNER_TEMP/go-radio-selected-pointer.json" --baseline "$RUNNER_TEMP/go-radio-selected-baseline.json" --baseline-sha256 "$BASELINE_SHA256" --baseline-sequence "$BASELINE_SEQUENCE" \
            --discovery "$root/candidates.json" --dossiers "$root/qualification-dossiers.json" \
            --decisions "$root/decision-preview.json" --maintenance "$root/maintenance-preview.json" \
            --repair "$root/repair-preview.json" --confirmation "$root/repair-confirmation-preview.json" \
            --repair-report "$root/repair-plan-preview.json" --status-report "$root/status-transition-preview.json" \
            --logo-maintenance "$root/logo-maintenance-preview.json" --missing-logo "$root/missing-logo-preview.json" \
            --allow-repair-material-network --allow-logo-material-network --output-dir "$root/v9-preview"
      - name: Prepare safe durable genre hints
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "go-radio-discovery"
          report = json.loads((root / "candidates.json").read_text())
          hints = report.get("suggestedGenreTags", [])
          assert isinstance(hints, list) and len(hints) <= 200
          assert all(isinstance(x, str) and len(x) <= 240 for x in hints)
          (root / "genre-hints.json").write_text(json.dumps({
              "schemaVersion": 1, "publicationAllowed": False,
              "suggestedGenreTags": hints,
          }, ensure_ascii=False, indent=2) + "\n")
          PY
      - name: Upload review-only candidate report
        uses: actions/upload-artifact@v4
        with:
          name: go-radio-discovery-${{ github.run_id }}
          path: ${{ runner.temp }}/go-radio-discovery/
          if-no-files-found: error
          retention-days: 14

  persist-preview-state:
    name: Persist non-publishing evidence in isolated Git branch
    needs: discovery-preview
    if: github.ref == 'refs/heads/feature/radio-daily-discovery-lab-20261120'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: state/go-radio-discovery-preview
      - uses: actions/download-artifact@v4
        with:
          name: go-radio-discovery-${{ github.run_id }}
          path: ${{ runner.temp }}/go-radio-state-input
      - name: Validate and persist only evidence files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import re, subprocess
          src = Path(os.environ["RUNNER_TEMP"]) / "go-radio-state-input"
          # Compare-and-swap: never replace observations collected from a different
          # state checkout. A later concurrent push is also rejected by git push.
          parent = (src / "state-parent.txt").read_text().strip()
          if not re.fullmatch("[0-9a-f]{40}", parent) or parent != subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip():
              raise ValueError("durable state changed since discovery; rerun required")
          anchor = src / "release-anchor.json"
          if not 0 < anchor.stat().st_size <= 16384:
              raise ValueError("invalid release anchor size")
          pointer = json.loads(anchor.read_bytes())
          context = json.loads((src / "release-context.json").read_bytes())
          if (context.get("signatureVerified") is not True or context.get("publicationAllowed") is not False
                  or context.get("advanced") is not False or pointer.get("release_sequence") != 8
                  or pointer.get("content_sha256") != "f57e65f24f5ddd3a567907b28903fc309ea4c16747873b39f8d5a44348266f40"
                  or pointer.get("release_sequence") != context.get("selectedSequence")
                  or pointer.get("content_sha256") != context.get("selectedSha256")):
              raise ValueError("release anchor does not match verified context")
          dst = Path("radio-discovery-state")
          dst.mkdir(exist_ok=True)
          for name in ("ledger.json", "genre-hints.json", "stream-evidence.json", "logo-preview.json", "qualification-dossiers.json", "editorial-preview.json", "continuity-preview.json", "hls-preview.json", "decision-preview.json", "metadata-preview.json", "artist-research-preview.json", "programme-preview.json", "recording-preview.json", "wikidata-preview.json", "qualification-v3-preview.json", "maintenance-preview.json", "repair-preview.json", "repair-confirmation-preview.json", "repair-plan-preview.json", "status-transition-preview.json", "logo-maintenance-preview.json", "missing-logo-preview.json"):
              path = src / name
              if name in ("stream-evidence.json", "logo-preview.json", "qualification-dossiers.json", "editorial-preview.json", "continuity-preview.json", "hls-preview.json", "decision-preview.json", "metadata-preview.json", "artist-research-preview.json", "programme-preview.json", "recording-preview.json", "wikidata-preview.json", "qualification-v3-preview.json", "maintenance-preview.json", "repair-preview.json", "repair-confirmation-preview.json", "repair-plan-preview.json", "status-transition-preview.json", "logo-maintenance-preview.json", "missing-logo-preview.json") and not path.exists():
                  continue
              assert path.stat().st_size <= 12 * 1024 * 1024
              data = json.loads(path.read_text())
              assert data.get("schemaVersion") == 1
              assert data.get("publicationAllowed") is False
              if name == "ledger.json":
                  assert data.get("automaticallyApprovedCount") == 0
                  assert isinstance(data.get("records"), list)
              if name == "stream-evidence.json":
                  assert data.get("technicallyQualifiedCount") == 0
              if name == "logo-preview.json":
                  assert data.get("approvedLogoCount") == 0
                  assert all(r.get("logoApproved") is False and r.get("publicationAllowed") is False for r in data["records"])
              if name in ("decision-preview.json", "metadata-preview.json"):
                  assert data.get("approvedCount") == 0
                  assert all(r.get("approved") is False and r.get("publicationAllowed") is False for r in data["records"])
              if name == "missing-logo-preview.json":
                  assert data.get("approvedLogoCount") == 0 and data.get("catalogChanged") is False
                  assert all(r.get("logoApproved") is False and r.get("publicationAllowed") is False and "url" not in r for r in data["records"])
              if name == "logo-maintenance-preview.json":
                  assert data.get("approvedLogoCount") == 0 and data.get("catalogChanged") is False
                  assert all(r.get("logoApproved") is False and r.get("publicationAllowed") is False for r in data["records"])
                  assert all(r.get("publicationAllowed") is False and "url" not in r for r in data["sources"])
              if name == "status-transition-preview.json":
                  assert data.get("approvedCount") == 0 and data.get("candidateCatalogueWritten") is False
                  assert all(r.get("approved") is False and r.get("publicationAllowed") is False for r in data["records"] + data["proposals"])
                  assert all(r.get("publicationAllowed") is False and "url" not in r for r in data["streams"])
              if name == "repair-plan-preview.json":
                  assert data.get("approvedCount") == 0 and data.get("signed") is False and data.get("candidateCatalogueWritten") is False
                  assert all(r.get("approved") is False and r.get("publicationAllowed") is False and "url" not in r for r in data["proposals"] + data["statusReviews"])
              if name == "repair-confirmation-preview.json":
                  assert data.get("approvedCount") == 0
                  assert all(r.get("approved") is False and r.get("publicationAllowed") is False for r in data["records"])
              if name == "repair-preview.json":
                  assert data.get("approvedCount") == 0
                  assert all(r.get("approved") is False and r.get("publicationAllowed") is False for r in data["records"])
                  assert all(h.get("broadcasterVerified") is False and h.get("technicalVerified") is False and h.get("publicationAllowed") is False and "url" not in h for r in data["records"] for h in r["hints"])
              if name == "maintenance-preview.json":
                  assert data.get("approvedCount") == 0
                  assert all(r.get("approved") is False and r.get("publicationAllowed") is False for r in data["records"])
                  assert all(r.get("publicationAllowed") is False and "url" not in r for r in data["streams"])
              if name == "qualification-v3-preview.json":
                  assert data.get("policyVersion") == 3 and data.get("basePolicyVersion") == 2
                  assert data.get("approvedCount") == 0 and data.get("verifiedArtistCount") == 0
                  assert all(r.get("approved") is False and r.get("publicationAllowed") is False and r.get("verifiedArtistCount") == 0 for r in data["records"])
              if name == "programme-preview.json":
                  assert data.get("approvedCount") == 0 and data.get("verifiedArtistCount") == 0
                  assert all(r.get("approved") is False and r.get("publicationAllowed") is False and r.get("verifiedArtistCount") == 0 for r in data["records"])
              if name == "wikidata-preview.json":
                  assert data.get("approvedCount") == 0 and isinstance(data.get("entries"), dict)
                  assert all(r.get("identityVerified") is False and r.get("publicationAllowed") is False for r in data["entries"].values())
              if name == "recording-preview.json":
                  assert data.get("approvedCount") == 0 and isinstance(data.get("entries"), dict)
                  assert all(r.get("identityVerified") is False and r.get("publicationAllowed") is False and "titleHint" not in r for r in data["entries"].values())
              if name == "artist-research-preview.json":
                  assert data.get("approvedCount") == 0
                  assert isinstance(data.get("entries"), dict)
                  assert all(r.get("identityVerified") is False and r.get("publicationAllowed") is False for r in data["entries"].values())
              if name == "hls-preview.json":
                  assert data.get("technicallyQualifiedCount") == 0
                  assert all(r.get("technicalQualified") is False and r.get("publicationAllowed") is False for r in data["records"])
              if name == "continuity-preview.json":
                  assert data.get("technicallyQualifiedCount") == 0
                  assert all(r.get("technicalQualified") is False and r.get("publicationAllowed") is False for r in data["records"])
              if name == "editorial-preview.json":
                  assert data.get("editoriallyApprovedCount") == 0
                  assert all(r.get("editorialApproved") is False and r.get("publicationAllowed") is False for r in data["records"])
              if name == "qualification-dossiers.json":
                  assert data.get("approvedCount") == 0
                  assert all(r.get("approved") is False and r.get("publicationAllowed") is False for r in data["records"])
              (dst / name).write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          # Persist the public signed reference with the evidence in one Git commit.
          (dst / "release-anchor.json").write_bytes(anchor.read_bytes())
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- radio-discovery-state/
          if git diff --cached --quiet; then
            echo "Durable evidence already up to date"
          else
            git commit -m "state(radio-preview): retain discovery evidence"
            git push origin HEAD:refs/heads/state/go-radio-discovery-preview
          fi
