name: Grosses Ondes — Radio Browser daily discovery preview

on:
  push:
    branches:
      - feature/radio-daily-discovery-lab-20261120
    paths:
      - "radio-catalog-lab/tools/radio_daily_discovery.py"
      - "radio-catalog-lab/tools/test_radio_daily_discovery.py"
      - "radio-catalog-lab/tools/radio_daily_candidate_ledger.py"
      - "radio-catalog-lab/tools/test_radio_daily_candidate_ledger.py"
      - "radio-catalog-lab/tools/radio_catalog_daily_candidate_reconcile.py"
      - "radio-catalog-lab/tools/test_radio_catalog_daily_candidate_reconcile.py"
      - "radio-catalog-lab/tools/radio_stream_technical_probe.py"
      - "radio-catalog-lab/tools/test_radio_stream_technical_probe.py"
      - "radio-catalog-lab/tools/radio_stream_playlist_preview.py"
      - "radio-catalog-lab/tools/test_radio_stream_playlist_preview.py"
      - "radio-catalog-lab/tools/test_radio_stream_socket_integration.py"
      - "radio-catalog-lab/tools/radio_stream_recheck_ledger.py"
      - "radio-catalog-lab/tools/test_radio_stream_recheck_ledger.py"
      - ".github/workflows/radio-catalog-daily-discovery.yml"
  workflow_dispatch:
    inputs:
      run_stream_probes:
        description: "Enable up to 20 safe audio sample probes (preview only)"
        required: false
        type: boolean
        default: true
  # Only GitHub's default branch executes scheduled workflows. This schedule
  # is dormant on this isolated review branch until explicitly approved.
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: go-radio-daily-discovery-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discovery-tests:
    name: Contract tests (offline, no catalogue writes)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate candidate engine without network
        run: |
          python -m unittest discover -s radio-catalog-lab/tools -p "test_radio_daily*.py" -v
          python -m unittest discover -s radio-catalog-lab/tools -p "test_radio_catalog_daily_candidate_reconcile.py" -v
          python -m unittest discover -s radio-catalog-lab/tools -p "test_radio_stream_technical_probe.py" -v
          python -m unittest discover -s radio-catalog-lab/tools -p "test_radio_stream_playlist_preview.py" -v
          python -m unittest discover -s radio-catalog-lab/tools -p "test_radio_stream_socket_integration.py" -v
          python -m unittest discover -s radio-catalog-lab/tools -p "test_radio_stream_recheck_ledger.py" -v

  discovery-preview:
    name: Limited global radio scan — candidates only
    needs: discovery-tests
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read durable discovery state
        uses: actions/checkout@v4
        with:
          ref: state/go-radio-discovery-preview
          path: go-radio-state-checkout
          persist-credentials: false
          sparse-checkout: |
            radio-discovery-state
      - name: Restore durable evidence or bootstrap once from validated collection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous="$RUNNER_TEMP/go-radio-previous"
          mkdir -p "$previous"
          state=go-radio-state-checkout/radio-discovery-state
          if [[ -f "$state/ledger.json" ]]; then
            cp "$state/ledger.json" "$previous/ledger.json"
            cp "$state/genre-hints.json" "$previous/candidates.json"
            if [[ -f "$state/stream-evidence.json" ]]; then
              cp "$state/stream-evidence.json" "$previous/stream-evidence.json"
            fi
          else
            # Bootstrap from the last verified v8 reconciliation, never
            # silently reset an existing state on a transport error.
            gh run download 45606141697 --repo "$GITHUB_REPOSITORY" \
              --name go-radio-discovery-45606141697 --dir "$previous"
            test -f "$previous/ledger.json"
          fi
      - name: Scan Radio Browser without UUID allowlist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/go-radio-discovery"
          # On branch pushes, only a tiny real-network sample is used.
          # Scheduled/manual runs explore many music tags and rotated pages.
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            python radio-catalog-lab/tools/radio_daily_discovery.py \
              --tags "metal,punk,hard rock,black metal,thrash metal,trash metal,pagan metal,nu metal" \
              --names "metal,punk,hard rock,nu metal" \
              --page-size 50 --max-pages 1 --crawl-delay 0.3 \
              --output "$RUNNER_TEMP/go-radio-discovery/candidates.json"
          else
            # Previous review-only tags are allowed to extend the taxonomy,
            # but never authorize a radio, stream, logo or station deletion.
            prior=()
            if [[ -f "$RUNNER_TEMP/go-radio-previous/candidates.json" ]]; then
              prior=(--previous-report "$RUNNER_TEMP/go-radio-previous/candidates.json")
            fi
            python radio-catalog-lab/tools/radio_daily_discovery.py \
              --page-size 100 --max-pages 3 --crawl-delay 0.3 \
              "${prior[@]}" \
              --output "$RUNNER_TEMP/go-radio-discovery/candidates.json"
          fi
      - name: Reconcile candidates against pinned TEST v8 (read-only)
        shell: bash
        env:
          BASELINE_SHA256: f57e65f24f5ddd3a567907b28903fc309ea4c16747873b39f8d5a44348266f40
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/go-radio-v8-baseline.json"
          curl --fail --silent --show-error --max-time 45 --max-filesize 2000000 \
            "https://raw.githubusercontent.com/Sarogal/Ondes-Catalogues/feature/go-radio-test-v2-isolated-20261123/grossesondes/radio-test-v2/releases/${BASELINE_SHA256}.json" \
            --output "$baseline"
          printf '%s  %s\n' "$BASELINE_SHA256" "$baseline" | sha256sum --check --strict
          # Digest is pinned to the previously signed TEST v8. This is a
          # classification-only report, not authority to admit or sign.
          python radio-catalog-lab/tools/radio_catalog_daily_candidate_reconcile.py \
            --catalog "$baseline" \
            --discovery "$RUNNER_TEMP/go-radio-discovery/candidates.json" \
            --output "$RUNNER_TEMP/go-radio-discovery/reconciliation-v8.json"
      - name: Retain cross-day candidates without approving any stream
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/go-radio-previous/ledger.json" ]]; then
            python radio-catalog-lab/tools/radio_daily_candidate_ledger.py \
              --scan "$RUNNER_TEMP/go-radio-discovery/candidates.json" \
              --output "$RUNNER_TEMP/go-radio-discovery/ledger.json" \
              --previous "$RUNNER_TEMP/go-radio-previous/ledger.json"
          else
            python radio-catalog-lab/tools/radio_daily_candidate_ledger.py \
              --scan "$RUNNER_TEMP/go-radio-discovery/candidates.json" \
              --output "$RUNNER_TEMP/go-radio-discovery/ledger.json"
          fi
      - name: Bounded audio byte sampling of new candidates
        if: github.event_name != 'workflow_dispatch' || inputs.run_stream_probes == true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "go-radio-discovery"
          discovery = json.loads((root / "candidates.json").read_text())
          reconciliation = json.loads((root / "reconciliation-v8.json").read_text())
          assert discovery["publicationAllowed"] is False
          assert reconciliation["automaticAdmissionAllowed"] is False
          candidates = {r["stationuuid"] for r in reconciliation["candidates"]
                        if r["classification"] == "unmapped_candidate"}
          discovery["candidates"] = [r for r in discovery["candidates"]
                                     if r["stationuuid"] in candidates
                                     and r.get("editorialSignal") != "electronic_context_review"]
          (root / "probe-candidates.json").write_text(json.dumps(discovery))
          PY
          previous=()
          if [[ -f "$RUNNER_TEMP/go-radio-previous/stream-evidence.json" ]]; then
            previous=(--previous-evidence "$RUNNER_TEMP/go-radio-previous/stream-evidence.json")
          fi
          python radio-catalog-lab/tools/radio_stream_technical_probe.py \
            --discovery "$RUNNER_TEMP/go-radio-discovery/probe-candidates.json" \
            --output "$RUNNER_TEMP/go-radio-discovery/technical-probes.json" \
            --limit 20 --workers 4 --allow-network "${previous[@]}"
      - name: Track technical samples over separate days (never approve streams)
        if: github.event_name != 'workflow_dispatch' || inputs.run_stream_probes == true
        shell: bash
        run: |
          set -euo pipefail
          previous=()
          if [[ -f "$RUNNER_TEMP/go-radio-previous/stream-evidence.json" ]]; then
            previous=(--previous "$RUNNER_TEMP/go-radio-previous/stream-evidence.json")
          fi
          python radio-catalog-lab/tools/radio_stream_recheck_ledger.py \
            --probe "$RUNNER_TEMP/go-radio-discovery/technical-probes.json" \
            --output "$RUNNER_TEMP/go-radio-discovery/stream-evidence.json" \
            "${previous[@]}"
      - name: Prepare safe durable genre hints
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "go-radio-discovery"
          report = json.loads((root / "candidates.json").read_text())
          hints = report.get("suggestedGenreTags", [])
          assert isinstance(hints, list) and len(hints) <= 200
          assert all(isinstance(x, str) and len(x) <= 240 for x in hints)
          (root / "genre-hints.json").write_text(json.dumps({
              "schemaVersion": 1, "publicationAllowed": False,
              "suggestedGenreTags": hints,
          }, ensure_ascii=False, indent=2) + "\n")
          PY
      - name: Upload review-only candidate report
        uses: actions/upload-artifact@v4
        with:
          name: go-radio-discovery-${{ github.run_id }}
          path: ${{ runner.temp }}/go-radio-discovery/
          if-no-files-found: error
          retention-days: 14

  persist-preview-state:
    name: Persist non-publishing evidence in isolated Git branch
    needs: discovery-preview
    if: github.ref == 'refs/heads/feature/radio-daily-discovery-lab-20261120'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: state/go-radio-discovery-preview
      - uses: actions/download-artifact@v4
        with:
          name: go-radio-discovery-${{ github.run_id }}
          path: ${{ runner.temp }}/go-radio-state-input
      - name: Validate and persist only evidence files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          src = Path(os.environ["RUNNER_TEMP"]) / "go-radio-state-input"
          dst = Path("radio-discovery-state")
          dst.mkdir(exist_ok=True)
          for name in ("ledger.json", "genre-hints.json", "stream-evidence.json"):
              path = src / name
              if name == "stream-evidence.json" and not path.exists():
                  continue
              assert path.stat().st_size <= 12 * 1024 * 1024
              data = json.loads(path.read_text())
              assert data.get("schemaVersion") == 1
              assert data.get("publicationAllowed") is False
              if name == "ledger.json":
                  assert data.get("automaticallyApprovedCount") == 0
                  assert isinstance(data.get("records"), list)
              if name == "stream-evidence.json":
                  assert data.get("technicallyQualifiedCount") == 0
              (dst / name).write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- radio-discovery-state/
          if git diff --cached --quiet; then
            echo "Durable evidence already up to date"
          else
            git commit -m "state(radio-preview): retain discovery evidence"
            git push origin HEAD:refs/heads/state/go-radio-discovery-preview
          fi
