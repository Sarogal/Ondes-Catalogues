  persist-preview-state:
    name: Persist non-publishing evidence in isolated Git branch
    needs: discovery-preview
    if: github.ref == 'refs/heads/feature/radio-daily-discovery-lab-20261120'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      state-commit: ${{ steps.state-revision.outputs.sha }}
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: state/go-radio-autonomous
      - name: Require exact collection artifact identity
        shell: bash
        env:
          REPORT_NAME: ${{ needs.discovery-preview.outputs.report-name }}
        run: |
          set -euo pipefail
          [[ "$REPORT_NAME" =~ ^go-radio-discovery-${GITHUB_RUN_ID}-attempt-[1-9][0-9]*$ ]]
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.discovery-preview.outputs.report-name }}
          path: ${{ runner.temp }}/go-radio-state-input
      - name: Validate and persist only evidence files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import re, subprocess
          src = Path(os.environ["RUNNER_TEMP"]) / "go-radio-state-input"
          # Compare-and-swap: never replace observations collected from a different
          # state checkout. A later concurrent push is also rejected by git push.
          parent = (src / "state-parent.txt").read_text().strip()
          if not re.fullmatch("[0-9a-f]{40}", parent) or parent != subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip():
              raise ValueError("durable state changed since discovery; rerun required")
          anchor = src / "release-anchor.json"
          if not 0 < anchor.stat().st_size <= 16384:
              raise ValueError("invalid release anchor size")
          pointer = json.loads(anchor.read_bytes())
          context = json.loads((src / "release-context.json").read_bytes())
          if (context.get("signatureVerified") is not True or context.get("publicationAllowed") is not False
                  or context.get("advanced") is not False or pointer.get("release_sequence",0) < 9
                  or context.get("remoteReadbackVerified") is not True or context.get("deploymentVerified") is not True
                  or context.get("simulated") is not False
                  or anchor.read_bytes() != Path("radio-discovery-state/release-anchor.json").read_bytes()
                  or pointer.get("release_sequence") != context.get("selectedSequence")
                  or pointer.get("content_sha256") != context.get("selectedSha256")):
              raise ValueError("release anchor does not match verified context")
          dst = Path("radio-discovery-state")
          dst.mkdir(exist_ok=True)
          for name in ("ledger.json", "genre-hints.json", "stream-evidence.json", "logo-preview.json", "qualification-dossiers.json", "editorial-preview.json", "continuity-preview.json", "hls-preview.json", "decision-preview.json", "metadata-preview.json", "artist-research-preview.json", "programme-preview.json", "recording-preview.json", "wikidata-preview.json", "qualification-v3-preview.json", "maintenance-preview.json", "repair-preview.json", "repair-confirmation-preview.json", "repair-plan-preview.json", "status-transition-preview.json", "logo-maintenance-preview.json", "missing-logo-preview.json"):
              path = src / name
              if name in ("stream-evidence.json", "logo-preview.json", "qualification-dossiers.json", "editorial-preview.json", "continuity-preview.json", "hls-preview.json", "decision-preview.json", "metadata-preview.json", "artist-research-preview.json", "programme-preview.json", "recording-preview.json", "wikidata-preview.json", "qualification-v3-preview.json", "maintenance-preview.json", "repair-preview.json", "repair-confirmation-preview.json", "repair-plan-preview.json", "status-transition-preview.json", "logo-maintenance-preview.json", "missing-logo-preview.json") and not path.exists():
                  continue
              assert path.stat().st_size <= 12 * 1024 * 1024
              data = json.loads(path.read_text())
              assert data.get("schemaVersion") == 1
              assert data.get("publicationAllowed") is False
              if name == "ledger.json":
                  assert data.get("automaticallyApprovedCount") == 0
                  assert isinstance(data.get("records"), list)
              if name == "stream-evidence.json":
                  assert data.get("technicallyQualifiedCount") == 0
              if name == "logo-preview.json":
                  assert data.get("approvedLogoCount") == 0
                  assert all(r.get("logoApproved") is False and r.get("publicationAllowed") is False for r in data["records"])
              if name in ("decision-preview.json", "metadata-preview.json"):
                  assert data.get("approvedCount") == 0
                  assert all(r.get("approved") is False and r.get("publicationAllowed") is False for r in data["records"])
              if name == "missing-logo-preview.json":
                  assert data.get("approvedLogoCount") == 0 and data.get("catalogChanged") is False
                  assert all(r.get("logoApproved") is False and r.get("publicationAllowed") is False and "url" not in r for r in data["records"])
              if name == "logo-maintenance-preview.json":
                  assert data.get("approvedLogoCount") == 0 and data.get("catalogChanged") is False
                  assert all(r.get("logoApproved") is False and r.get("publicationAllowed") is False for r in data["records"])
                  assert all(r.get("publicationAllowed") is False and "url" not in r for r in data["sources"])
              if name == "status-transition-preview.json":
                  assert data.get("approvedCount") == 0 and data.get("candidateCatalogueWritten") is False
                  assert all(r.get("approved") is False and r.get("publicationAllowed") is False for r in data["records"] + data["proposals"])
                  assert all(r.get("publicationAllowed") is False and "url" not in r for r in data["streams"])
              if name == "repair-plan-preview.json":
                  assert data.get("approvedCount") == 0 and data.get("signed") is False and data.get("candidateCatalogueWritten") is False
                  assert all(r.get("approved") is False and r.get("publicationAllowed") is False and "url" not in r for r in data["proposals"] + data["statusReviews"])
              if name == "repair-confirmation-preview.json":
                  assert data.get("approvedCount") == 0
                  assert all(r.get("approved") is False and r.get("publicationAllowed") is False for r in data["records"])
              if name == "repair-preview.json":
                  assert data.get("approvedCount") == 0
                  assert all(r.get("approved") is False and r.get("publicationAllowed") is False for r in data["records"])
                  assert all(h.get("broadcasterVerified") is False and h.get("technicalVerified") is False and h.get("publicationAllowed") is False and "url" not in h for r in data["records"] for h in r["hints"])
              if name == "maintenance-preview.json":
                  assert data.get("approvedCount") == 0
                  assert all(r.get("approved") is False and r.get("publicationAllowed") is False for r in data["records"])
                  assert all(r.get("publicationAllowed") is False and "url" not in r for r in data["streams"])
              if name == "qualification-v3-preview.json":
                  assert data.get("policyVersion") == 3 and data.get("basePolicyVersion") == 2
                  assert data.get("approvedCount") == 0 and data.get("verifiedArtistCount") == 0
                  assert all(r.get("approved") is False and r.get("publicationAllowed") is False and r.get("verifiedArtistCount") == 0 for r in data["records"])
              if name == "programme-preview.json":
                  assert data.get("approvedCount") == 0 and data.get("verifiedArtistCount") == 0
                  assert all(r.get("approved") is False and r.get("publicationAllowed") is False and r.get("verifiedArtistCount") == 0 for r in data["records"])
              if name == "wikidata-preview.json":
                  assert data.get("approvedCount") == 0 and isinstance(data.get("entries"), dict)
                  assert all(r.get("identityVerified") is False and r.get("publicationAllowed") is False for r in data["entries"].values())
              if name == "recording-preview.json":
                  assert data.get("approvedCount") == 0 and isinstance(data.get("entries"), dict)
                  assert all(r.get("identityVerified") is False and r.get("publicationAllowed") is False and "titleHint" not in r for r in data["entries"].values())
              if name == "artist-research-preview.json":
                  assert data.get("approvedCount") == 0
                  assert isinstance(data.get("entries"), dict)
                  assert all(r.get("identityVerified") is False and r.get("publicationAllowed") is False for r in data["entries"].values())
              if name == "hls-preview.json":
                  assert data.get("technicallyQualifiedCount") == 0
                  assert all(r.get("technicalQualified") is False and r.get("publicationAllowed") is False for r in data["records"])
              if name == "continuity-preview.json":
                  assert data.get("technicallyQualifiedCount") == 0
                  assert all(r.get("technicalQualified") is False and r.get("publicationAllowed") is False for r in data["records"])
              if name == "editorial-preview.json":
                  assert data.get("editoriallyApprovedCount") == 0
                  assert all(r.get("editorialApproved") is False and r.get("publicationAllowed") is False for r in data["records"])
              if name == "qualification-dossiers.json":
                  assert data.get("approvedCount") == 0
                  assert all(r.get("approved") is False and r.get("publicationAllowed") is False for r in data["records"])
              (dst / name).write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          # Persist only bounded query identities and retry dates, never raw URLs.
          retry = src / "discovery-retry.json"
          if retry.exists():
              import datetime as dt
              assert retry.stat().st_size <= 512*1024
              queue = json.loads(retry.read_bytes())
              assert set(queue) == {"schemaVersion","publicationAllowed","scanDate","pending"}
              assert queue["schemaVersion"] == 1 and queue["publicationAllowed"] is False
              day = dt.date.fromisoformat(queue["scanDate"])
              assert day.isoformat() == queue["scanDate"] and day <= dt.datetime.now(dt.timezone.utc).date()
              assert isinstance(queue["pending"],list) and len(queue["pending"]) <= 512
              seen = set()
              for row in queue["pending"]:
                  assert set(row) == {"field","term","offset","pageSize","firstFailureDate","lastAttemptDate","attemptCount","nextAttemptDate"}
                  term,size,offset = row["term"],row["pageSize"],row["offset"]
                  assert row["field"] in ("tag","name") and isinstance(term,str) and 1 <= len(term) <= 60
                  assert term == term.strip() and re.fullmatch(r"[\w !&+/\-]+",term,re.UNICODE)
                  assert type(size) is int and 1 <= size <= 250
                  assert type(offset) is int and 0 <= offset <= 35000 and offset % size == 0
                  key = (row["field"],term,offset,size)
                  assert key not in seen
                  seen.add(key)
                  first,last,next_day = [dt.date.fromisoformat(row[k]) for k in ("firstFailureDate","lastAttemptDate","nextAttemptDate")]
                  assert first <= last <= day and last < next_day <= last+dt.timedelta(days=7)
                  assert type(row["attemptCount"]) is int and 1 <= row["attemptCount"] <= 20
              (dst / "discovery-retry.json").write_text(json.dumps(queue,ensure_ascii=False,indent=2)+"\n")
          # Only exact objects named by the authenticated current catalogue may be
          # retained. Never copy an arbitrary artifact subtree into Git.
          cache_report = src / "inherited-artwork-cache.json"
          if cache_report.exists():
              import hashlib, stat
              baseline = (src / "inherited-artwork-baseline.json").read_bytes()
              sha = hashlib.sha256(baseline).hexdigest()
              assert sha == pointer["content_sha256"]
              doc = json.loads(baseline)
              report = json.loads(cache_report.read_bytes())
              assert report["catalogBaselineSha256"] == sha and report["publicationAllowed"] is False
              allowed = {}
              ext = {"image/png":"png", "image/jpeg":"jpg", "image/webp":"webp"}
              for station in doc["stations"]:
                  logo = station.get("logo")
                  if logo:
                      allowed[logo["sha256"]+"."+ext[logo["mime_type"]]] = logo
              incoming = src / "inherited-artwork-cache"
              files = list(incoming.iterdir()) if incoming.is_dir() else []
              local_count = report.get("localImportedCount",0)
              network_count = report.get("networkRecoveredCount",report["recoveredCount"])
              assert type(local_count) is int and 0 <= local_count <= 100
              assert type(network_count) is int and 0 <= network_count <= 36
              assert len(files) == report["recoveredCount"] == local_count+network_count <= 136
              assert sum(item.stat().st_size for item in files) <= 48*1024*1024
              cache = dst / "artwork-cache" / "sha256"
              cache.mkdir(parents=True, exist_ok=True)
              assert not cache.is_symlink() and not cache.parent.is_symlink()
              for item in files:
                  assert item.name in allowed and stat.S_ISREG(item.lstat().st_mode)
                  logo = allowed[item.name]
                  assert item.stat().st_size == logo["byte_size"] <= 2*1024*1024
                  data = item.read_bytes()
                  assert hashlib.sha256(data).hexdigest() == logo["sha256"]
                  target = cache / item.name
                  if target.exists() or target.is_symlink():
                      assert stat.S_ISREG(target.lstat().st_mode) and target.read_bytes() == data
                  else:
                      with target.open("xb") as f:
                          f.write(data)
          # Persist the public signed reference with the evidence in one Git commit.
          (dst / "release-anchor.json").write_bytes(anchor.read_bytes())
          (dst / "release-context.json").write_bytes((src / "release-context.json").read_bytes())
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- radio-discovery-state/
          if git diff --cached --quiet; then
            echo "Durable evidence already up to date"
          else
            git commit -m "state(radio-autonomous): retain discovery evidence"
            git push origin HEAD:refs/heads/state/go-radio-autonomous
          fi

      - name: Record exact persisted evidence revision
        id: state-revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  sign-successor:
    needs: [discovery-preview, persist-preview-state]
    if: vars.RADIO_LAB_AUTONOMOUS_ENABLED == 'true' && vars.RADIO_LAB_AUTONOMOUS_APPROVED_SHA == github.sha && needs.discovery-preview.outputs.candidate == 'true' && github.ref == 'refs/heads/feature/radio-daily-discovery-lab-20261120'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: radio-lab-signing
    permissions:
      contents: read
      actions: read
    outputs:
      changed: ${{ steps.sign.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "cryptography==45.0.7" "jsonschema==4.23.0" "Pillow==11.3.0"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.persist-preview-state.outputs.state-commit }}
          path: go-autonomous-state
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.discovery-preview.outputs.report-name }}
          path: ${{ runner.temp }}/reports
      - name: Independently qualify and sign only a real successor
        id: sign
        env:
          RADIO_LAB_PUBLIC_KEY: ${{ vars.RADIO_LAB_PUBLIC_KEY }}
          RADIO_LAB_KEY_ID: ${{ vars.RADIO_LAB_KEY_ID }}
          RADIO_LAB_ENCRYPTED_KEY: ${{ secrets.RADIO_LAB_ENCRYPTED_KEY }}
          RADIO_LAB_PASSPHRASE: ${{ secrets.RADIO_LAB_PASSPHRASE }}
          RADIO_LAB_JOB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python radio-catalog-lab/tools/radio_lab_successor_sign.py \
            --state go-autonomous-state/radio-discovery-state --reports "$RUNNER_TEMP/reports" \
            --bundle "$RUNNER_TEMP/signed-bundle" --receipt "$RUNNER_TEMP/signed-receipt.json" \
            --next-state "$RUNNER_TEMP/preflight-state"
          python - <<'PY'
          import os,json
          from pathlib import Path
          receipt=json.loads((Path(os.environ["RUNNER_TEMP"])/"signed-receipt.json").read_bytes())
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              print("changed="+str(receipt["changed"]).lower(),file=f)
          PY
      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.changed == 'true'
        with:
          name: radio-successor-signed
          path: |
            ${{ runner.temp }}/signed-bundle/
            ${{ runner.temp }}/signed-receipt.json
          if-no-files-found: error
          retention-days: 7

  transport-successor:
    needs: [sign-successor, persist-preview-state]
    if: needs.sign-successor.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: radio-lab-transport
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "cryptography==45.0.7" "jsonschema==4.23.0" "Pillow==11.3.0"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.persist-preview-state.outputs.state-commit }}
          path: go-autonomous-state
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: radio-successor-signed
          path: ${{ runner.temp }}/signed-input
      - name: Transfer exact signed public successor
        env:
          RADIO_LAB_PUBLIC_KEY: ${{ vars.RADIO_LAB_PUBLIC_KEY }}
          RADIO_LAB_KEY_ID: ${{ vars.RADIO_LAB_KEY_ID }}
          RADIO_LAB_JOB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python radio-catalog-lab/tools/radio_lab_successor_transport.py \
            --state go-autonomous-state/radio-discovery-state \
            --bundle "$RUNNER_TEMP/signed-input/signed-bundle" \
            --signed-receipt "$RUNNER_TEMP/signed-input/signed-receipt.json" \
            --transfer-receipt "$RUNNER_TEMP/transfer-receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: radio-successor-transferred
          path: ${{ runner.temp }}/transfer-receipt.json
          if-no-files-found: error
          retention-days: 7

  accept-successor:
    needs: [transport-successor, persist-preview-state]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: radio-lab-readback
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "cryptography==45.0.7" "jsonschema==4.23.0" "Pillow==11.3.0"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.persist-preview-state.outputs.state-commit }}
          path: go-autonomous-state
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: radio-successor-transferred
          path: ${{ runner.temp }}
      - name: Independently verify public successor and migrate exact evidence
        env:
          RADIO_LAB_PUBLIC_KEY: ${{ vars.RADIO_LAB_PUBLIC_KEY }}
          RADIO_LAB_KEY_ID: ${{ vars.RADIO_LAB_KEY_ID }}
          RADIO_LAB_JOB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python radio-catalog-lab/tools/radio_lab_successor_readback.py \
            --state go-autonomous-state/radio-discovery-state \
            --transfer-receipt "$RUNNER_TEMP/transfer-receipt.json" \
            --acceptance "$RUNNER_TEMP/acceptance.json" --next-state "$RUNNER_TEMP/next-state"
      - uses: actions/upload-artifact@v4
        with:
          name: radio-successor-accepted
          path: |
            ${{ runner.temp }}/acceptance.json
            ${{ runner.temp }}/next-state/
          if-no-files-found: error
          retention-days: 7

  commit-successor-state:
    needs: [accept-successor, persist-preview-state]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: radio-lab-transport
    permissions:
      contents: write
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.persist-preview-state.outputs.state-commit }}
          path: go-autonomous-state
      - uses: actions/download-artifact@v4
        with:
          name: radio-successor-accepted
          path: ${{ runner.temp }}/accepted-input
      - name: Record exact accepted deployment and commit state with lease
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_STATE: ${{ needs.persist-preview-state.outputs.state-commit }}
        shell: bash
        run: |
          set -euo pipefail
          cd go-autonomous-state
          test "$(git rev-parse HEAD)" = "$EXPECTED_STATE"
          python - <<'PY'
          import hashlib,json,os,re,shutil,subprocess
          from pathlib import Path
          repo="repos/Sarogal/Ondes-Catalogues/"
          ref="radio-lab-publisher-rehearsal"
          state=Path("radio-discovery-state")
          source=Path(os.environ["RUNNER_TEMP"])/"accepted-input"
          nxt=source/"next-state"
          a=json.loads((source/"acceptance.json").read_bytes())
          old=json.loads((state/"release-context.json").read_bytes())
          new=json.loads((nxt/"release-context.json").read_bytes())
          p=json.loads((nxt/"release-anchor.json").read_bytes())
          def api(path,body=None):
              cmd=["gh","api",repo+path]
              if body is not None: cmd+=["--method","POST","--input","-"]
              return json.loads(subprocess.check_output(cmd,input=None if body is None else json.dumps(body).encode()))
          commit=a["gitCommit"]
          assert re.fullmatch(r"[a-f0-9]{40}",commit)
          assert a["simulated"] is False and a["remoteReadbackVerified"] is True and a["deploymentVerified"] is True
          assert a["parent"]==old["gitCommit"] and a["selectedSequence"]==old["selectedSequence"]+1
          assert new["previousSha256"]==old["selectedSha256"] and new["advanced"] is True
          assert new["selectedSequence"]==a["selectedSequence"]==p["release_sequence"]
          assert new["selectedSha256"]==a["selectedSha256"]==p["content_sha256"]
          body=(nxt/"release-baseline.json").read_bytes()
          assert hashlib.sha256(body).hexdigest()==a["selectedSha256"] and len(body)==p["content_length"]
          assert api("git/ref/heads/state/go-radio-autonomous")["object"]["sha"]==os.environ["EXPECTED_STATE"], "state changed concurrently"
          assert api("git/ref/heads/"+ref)["object"]["sha"]==commit, "remote release changed concurrently"
          deployment=api("deployments",{"ref":ref,"environment":ref,"auto_merge":False,
              "required_contexts":[],"production_environment":False,"transient_environment":True,
              "description":"Verified isolated radio successor"})
          assert deployment["sha"]==commit and deployment["ref"]==ref
          status=api("deployments/"+str(deployment["id"])+"/statuses",{
              "state":"success","environment":ref,
              "environment_url":"https://raw.githubusercontent.com/Sarogal/Ondes-Catalogues/refs/heads/radio-lab-publisher-rehearsal/pointer.json",
              "description":"Independent signed successor and public artwork verification passed"})
          assert status["state"]=="success"
          assert api("git/ref/heads/"+ref)["object"]["sha"]==commit
          new.update(gitCommit=commit,deploymentId=deployment["id"],remoteReadbackVerified=True,
              deploymentVerified=True,simulated=False,mirroredLegacyArtwork=True)
          (nxt/"release-context.json").write_text(json.dumps(new,ensure_ascii=False,indent=2)+"\n")
          for oldfile in state.glob("*.json"):
              if oldfile.name!="discovery-retry.json": oldfile.unlink()
          for item in nxt.glob("*.json"):
              assert item.is_file() and not item.is_symlink()
              shutil.copyfile(item,state/item.name)
          ext={"image/png":"png","image/jpeg":"jpg","image/webp":"webp"}
          allowed={s["logo"]["sha256"]+"."+ext[s["logo"]["mime_type"]]:s["logo"]
                   for s in json.loads(body)["stations"] if s.get("logo")}
          for item in (nxt/"artwork-cache"/"sha256").glob("*"):
              assert item.is_file() and not item.is_symlink() and item.name in allowed
              data=item.read_bytes()
              logo=allowed[item.name]
              assert len(data)==logo["byte_size"] and hashlib.sha256(data).hexdigest()==logo["sha256"]
              target=state/"artwork-cache"/"sha256"/item.name
              target.parent.mkdir(parents=True,exist_ok=True)
              assert not target.is_symlink()
              if target.exists(): assert target.read_bytes()==data
              else: target.write_bytes(data)
          print("RADIO_LAB_SUCCESSOR_STATE_READY",new["selectedSequence"],deployment["id"])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- radio-discovery-state
          git commit -m "state(radio-autonomous): adopt verified real successor"
          git push origin HEAD:refs/heads/state/go-radio-autonomous
