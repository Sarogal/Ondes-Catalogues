name: GO radio v8 — four additional publisher station images SHA (read only)
on:
  push:
    branches:
      - feature/go-radio-v8-metalon-3-logos-20261123
    paths:
      - 'radio-catalog-lab/tools/audit_v8_four_official_station_logos.py'
      - '.github/workflows/go-radio-v8-four-firstparty-logos-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-four-publisher-station-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoder
        run: python -m pip install 'pillow>=10,<12'
      - name: Validate station and homepage identities offline
        run: |
          python radio-catalog-lab/tools/audit_v8_four_official_station_logos.py \
            --output "$RUNNER_TEMP/four-official-offline.json"
      - name: Download and compare exact official logo bytes
        run: |
          python radio-catalog-lab/tools/audit_v8_four_official_station_logos.py \
            --network --output "$RUNNER_TEMP/four-official-network.json"
      - name: Print individually qualified sources, no publication
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'four-official-network.json').read_text())
          assert d['scope']=='GO_V8_FOUR_FIRSTPARTY_STATION_IMAGES_READ_ONLY'
          assert d['audited_station_count']==4 and d['publication_allowed'] is False
          print('GO_V8_FOUR_SOURCE_IMAGE_SHA_VERIFIED',d['image_sha_verified_count'],'/4')
          for item in d['records']:
            print('GO_V8_OFFICIAL_SOURCE',item['go_station_id'],item['station_name'],
                  item['status'],item.get('sha256',''),item.get('reason',''),
                  item['browser_observed_station_image'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: go-v8-four-official-station-logos-sha-evidence
          path: |
            ${{ runner.temp }}/four-official-offline.json
            ${{ runner.temp }}/four-official-network.json
          retention-days: 14
