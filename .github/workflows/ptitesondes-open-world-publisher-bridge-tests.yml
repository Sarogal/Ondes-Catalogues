name: "P'tites Ondes — pont Publisher national (tests isolés)"

on:
  pull_request:
    paths:
      - 'scripts/ptitesondes_open_world_patch_bridge.py'
      - 'scripts/ptitesondes_delegated_source_authority.py'
      - 'scripts/ptitesondes_secondary_municipal_site_proof.py'
      - 'scripts/ptitesondes_municipal_event_venue_ban.py'
      - 'scripts/ptitesondes_shared_venue_location_evidence.py'
      - 'scripts/ptitesondes_open_world_release_rehearsal.py'
      - 'scripts/ptitesondes_openagenda_v2_direct_evidence.py'
      - 'scripts/run_cloud_sync.py'
      - 'tests/test_ptitesondes_open_world_patch_bridge.py'
      - 'tests/test_ptitesondes_delegated_source_authority.py'
      - 'tests/test_ptitesondes_secondary_municipal_site_proof.py'
      - 'tests/test_ptitesondes_municipal_event_venue_ban.py'
      - '.github/workflows/ptitesondes-open-world-publisher-bridge-tests.yml'

permissions:
  contents: read

jobs:
  isolated-publisher-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate real merge with independent live-proof fixtures
        env:
          PYTHONWARNINGS: error
        run: |
          python -m unittest discover -s tests -p 'test_ptitesondes_open_world_patch_bridge.py' -v
          python -m unittest discover -s tests -p 'test_ptitesondes_delegated_source_authority.py' -v
          python -m unittest discover -s tests -p 'test_ptitesondes_secondary_municipal_site_proof.py' -v
          python -m unittest discover -s tests -p 'test_ptitesondes_municipal_event_venue_ban.py' -v
      - name: Regression — open-world municipal source and geography
        env:
          PYTHONWARNINGS: error
        run: |
          python -m unittest discover -s tests -p 'test_ptitesondes_open_world_release_rehearsal.py' -v
          python -m unittest discover -s tests -p 'test_ptitesondes_unnumbered_official_geo_proof.py' -v
