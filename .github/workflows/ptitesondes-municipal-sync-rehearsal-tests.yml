name: "P'tites Ondes — répétition synchroniseur municipal sans publication"

on:
  push:
    branches:
      - 'feat/ptitesondes-municipal-sync-rehearsal-20261116'
    paths:
      - 'scripts/ptitesondes_municipal_sync_rehearsal.py'
      - 'tests/test_ptitesondes_municipal_sync_rehearsal.py'
      - '.github/workflows/ptitesondes-municipal-sync-rehearsal-tests.yml'
  pull_request:
    paths:
      - 'scripts/ptitesondes_municipal_sync_rehearsal.py'
      - 'tests/test_ptitesondes_municipal_sync_rehearsal.py'
      - '.github/workflows/ptitesondes-municipal-sync-rehearsal-tests.yml'

permissions:
  contents: read

jobs:
  read-only-sync-rehearsal:
    if: github.repository == 'Sarogal/Ondes-Catalogues'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: "Tests adversariaux : neuf séances fictives, zéro publication"
        run: |
          python -m unittest discover -s tests -p 'test_ptitesondes_municipal_sync_rehearsal.py' -v
      - name: "Confirmer le mode non publiant"
        run: |
          echo "Public runner, no secrets, no cron, no patch, no catalogue write."
