name: GO radio TEST v8 — final 29 official logo SHA audit before signing
on:
  push:
    branches:
      - feature/go-radio-v8-metalon-3-logos-20261123
    paths:
      - 'radio-catalog-lab/tools/test_go_radio_v8_29_official_sha_gate.py'
      - 'radio-catalog-lab/full-staging/UNSIGNED-radio-v8-metalon-3-independent-3-firstparty-7-maximum-3-broadcaster-7-indep6-20261123.json'
      - 'grossesondes/radio-test-v2/artwork/staging-indep-six-v8/**'
      - '.github/workflows/go-radio-v8-twentynine-final-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-29-original-logo-shas-with-signed-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original image decoder, Ed25519 verifier and schema
        run: python -m pip install 'pillow>=10,<12' 'cryptography>=42,<47' 'jsonschema>=4.21,<5'
      - name: Full original SHA, stream, favorite UUID and redirect continuity gate
        run: python radio-catalog-lab/tools/test_go_radio_v8_29_official_sha_gate.py
      - name: Forbid signed catalogue or live TEST mutations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('grossesondes/radio-test-v2')
          cur=json.loads((base/'current.json').read_text())
          assert cur['release_sequence']==7
          assert cur['content_sha256']=='f735884aa0841a86d88aaafe406e62b7a826cf9cd60f6a70285a0894326841aa'
          assert not (base/'current-v8.json').exists()
          print('GO_RADIO_V8_29_ONLY_UNSIGNED_TEST_V7_AND_PRODUCTION_SAFE')
          PY
