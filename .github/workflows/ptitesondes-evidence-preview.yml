name: P'tites Ondes — prévalidation indépendante des sorties

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ptitesondes_candidate_promotion.py'
      - 'scripts/proof_text.py'
      - 'scripts/official_organizer_proof.py'
      - 'tests/test_official_organizer_proof.py'
      - 'tests/test_ptitesondes_candidate_promotion.py'
      - '.github/workflows/ptitesondes-evidence-preview.yml'
  pull_request:
    paths:
      - 'scripts/ptitesondes_candidate_promotion.py'
      - 'scripts/proof_text.py'
      - 'scripts/official_organizer_proof.py'
      - 'tests/test_official_organizer_proof.py'
      - 'tests/test_ptitesondes_candidate_promotion.py'
      - '.github/workflows/ptitesondes-evidence-preview.yml'
  workflow_dispatch:
  schedule:
    # Rapport indépendant après les contrôles privés (UTC).
    - cron: '40 08 * * *'
    - cron: '40 11 * * *'
    - cron: '40 15 * * *'
    - cron: '40 19 * * *'

permissions:
  contents: read

concurrency:
  group: ptitesondes-independent-evidence-preview
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Non-regression promotion et protection de production
        run: |
          python -m unittest discover -s tests -p 'test_ptitesondes_candidate_promotion.py' -v
          python -m unittest discover -s tests -p 'test_cloud_policy.py' -v
          python -m unittest discover -s tests -p 'test_daily_outings_proof.py' -v
          python -m unittest discover -s tests -p 'test_official_organizer_proof.py' -v

  preview:
    needs: tests
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Preview candidat officiel + lieu documenté
        env:
          PRIVATE_INTAKE_READ_TOKEN: ${{ secrets.PRIVATE_INTAKE_READ_TOKEN }}
          CYCLE_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          # An explicit cron maps each scheduled preview to a distinct
          # deterministic batch, even when GitHub starts a job late.
          case "$CYCLE_CRON" in
            '40 08 * * *') SLOT=0 ;;
            '40 11 * * *') SLOT=1 ;;
            '40 15 * * *') SLOT=2 ;;
            '40 19 * * *') SLOT=3 ;;
            *) SLOT=0 ;;
          esac
          python scripts/ptitesondes_candidate_promotion.py --limit 15 --slot "$SLOT"
          {
            echo "## Contrôle indépendant — aucune publication"
            PYTHONPATH=scripts python -c 'import json; from ptitesondes_candidate_promotion import public_run_summary; r=json.load(open("/tmp/ptitesondes-promotion/report.json")); print(json.dumps(public_run_summary(r),ensure_ascii=False,indent=2))'
          } >> "$GITHUB_STEP_SUMMARY"
