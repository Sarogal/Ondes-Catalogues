name: GO radio — safe three-logo SHA rotation candidate audit
on:
  push:
    branches: [feature/go-radio-full-staging-validation-20261122]
    paths:
      - '.github/workflows/go-radio-missing-sha-proposals.yml'
      - 'radio-catalog-lab/tools/propose_missing_sha_logo_revisions.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pillow>=10,<13'
      - name: Retrieve audited v5 and 86-byte-perfect archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/input" "$RUNNER_TEMP/sha"
          gh run download 45070247465 --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/input" --pattern go-radio-v5-316-legacy-evidence-admission-unsigned
          gh run download 45070029450 --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/sha" --pattern go-radio-immutable-test-artwork-sha-objects-bundle
      - name: Stage new bytes only if decoder safe, never falsify old SHA-256
        run: |
          CATALOG=$(find "$RUNNER_TEMP/input" -name full-test-v5-unsigned-preflight.json -print -quit)
          MANIFEST=$(find "$RUNNER_TEMP/sha" -name manifest-preview.json -print -quit)
          test -n "$CATALOG" && test -n "$MANIFEST"
          python radio-catalog-lab/tools/propose_missing_sha_logo_revisions.py \
            --catalog "$CATALOG" --manifest "$MANIFEST" \
            --outdir "$RUNNER_TEMP/logo-proposals"
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads((Path(os.environ["RUNNER_TEMP"])/"logo-proposals"/"unsigned-proposals.json").read_text())
          assert report["approved_image_changes"]==0
          assert report["updated_radio_catalog"] is False
          assert report["updated_remote_pointer"] is False
          assert report["signed_or_published"] is False
          assert len(report["proposals"])==3
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: go-radio-three-logo-new-sha-proposals-unsigned
          path: ${{ runner.temp }}/logo-proposals/
          retention-days: 14
