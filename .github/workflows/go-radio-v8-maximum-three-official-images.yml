name: GO radio v8 — Radio Maximum 3 original broadcaster images (READ ONLY)
on:
  push:
    branches:
      - feature/go-radio-v8-metalon-3-logos-20261123
    paths:
      - 'radio-catalog-lab/tools/audit_v8_maximum_three_official_channel_logos.py'
      - '.github/workflows/go-radio-v8-maximum-three-official-images.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-three-channel-identities-and-original-shas:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded image verifier
        run: python -m pip install 'pillow>=10,<12'
      - name: Validate all three expected station identities offline
        run: |
          python radio-catalog-lab/tools/audit_v8_maximum_three_official_channel_logos.py \
            --output "$RUNNER_TEMP/maximum-offline.json"
      - name: Check official broadcaster channel HTML and original image SHAs
        run: |
          python radio-catalog-lab/tools/audit_v8_maximum_three_official_channel_logos.py \
            --network --output "$RUNNER_TEMP/maximum-online.json"
      - name: Assert read-only scope and report evidence
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'maximum-online.json').read_text())
          assert r['scope']=='GO_V8_MAXIMUM_3_CHANNEL_ORIGINAL_SHA_READ_ONLY'
          assert len(r['records'])==3 and r['expected_stations']==3
          assert r['catalog_mutated'] is False and r['publication_allowed'] is False
          for x in r['records']:
              print(x['go_station_id'],x['station_name'],x['status'],
                    x.get('sha256','NO_SHA'),x['channel_image_html_identity_verified'])
          print('GO_RADIO_V8_MAXIMUM_READ_ONLY_AUDIT_COMPLETE')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: go-v8-maximum-three-official-sha-read-only
          path: ${{ runner.temp }}/maximum-online.json
          retention-days: 14
