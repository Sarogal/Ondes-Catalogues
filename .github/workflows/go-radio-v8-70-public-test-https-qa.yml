name: GO TEST radio v8 — HTTPS delivery for all 70 signed-candidate SHA logo images
on:
  push:
    branches:
      - feature/go-radio-v8-metalon-3-logos-20261123
    paths:
      - 'radio-catalog-lab/tools/test_go_radio_v8_70_https_delivery.py'
      - '.github/workflows/go-radio-v8-70-public-test-https-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  strict-test-image-http-and-sha:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify full SHA bytes over 200/HTTPS, no HTTP redirects or MIME mismatch
        run: python radio-catalog-lab/tools/test_go_radio_v8_70_https_delivery.py
      - name: Ensure no pointer or catalog mutation
        run: |
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import json
          from pathlib import Path
          ptr=json.loads(Path("grossesondes/radio-test-v2/current.json").read_bytes())
          assert ptr["release_sequence"]==7
          assert ptr["content_sha256"]=="f735884aa0841a86d88aaafe406e62b7a826cf9cd60f6a70285a0894326841aa"
          print("GO_V8_70_IMAGES_HTTPS_OK_SIGNED_V7_TEST_UNCHANGED")
          PY
