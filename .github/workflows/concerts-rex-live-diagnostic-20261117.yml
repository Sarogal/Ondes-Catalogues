name: Diagnostic ponctuel Rex HTML brut (lecture seule)
on:
  pull_request:
    paths:
      - '.github/workflows/concerts-rex-live-diagnostic-20261117.yml'

permissions:
  contents: read

jobs:
  rex-raw-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lire la page Rex sans secrets ni publication
        shell: bash
        run: |
          python - <<'PY'
          import re
          import sys
          from html import unescape
          sys.path.insert(0, 'automation/concerts')
          import official_recheck as rex

          URL = "https://www.lerextoulouse.com/fr/programmation/spicy-box-mooan-exis-/"
          raw = rex.download_official(URL, {})
          doc = rex.Detail()
          doc.feed(raw)
          plain = unescape(re.sub(r"<[^>]*>", " ", raw))
          print("RAW_HTTP_BYTES:", len(raw.encode('utf-8')))
          print("RAW_HTML_HAS_PROMOTER_TEXT:", bool(re.search(r"les productions du possible", plain, re.I)))
          print("RAW_HTML_HAS_EXACT_BILL:", bool(re.search(r"spicy\s*box\s*\+\s*mooan\s*exis", plain, re.I)))
          print("PARSED_PARAGRAPHS:", sum(kind == 'p' for kind, _ in doc.records))
          print("PARSED_HEADINGS:", sum(kind == 'h2' for kind, _ in doc.records))
          try:
              detail = rex.parse_detail(raw)
              parts = rex.artist_names(detail["title"])
              desc = detail["descriptionParagraphs"]
              print("DETAIL_TITLE:", detail["title"])
              print("DETAIL_DATE:", detail["date"])
              print("DETAIL_PARTS:", len(parts))
              print("DETAIL_DESCRIPTION_PARAGRAPHS:", len(desc))
              print("DESCRIPTION_HAS_PROMOTER_TEXT:", any("productions du possible" in p.lower() for p in desc))
              print("DESCRIPTION_HAS_EXACT_BILL:", any(bool(re.search(r"spicy\s*box\s*\+\s*mooan\s*exis", p, re.I)) for p in desc))
              print("PROMOTER_BILL_STRICT_ACCEPT:", rex.rex_promoter_confirms_bill(desc, parts))
          except Exception as exc:
              print("PARSE_FAILURE_CLASS:", type(exc).__name__)
              print("PARSE_FAILURE_REASON:", str(exc)[:160])
          PY
