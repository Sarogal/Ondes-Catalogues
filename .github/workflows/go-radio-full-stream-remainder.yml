name: GO radio — 310 remaining live streams (TEST staging only)
on:
  push:
    branches:
      - feature/go-radio-full-staging-validation-20261122
    paths:
      - '.github/workflows/go-radio-full-stream-remainder.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: go-full-stream-rest-staging
  cancel-in-progress: false
jobs:
  probe-remaining:
    name: "Batch ${{ matrix.offset }}–${{ matrix.end }}"
    runs-on: ubuntu-latest
    timeout-minutes: 13
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {offset: 48, count: 40, end: 87}
          - {offset: 88, count: 40, end: 127}
          - {offset: 128, count: 40, end: 167}
          - {offset: 168, count: 40, end: 207}
          - {offset: 208, count: 40, end: 247}
          - {offset: 248, count: 40, end: 287}
          - {offset: 288, count: 40, end: 327}
          - {offset: 328, count: 30, end: 357}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bundled audio decoder without changing app
        run: python -m pip install 'imageio-ffmpeg>=0.5,<1'
      - name: Probe bounded source URLs with exact error reasons
        shell: bash
        run: |
          python radio-catalog-lab/tools/probe_full_radio_streams_20261122.py \
            radio-catalog-lab/full-staging/candidate-20261122.json \
            --offset ${{ matrix.offset }} --max-streams ${{ matrix.count }} --workers 6 \
            --report "$RUNNER_TEMP/go-streams-${{ matrix.offset }}-${{ matrix.end }}.json"
      - name: Show aggregate only, no source credentials or entire URLs in logs
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"]) / "go-streams-${{ matrix.offset }}-${{ matrix.end }}.json").read_text())
          assert r["probed_streams"] == ${{ matrix.count }}
          assert r["publication_authorized"] is False
          print(json.dumps({"offset":${{ matrix.offset }}, "checked":r["probed_streams"], "decoded":r["verified_this_run"], "reasons":r["reason_counts"]},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: go-audio-evidence-${{ matrix.offset }}-${{ matrix.end }}
          path: ${{ runner.temp }}/go-streams-${{ matrix.offset }}-${{ matrix.end }}.json
          retention-days: 7
