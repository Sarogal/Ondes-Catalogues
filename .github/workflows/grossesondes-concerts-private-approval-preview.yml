name: Concerts — valider une PR d'approbations privées sur runner public

on:
  pull_request:
    paths:
      - '.github/workflows/grossesondes-concerts-private-approval-preview.yml'
      - 'scripts/concerts_private_approval_preview.py'
      - 'tests/test_concerts_private_approval_preview.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/grossesondes-concerts-private-approval-preview.yml'
      - 'scripts/concerts_private_approval_preview.py'
      - 'tests/test_concerts_private_approval_preview.py'
  workflow_dispatch:
    inputs:
      private_head_sha:
        description: SHA exact de la révision de PR privée à contrôler
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: grossesondes-concerts-private-approvals-readonly
  cancel-in-progress: false

jobs:
  # Untrusted PR code is tested WITHOUT access to any private token.
  preview-unit-tests:
    if: github.repository == 'Sarogal/Ondes-Catalogues'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tester les corrections et signatures sans secret
        run: python -m unittest discover -s tests -p 'test_concerts_private_approval_preview.py' -v

  private-approval-check:
    # Only the trusted main branch can read private data. No pull_request trigger.
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Sarogal/Ondes-Catalogues' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tester la sécurité du vérificateur sans accéder aux secrets
        run: python -m unittest discover -s tests -p 'test_concerts_private_approval_preview.py' -v
      - name: Valider les approbations privées sans publier ni divulguer les sources
        env:
          GROSSES_ONDES_INTAKE_READ_TOKEN: ${{ secrets.GROSSES_ONDES_INTAKE_READ_TOKEN }}
          PRIVATE_HEAD_SHA: ${{ inputs.private_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PRIVATE_HEAD_SHA" || ! "$PRIVATE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::SHA de PR privée absent ou invalide."
            exit 1
          fi
          if [[ -z "$GROSSES_ONDES_INTAKE_READ_TOKEN" ]]; then
            echo "::error::Accès privé de lecture absent : prévalidation impossible."
            exit 1
          fi
          # API GET only. Private PR is DATA, not executable code.
          # Never emit private payloads, evidence, errors or API responses.
          if ! python scripts/concerts_private_approval_preview.py \
              --head-sha "$PRIVATE_HEAD_SHA" \
              > "$RUNNER_TEMP/concerts-private-preview.log" 2>&1; then
            # Only a fixed non-confidential step code may enter the public log.
            for stage in READ_MAIN READ_HEAD READ_PUBLIC MERGE UNEXPECTED; do
              if grep -Fq "PREVIEW_STAGE=$stage" "$RUNNER_TEMP/concerts-private-preview.log"; then
                echo "PREVIEW_STAGE=$stage"
              fi
            done
            echo "::error::Prévalidation privée refusée ; aucun contenu privé divulgué."
            exit 1
          fi
          echo "Prévalidation sûre : historiques conservés, modifications approuvées vérifiées par le synchroniseur, aucune publication." >> "$GITHUB_STEP_SUMMARY"
          echo "Runner public ; lecture des approbations via un jeton privé de portée limitée." >> "$GITHUB_STEP_SUMMARY"
      - name: Confirmer l'absence totale d'écriture ou d'artefact privé
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          echo "Aucune modification des dépôts ou des catalogues."
