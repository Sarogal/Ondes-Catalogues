name: P'tites Ondes — validation logs prives sur runner public
on:
  push:
    branches:
      - ci/ptitesondes-sync-logs-20261112
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ptitesondes-private-sync-logs-20261112
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validation des controles de publication et conservation
        run: |
          python -m unittest discover -s tests -p 'test_cloud_policy.py' -v
          python -m unittest discover -s tests -p 'test_daily_outings_proof.py' -v
          python -m unittest discover -s tests -p 'test_ptitesondes_places.py' -v
          python -m unittest discover -s tests -p 'test_ptitesondes_place_preflight.py' -v
