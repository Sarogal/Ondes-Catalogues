name: GO TEST radio v8 — publisher smoke without CairoSVG or native libcairo
on:
  push:
    branches:
      - feature/go-radio-v8-metalon-3-logos-20261123
    paths:
      - 'radio-catalog-lab/tools/test_go_radio_v8_70_canonical_test_release_gate.py'
      - 'radio-catalog-lab/tools/publish_go_radio_v8_test.py'
      - '.github/workflows/go-radio-v8-windows-no-cairo-publisher-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  no-cairo-local-publishing-code-path:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal signer dependencies (NO CairoSVG / libcairo)
        run: python -m pip install 'Pillow==11.3.0' 'cryptography>=42,<47' 'jsonschema>=4.21,<5'
      - name: Verify no CairoSVG package installed
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("cairosvg") is None, "CairoSVG must be absent to prove no native-Cairo dependency"
          print("NATIVE_CAIRO_NOT_INSTALLED")
          PY
      - name: Fetch TEST signed predecessor and 70 permanent hosted originals
        run: git fetch --no-tags --depth=1 origin '+refs/heads/feature/go-radio-test-v2-isolated-20261123:refs/remotes/origin/feature/go-radio-test-v2-isolated-20261123'
      - name: Execute exact Windows publisher preflight path without CairoSVG
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,"radio-catalog-lab/tools")
          from test_go_radio_v8_70_canonical_test_release_gate import preflight
          from publish_go_radio_v8_test import KEY_ID, EXPECTED_TEST_ASSETS_COMMIT
          assert KEY_ID == "go-apk-test-20261122-v2"
          assert EXPECTED_TEST_ASSETS_COMMIT == "2e5cc9233439317401f0fba31d10065d89009c84"
          result=preflight(remote=True,prior_qa=False)
          assert result["new_sha_objects_in_TEST"] == 70
          assert result["verified_test_sha_byte_objects"] == 70
          assert result["current_signed_sequence"] == 7
          assert result["with_logo"] == 259 and result["without_logo"] == 26
          assert "cairosvg" not in sys.modules
          print("GO_TEST_V8_WINDOWS_NO_CAIRO_PREFLIGHT_PASS",result)
          PY
          python radio-catalog-lab/tools/publish_go_radio_v8_test.py --help
      - name: No publication and pristine signed v7 branch
        run: |
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("grossesondes/radio-test-v2/current.json").read_bytes())
          assert p["release_sequence"]==7
          assert p["content_sha256"]=="f735884aa0841a86d88aaafe406e62b7a826cf9cd60f6a70285a0894326841aa"
          print("SIGNING_KEY_NOT_LOADED_TEST_V7_ACTIVE")
          PY
