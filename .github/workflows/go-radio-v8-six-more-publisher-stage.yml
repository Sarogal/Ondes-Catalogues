name: GO radio v8 — stage six independently verified publisher logos (DEV only)
on:
  push:
    branches:
      - feature/go-radio-v8-metalon-3-logos-20261123
    paths:
      - 'radio-catalog-lab/tools/stage_v8_six_more_official_logos.py'
      - '.github/workflows/go-radio-v8-six-more-publisher-stage.yml'
permissions:
  contents: write
  actions: read
jobs:
  stage-six-more-original-logos-no-signed-catalogue:
    if: github.ref == 'refs/heads/feature/go-radio-v8-metalon-3-logos-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original Ed25519, image and schema tools
        run: python -m pip install 'pillow>=10,<12' 'cryptography>=42,<47' 'jsonschema>=4.21,<5'
      - name: Audit predecessor signed-v7 and 23 original SHA files
        run: python radio-catalog-lab/tools/test_go_radio_v8_23_official_sha_gate.py
      - name: Fetch immutable 7-station audit (six accepted only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/6-more-evidence"
          gh run download 45168508032 --repo "$GITHUB_REPOSITORY" \
            --pattern go-v8-seven-more-original-first-party-image-shas \
            --dir "$RUNNER_TEMP/6-more-evidence"
      - name: Double-check actual six original image SHA files, stage only unsigned
        run: |
          python radio-catalog-lab/tools/stage_v8_six_more_official_logos.py \
            --artifact-root "$RUNNER_TEMP/6-more-evidence"
      - name: Strict staging allowlist
        run: |
          git add -- radio-catalog-lab/full-staging/UNSIGNED-radio-v8-metalon-3-independent-3-firstparty-7-maximum-3-broadcaster-7-indep6-20261123.json \
            grossesondes/radio-test-v2/artwork/staging-indep-six-v8/
          python - <<'PY'
          import subprocess
          files=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          name='radio-catalog-lab/full-staging/UNSIGNED-radio-v8-metalon-3-independent-3-firstparty-7-maximum-3-broadcaster-7-indep6-20261123.json'
          prefix='grossesondes/radio-test-v2/artwork/staging-indep-six-v8/'
          assert len(files)==7 and name in files,files
          assert len([p for p in files if p.startswith(prefix) and p.endswith(('.png','.jpg','.webp'))])==6
          assert all(p==name or p.startswith(prefix) for p in files)
          print('GO_V8_SIX_MORE_ORIGINAL_SHA_BLOBS_ALLOWLIST_PASS')
          PY
      - name: Commit unsigned candidate and SHA filenames only
        run: |
          git -c user.name='Grosses Ondes TEST Logo Auditor' \
            -c user.email='go-logo-audit@localhost.invalid' \
            -c commit.gpgsign=false commit \
            -m 'test(radio v8): stage six more official station logo originals unsigned'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
