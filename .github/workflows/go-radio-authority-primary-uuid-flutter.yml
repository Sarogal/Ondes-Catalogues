name: GO radio — server-authoritative selector V64 identity Flutter tests
on:
  push:
    branches:
      - feature/go-radio-full-staging-validation-20261122
    paths:
      - 'radio-catalog-lab/flutter/lib/central_authoritative_catalog_selector.dart'
      - 'radio-catalog-lab/flutter/lib/central_radio_catalog_client.dart'
      - 'radio-catalog-lab/flutter/lib/central_signed_artwork_work_queue.dart'
      - 'radio-catalog-lab/flutter/test/central_signed_artwork_work_queue_test.dart'
      - 'radio-catalog-lab/flutter/lib/central_android_auto_artwork_index.dart'
      - 'radio-catalog-lab/flutter/test/central_android_auto_artwork_index_test.dart'
      - 'radio-catalog-lab/flutter/test/central_authoritative_catalog_selector_test.dart'
      - '.github/workflows/go-radio-authority-primary-uuid-flutter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter-central-only:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: radio-catalog-lab/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Flutter analyzer in isolated authoritative lab
        run: flutter analyze --fatal-infos
      - name: Test exact server-authoritative selector, old media IDs and signed offline cache
        run: flutter test --reporter expanded test/central_authoritative_catalog_selector_test.dart
      - name: Verify disk-cache hydration and later remote SHA fetch always both execute
        run: flutter test --reporter expanded test/central_signed_artwork_work_queue_test.dart
      - name: Verify SHA artwork continuity after signed GO-ID merges in Android Auto
        run: flutter test --reporter expanded test/central_android_auto_artwork_index_test.dart
