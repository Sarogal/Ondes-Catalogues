name: GO radio v8 — stage 3 verified Radio Maximum publisher logos (DEV only)
on:
  push:
    branches:
      - feature/go-radio-v8-metalon-3-logos-20261123
    paths:
      - 'radio-catalog-lab/tools/stage_v8_maximum_three_channel_logos.py'
      - '.github/workflows/go-radio-v8-maximum-three-stage.yml'
permissions:
  contents: write
  actions: read
jobs:
  stage-maximum-three-original-sha-blobs:
    if: github.ref == 'refs/heads/feature/go-radio-v8-metalon-3-logos-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded original image verifier and Ed25519 catalogue guard
        run: python -m pip install 'pillow>=10,<12' 'cryptography>=42,<47' 'jsonschema>=4.21,<5'
      - name: Fetch immutable Radio Maximum source audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/maximum-evidence"
          gh run download 45166112250 --repo "$GITHUB_REPOSITORY" \
            --pattern go-v8-maximum-three-official-sha-read-only \
            --dir "$RUNNER_TEMP/maximum-evidence"
      - name: Re-fetch all three exact original SHA images and stage unsigned only
        run: |
          python radio-catalog-lab/tools/stage_v8_maximum_three_channel_logos.py \
            --artifact-root "$RUNNER_TEMP/maximum-evidence"
      - name: Require exact 3 original WEBP blobs plus one unsigned candidate
        run: |
          git add -- radio-catalog-lab/full-staging/UNSIGNED-radio-v8-metalon-3-independent-3-firstparty-7-maximum-3-20261123.json \
            grossesondes/radio-test-v2/artwork/staging-maximum-v8/
          python - <<'PY'
          import subprocess
          files=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          new='radio-catalog-lab/full-staging/UNSIGNED-radio-v8-metalon-3-independent-3-firstparty-7-maximum-3-20261123.json'
          prefix='grossesondes/radio-test-v2/artwork/staging-maximum-v8/'
          assert len(files)==4 and new in files,files
          assert len([x for x in files if x.startswith(prefix) and x.endswith('.webp')])==3
          assert all(x==new or x.startswith(prefix) for x in files)
          print('GO_V8_MAXIMUM_3_ORIGINAL_SHA_DEV_ONLY_ALLOWLIST_PASS')
          PY
      - name: Commit only development unsigned v8 candidate and original SHA files
        run: |
          git -c user.name='Grosses Ondes TEST Logo Auditor' \
            -c user.email='go-logo-audit@localhost.invalid' \
            -c commit.gpgsign=false commit \
            -m 'test(radio v8): stage 3 Radio Maximum channel logo SHAs unsigned'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
