name: GO radio TEST v8 — final 23 original broadcaster logo SHAs QA
on:
  push:
    branches:
      - feature/go-radio-v8-metalon-3-logos-20261123
    paths:
      - 'radio-catalog-lab/tools/test_go_radio_v8_23_official_sha_gate.py'
      - 'radio-catalog-lab/full-staging/UNSIGNED-radio-v8-metalon-3-independent-3-firstparty-7-maximum-3-broadcaster-7-20261123.json'
      - 'grossesondes/radio-test-v2/artwork/staging-broadcasters-v8/**'
      - '.github/workflows/go-radio-v8-twentythree-final-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-23-original-shas-to-signed-TEST-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install signed Ed25519, safe image decoder and schema tools
        run: python -m pip install 'pillow>=10,<12' 'cryptography>=42,<47' 'jsonschema>=4.21,<5'
      - name: Audit all 23 official logos, 320 GO IDs and 363 UUID aliases
        run: python radio-catalog-lab/tools/test_go_radio_v8_23_official_sha_gate.py
      - name: Forbid unsigned promotion, TEST pointer mutation or production changes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("grossesondes/radio-test-v2")
          ptr=json.loads((root/"current.json").read_text())
          assert ptr["release_sequence"]==7
          assert ptr["content_sha256"]=="f735884aa0841a86d88aaafe406e62b7a826cf9cd60f6a70285a0894326841aa"
          assert not (root/"current-v8.json").exists()
          print("GO_RADIO_V8_23_SHA_STAGING_ONLY_TEST_AND_PRODUCTION_UNCHANGED")
          PY
