name: GO TEST v8 — last 28 first-party logo candidates READ ONLY
on:
  push:
    branches:
      - feature/go-radio-v8-metalon-3-logos-20261123
    paths:
      - 'radio-catalog-lab/tools/audit_v8_last28_firstparty_candidates.py'
      - '.github/workflows/go-radio-v8-last28-firstparty-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  audit-candidates-only:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded image decoder
        run: python -m pip install 'Pillow==11.3.0'
      - name: Audit official image bytes twice without staging or publication
        run: |
          python radio-catalog-lab/tools/audit_v8_last28_firstparty_candidates.py --network --output "$RUNNER_TEMP/go-radio-v8-last28-audit.json"
      - name: Preserve image/source evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-radio-v8-last28-firstparty-image-audit
          path: ${{ runner.temp }}/go-radio-v8-last28-audit.json
          if-no-files-found: warn
      - name: Verify no signed catalog or artwork was mutated
        run: |
          git status --short
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("grossesondes/radio-test-v2/current.json")
          c=json.loads(p.read_bytes())
          assert c["release_sequence"] == 7
          assert c["content_sha256"] == "f735884aa0841a86d88aaafe406e62b7a826cf9cd60f6a70285a0894326841aa"
          print("GO_V8_LAST28_READ_ONLY_TEST_V7_INTACT")
          PY
