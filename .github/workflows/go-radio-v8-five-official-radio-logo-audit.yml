name: GO radio v8 — five more publisher logo images original SHA read-only
on:
  push:
    branches: [feature/go-radio-v8-metalon-3-logos-20261123]
    paths:
      - 'radio-catalog-lab/tools/audit_v8_five_official_radio_logo_candidates.py'
      - '.github/workflows/go-radio-v8-five-official-radio-logo-audit.yml'
permissions:
  contents: read
jobs:
  five-logo-source-asset-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded original image decoder
        run: python -m pip install 'pillow>=10,<12'
      - name: Validate exact station name and stream URL identity offline
        run: python radio-catalog-lab/tools/audit_v8_five_official_radio_logo_candidates.py --output "$RUNNER_TEMP/offline.json"
      - name: Fetch original publisher image bytes and record exact SHA-256
        run: python radio-catalog-lab/tools/audit_v8_five_official_radio_logo_candidates.py --network --output "$RUNNER_TEMP/online.json"
      - name: Assert always-read-only audit and five original targets
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'online.json').read_text())
          assert r['scope']=='GO_V8_FIVE_OFFICIAL_RADIO_LOGO_IMAGES_READ_ONLY'
          assert r['count']==5 and len(r['records'])==5
          assert r['signed'] is False and r['published'] is False
          print('GO_RADIO_FIVE_ORIGINAL_LOGO_SOURCE_AUDIT_READ_ONLY')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: go-radio-five-new-publisher-logos-original-sha-evidence
          path: ${{ runner.temp }}/online.json
          retention-days: 14
