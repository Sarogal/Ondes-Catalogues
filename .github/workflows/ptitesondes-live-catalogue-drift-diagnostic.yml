name: "P'tites Ondes — controle live du catalogue sorties (lecture seule)"

# Le JSON du dépôt et la réponse réellement servie peuvent diverger.
# Diagnostic uniquement : aucune publication, aucun secret, aucune action cron.
on:
  pull_request:
    paths:
      - 'scripts/ptitesondes_public_catalogue_live_drift.py'
      - 'scripts/ptitesondes_nonmusical_catalogue_shape_dryrun.py'
      - 'tests/test_ptitesondes_public_catalogue_live_drift.py'
      - 'docs/ptitesondes/sorties.json'
      - '.github/workflows/ptitesondes-live-catalogue-drift-diagnostic.yml'

permissions:
  contents: read

jobs:
  readonly-live-catalogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tester dérives, MIME, HTTP, horodatages et snapshot
        env:
          PYTHONWARNINGS: error
        run: |
          python -m unittest discover -s tests -p 'test_ptitesondes_public_catalogue_live_drift.py' -v
      - name: Comparer le JSON effectivement servi au fichier du dépôt
        env:
          PYTHONWARNINGS: error
        run: |
          python scripts/ptitesondes_public_catalogue_live_drift.py
