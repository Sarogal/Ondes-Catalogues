name: GO radio — consolidate immutable SHA artwork byte archive (TEST only)
on:
  push:
    branches:
      - feature/go-radio-full-staging-validation-20261122
    paths:
      - '.github/workflows/go-radio-immutable-sha-artwork-merge.yml'
      - 'radio-catalog-lab/tools/consolidate_immutable_sha_artwork.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent image decoder
        run: python -m pip install 'pillow>=10,<13'
      - name: Retrieve all 16 byte-verified SHA object shards and signed-preflight radio catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/images" "$RUNNER_TEMP/catalog"
          gh run download 45069722773 --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/images" --pattern go-immutable-logo-test-*
          gh run download 45069330690 --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/catalog" --pattern go-radio-v5-316-legacy-evidence-admission-unsigned
          test "$(find "$RUNNER_TEMP/images" -name audit-report.json | wc -l)" -eq 16
      - name: Verify every archived image independently and assemble read-only digest package
        run: |
          CATALOG=$(find "$RUNNER_TEMP/catalog" -name full-test-v5-unsigned-preflight.json -print -quit)
          test -n "$CATALOG"
          python radio-catalog-lab/tools/consolidate_immutable_sha_artwork.py \
            --catalog "$CATALOG" --input-dir "$RUNNER_TEMP/images" \
            --output-dir "$RUNNER_TEMP/immutable-sha-archive"
      - name: Verify no silent substitution, de-duplication by SHA, and no publication
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'immutable-sha-archive'
          m=json.loads((path/'manifest-preview.json').read_text())
          assert m['immutable_objects_verified']+m['unavailable_or_drifted_objects']==m['expected_unique_descriptors']
          assert m['requested_public_endpoint_write'] is False
          assert m['pointer_modified'] is False and m['keys_written'] is False
          assert m['immutable_objects_verified'] >= 75
          print(json.dumps({'unique_logos':m['expected_unique_descriptors'],
            'byte_exact_sha_objects':m['immutable_objects_verified'],
            'unavailable_or_changed':m['unavailable_or_drifted_objects'],
            'remote_endpoint_changed':False},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: go-radio-immutable-test-artwork-sha-objects-bundle
          path: ${{ runner.temp }}/immutable-sha-archive/
          retention-days: 14
