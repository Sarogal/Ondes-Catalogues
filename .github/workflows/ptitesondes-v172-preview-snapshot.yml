name: "P'tites Ondes — snapshot v172 de production (branche de prévisualisation)"

on:
  push:
    branches:
      - feat/ptitesondes-v173-nonmusic-preview-20261116
    paths:
      - scripts/ptitesondes_v172_capture.py
      - .github/workflows/ptitesondes-v172-preview-snapshot.yml

permissions:
  contents: write

jobs:
  snapshot:
    if: >-
      github.repository == 'Sarogal/Ondes-Catalogues' &&
      github.ref == 'refs/heads/feat/ptitesondes-v173-nonmusic-preview-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feat/ptitesondes-v173-nonmusic-preview-20261116
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture HTTPS non exécutante de la version v172 en ligne
        run: |
          python scripts/ptitesondes_v172_capture.py \
            --output previews/ptitesondes/sorties-v172-live-snapshot.js
      - name: Conserver la copie UNIQUEMENT sur cette branche de travail
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- previews/ptitesondes/sorties-v172-live-snapshot.js
          if git diff --cached --quiet; then
            echo 'Snapshot unchanged'
          else
            git commit -m 'chore(ptitesondes): capture exact served v172 for isolated review'
            git push origin HEAD:feat/ptitesondes-v173-nonmusic-preview-20261116
          fi
