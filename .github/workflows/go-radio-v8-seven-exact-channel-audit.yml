name: GO radio v8 — 7 specific broadcaster channel original logos (READ ONLY)
on:
  push:
    branches: [feature/go-radio-v8-metalon-3-logos-20261123]
    paths:
      - 'radio-catalog-lab/tools/audit_v8_seven_exact_channel_images.py'
      - '.github/workflows/go-radio-v8-seven-exact-channel-audit.yml'
permissions:
  contents: read
jobs:
  verified-raw-broadcaster-image-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install safe image decoder
        run: python -m pip install 'pillow>=10,<12'
      - name: Validate radio identities offline
        run: python radio-catalog-lab/tools/audit_v8_seven_exact_channel_images.py --output "$RUNNER_TEMP/offline.json"
      - name: Verify real broadcaster image files and original SHA256
        run: python radio-catalog-lab/tools/audit_v8_seven_exact_channel_images.py --network --output "$RUNNER_TEMP/online.json"
      - name: Assert READ ONLY
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'online.json').read_text())
          assert r['scope']=='GO_V8_7_EXACT_CHANNEL_ORIGINAL_IMAGE_AUDIT'
          assert r['targets']==7 and len(r['rows'])==7
          assert r['published'] is False and r['catalog_changed'] is False
          print('GO_V8_BROADCASTER_AUDIT_NO_PUBLICATION')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: go-v8-seven-exact-channel-broadcaster-logos-audit
          path: ${{ runner.temp }}/online.json
          retention-days: 14
