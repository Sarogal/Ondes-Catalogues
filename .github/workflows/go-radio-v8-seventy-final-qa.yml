name: GO TEST radio v8 — full QA 70 original SHA artworks vs signed v7
on:
  push:
    branches:
      - feature/go-radio-v8-metalon-3-logos-20261123
    paths:
      - 'radio-catalog-lab/tools/test_go_radio_v8_70_owner_sha_gate.py'
      - 'radio-catalog-lab/full-staging/UNSIGNED-radio-v8-70-official-sha-logos-20261123.json'
      - 'grossesondes/radio-test-v2/artwork/staging-nts-rockirk-v8/**'
      - '.github/workflows/go-radio-v8-seventy-final-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  full-signed-v7-continuity-and-two-new-images:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install signed-catalog and decoded image verifiers
        run: python -m pip install 'Pillow==11.3.0' 'CairoSVG==2.8.2' 'defusedxml==0.7.1' 'cryptography>=42,<47' 'jsonschema>=4.21,<5'
      - name: Verify 70 original SHA artworks and preserved Ed25519 signed v7 lineage
        run: python radio-catalog-lab/tools/test_go_radio_v8_70_owner_sha_gate.py
      - name: No mutation of TEST pointer or release files
        run: |
          test -z "$(git status --porcelain)"
          test ! -e grossesondes/radio-test-v2/current-v8.json
