name: Diagnostic isolé — régression CI partagée
on:
  push:
    branches: [diagnostic/concerts-pr734-shared-ci-20261122]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Examiner uniquement les données de test synthétiques, jamais les données privées
        run: |
          python - <<'PY'
          import sys, json
          from pathlib import Path
          sys.path.insert(0, 'tests')
          import test_ptitesondes_nonmusical_catalogue_shape_dryrun as t
          from ptitesondes_nonmusical_html_gate_router import route_nonmusical_html_session
          print("fixture_day", t.DAY.isoformat())
          print("fixture_leads", len(t.LEADS))
          print("catalogue_revision_day", t.CATALOGUE.get("updated_at", "")[:10])
          p = t.packet()
          stage = route_nonmusical_html_session(p["lead"],p["page"],p["trusted_index"],p["child_prefix"],p["independent_context"],t.DAY)
          print("route_stage", stage.get("stage"))
          event, why = t._prototype(p["lead"],p["page"],p["trusted_index"],p["child_prefix"],p["independent_context"],p["admin_pin"],t.DAY)
          print("prototype_blocker", why)
          out=t.simulate()
          print("rehearsal_blockers", json.dumps({k:v for k,v in out["blockers"].items() if v}, sort_keys=True))
          print("stage_expected", sorted(t.SHAPE_STAGES))
          PY

      - name: Vérifier les transports HTTPS publics épinglés sans contenu ni secret
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()/'automation/concerts'))
          import source_evidence_probe as p
          for host in ('openagenda.com', 'data.geopf.fr', 'api.openstreetmap.org', 'overpass.private.coffee', 'overpass-api.de'):
              try:
                  ips = p.public_ip_addresses(host)
                  print('transport_origin',host,'audited_address_count',len(ips),flush=True)
                  outcomes=[]
                  for addr in ips[:4]:
                      try:
                          status, _ = p.request_pinned('https://'+host+'/robots.txt',host,addr,cap=120000)
                          outcomes.append('http-'+str(status))
                      except (OSError, TimeoutError) as exc:
                          outcomes.append(type(exc).__name__)
                      except ValueError:
                          outcomes.append('http-invalid-status')
                  print('transport_results',host,'/'.join(outcomes),flush=True)
              except (ValueError, OSError) as exc:
                  print('transport_failure',host,type(exc).__name__,flush=True)
          PY

      - name: Examiner la forme des exports officiels OpenAgenda déjà publiés
        run: |
          python - <<'PY'
          import sys, json
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()/'automation/concerts'))
          import source_evidence_probe as p
          ip=p.public_ip_addresses('openagenda.com')[0]
          for uid in ('70657920','27642848'):
              url=('https://openagenda.com/agendas/9969608/events.json'
                   '?oaq%5Buids%5D%5B%5D='+uid+'&limit=1')
              try:
                  status, body=p.request_pinned(url,'openagenda.com',ip,cap=400000)
                  print('official_export',uid,'status',status,'size',len(body),flush=True)
                  if status==200:
                      doc=json.loads(body)
                      ev=(doc.get('events') or [None])[0]
                      if not isinstance(ev,dict):
                          print('no_event_record',flush=True)
                          continue
                      print('record_identity',uid,'uid',ev.get('uid'),
                            'origin',ev.get('origin'),'slug',ev.get('slug'),
                            'canonical_fields',[k for k in ev if 'url' in k.lower()],
                            'description_type',type(ev.get('description')).__name__,
                            'keyword_type',type(ev.get('keywords')).__name__,
                            'event_status',ev.get('status'),flush=True)
              except (ValueError,OSError,TimeoutError) as exc:
                  print('official_export_failed',uid,type(exc).__name__,flush=True)
          PY

      - name: Checkout source-unique genre feature (no secrets)
        uses: actions/checkout@v4
        with:
          ref: feature/concerts-openagenda-official-description-genres-20261122
          path: genre-check
      - name: Test targeted original OpenAgenda description to real publisher
        working-directory: genre-check
        run: python -m unittest discover -s tests -p 'test_concerts_openagenda_description_genres.py' -v
      - name: Checkout hardened OpenAgenda TLS retry (no secrets)
        uses: actions/checkout@v4
        with:
          ref: fix/concerts-oa-transient-tls-retry-20261122
          path: transport-check
      - name: Test targeted TLS retry and SSRF controls
        working-directory: transport-check
        run: python -m unittest discover -s automation/concerts -p 'test_source_evidence_probe.py' -v

      - name: Comparer les règles robots des API publiques avec des URLs fictives
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          from urllib.robotparser import RobotFileParser
          sys.path.insert(0,str(Path.cwd()/'automation/concerts'))
          import source_evidence_probe as p
          targets = {
            'openagenda.com': '/agendas/9969608/events.json?limit=1',
            'data.geopf.fr': '/geocodage/search/?q=rue+fictive',
            'api.openstreetmap.org': '/api/0.6/map?bbox=3.8,43.6,3.81,43.61',
            'overpass.private.coffee': '/api/interpreter?data=%5Bout%3Axml%5D',
            'overpass-api.de': '/api/interpreter?data=%5Bout%3Axml%5D',
          }
          for host,path in targets.items():
              result='transport_unverified'
              for ip in p.public_ip_addresses(host)[:4]:
                  try:
                      status,body=p.request_pinned(
                          'https://'+host+'/robots.txt',host,ip,cap=120000)
                  except (OSError,TimeoutError,ValueError):
                      continue
                  if status==404:
                      result='no_robots_file'
                  else:
                      rp=RobotFileParser()
                      rp.set_url('https://'+host+'/robots.txt')
                      rp.parse(body.splitlines())
                      result='allowed' if rp.can_fetch(
                          p.AGENT,'https://'+host+path) else 'denied'
                  break
              print('robots_policy_check',host,result,flush=True)
          PY

      - name: Sonder la géolocalisation OSM par coordonnées publiques connues
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()/'automation/concerts'))
          from urllib.robotparser import RobotFileParser
          import source_evidence_probe as p
          import osm_read_only_fallback as osm
          from independent_named_site_geo import OSM_MAP,LAT_HALF,LON_HALF
          lat, lon=43.54795,1.48568
          bbox=','.join(f'{x:.6f}' for x in (lon-LON_HALF,lat-LAT_HALF,lon+LON_HALF,lat+LAT_HALF))
          urls=[
            OSM_MAP+'?bbox='+bbox,
            osm.nearby(lat-LAT_HALF,lon-LON_HALF,lat+LAT_HALF,lon+LON_HALF),
            osm.nearby(lat-LAT_HALF,lon-LON_HALF,lat+LAT_HALF,lon+LON_HALF,provider=1)
          ]
          for i,url in enumerate(urls):
              host=p.intake.valid_https(url)
              try:
                  cache={}
                  body=p.safe_fetch(url,cache)
                  print('osm_probe',i,'origin',host,'result','ok','bytes',len(body),flush=True)
              except (OSError,TimeoutError,ValueError) as e:
                  reason=str(e)
                  if 'robots.txt' in reason:
                      kind='robots_forbidden'
                  elif 'transports unavailable' in reason:
                      kind='transport_unavailable'
                  elif 'non-success HTTP status' in reason:
                      kind='http_status'
                  elif 'response over cap' in reason:
                      kind='response_cap'
                  else:
                      kind=type(e).__name__
                  print('osm_probe',i,'origin',host,'result',kind,flush=True)
          PY

      - name: Qualifier des instances Overpass publiques alternatives sans publication
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          from urllib.parse import urlencode
          sys.path.insert(0,str(Path.cwd()/'automation/concerts'))
          import source_evidence_probe as p
          from independent_named_site_geo import LAT_HALF,LON_HALF
          lat,lon=43.54795,1.48568
          bbox=','.join(f'{x:.6f}' for x in (
              lat-LAT_HALF,lon-LON_HALF,lat+LAT_HALF,lon+LON_HALF))
          script='[out:xml][timeout:12];(node('+bbox+');way('+bbox+'););(._;>;);out body;'
          providers=(
            'https://overpass.openstreetmap.fr/api/interpreter',
            'https://api-overpass.pikamap.fr/api/interpreter',
            'https://maps.mail.ru/osm/tools/overpass/api/interpreter',
          )
          for i,base in enumerate(providers):
              url=base+'?'+urlencode({'data':script})
              host=p.intake.valid_https(url)
              try:
                  body=p.safe_fetch(url,{})
                  result='osm_xml' if '<osm version=' in body[:200] else 'other_body'
                  print('overpass_alt',i,host,result,'bytes',len(body),flush=True)
              except (ValueError,OSError,TimeoutError) as e:
                  msg=str(e)
                  kind=('robots_forbidden' if 'robots.txt' in msg else
                        'transport_unavailable' if 'transports unavailable' in msg else
                        'http_error' if 'HTTP status' in msg else
                        'size_limit' if 'cap' in msg else type(e).__name__)
                  print('overpass_alt',i,host,kind,flush=True)
          PY

      - name: Checkout Overpass France new-venue PR (no secrets)
        uses: actions/checkout@v4
        with:
          ref: fix/concerts-french-overpass-failover-20261122
          path: osm-france-check
      - name: Test fixed OSM providers and real Publisher with third fallback
        working-directory: osm-france-check
        run: |
          PYTHONPATH=automation/concerts:. python -m unittest discover -s tests -p 'test_concerts_osm_read_only_fallback.py' -v
          PYTHONPATH=automation/concerts:. python -m unittest discover -s tests -p 'test_concerts_overpass_secondary_readonly.py' -v
          PYTHONPATH=automation/concerts:. python -m unittest discover -s tests -p 'test_concerts_french_overpass_publisher.py' -v

      - name: Checkout immutable pre-PR main for unrelated P'tites Ondes CI baseline
        uses: actions/checkout@v4
        with:
          ref: c7fecd701dddb3269593d91244354252b5a2e0dc
          path: po-baseline
      - name: Isolate existing P'tites Ondes failures independently of Concerts
        working-directory: po-baseline
        run: |
          python - <<'PY'
          import subprocess
          patterns=(
            'test_ptitesondes_family_national_scope.py',
            'test_ptitesondes_municipal_batch_readiness.py',
            'test_ptitesondes_nonmusical_catalogue_shape_dryrun.py',
          )
          for name in patterns:
              run=subprocess.run(
                ['python','-m','unittest','discover','-s','tests','-p',name],
                text=True,capture_output=True)
              if run.returncode == 0:
                  print('po_baseline',name,'unexpected_green',flush=True)
              else:
                  tail=run.stderr.strip().splitlines()[-1]
                  print('po_baseline',name,tail,flush=True)
          PY
