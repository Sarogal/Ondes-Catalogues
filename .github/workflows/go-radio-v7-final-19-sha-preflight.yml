name: GO radio TEST v7 — final 13 dedupes plus 19 official SHA logos QA
on:
  push:
    branches:
      - feature/go-radio-v7-13-dedupe-20261123
    paths:
      - 'radio-catalog-lab/tools/test_go_radio_v7_final_19_logos.py'
      - 'radio-catalog-lab/full-staging/UNSIGNED-radio-v7-13-programs-lautfm-14-exclusive-5-20261123.json'
      - 'grossesondes/radio-test-v2/artwork/staging-lautfm-v7/**'
      - 'grossesondes/radio-test-v2/artwork/staging-exclusive-v7/**'
      - '.github/workflows/go-radio-v7-final-19-sha-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-entire-v7-against-signed-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ed25519/schema/image validation dependencies
        run: python -m pip install 'cryptography>=42,<47' 'jsonschema>=4.21,<5' 'pillow>=10,<12'
      - name: Audit entire v6 signed predecessor, 13 unique channels, 24 redirects and 19 new SHA images
        run: python radio-catalog-lab/tools/test_go_radio_v7_final_19_logos.py
      - name: Ensure the TEST v6 active pointer remains untouched
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('grossesondes/radio-test-v2')
          ptr=json.loads((root/'current.json').read_text())
          assert ptr['release_sequence']==6
          assert ptr['content_sha256']=='40215a58967a8b7a83b322c9f02645a9bc2bf319385442e5d89277e0b0d6d861'
          assert not (root/'current-v7.json').exists()
          print('ACTIVE_TEST_V6_UNTOUCHED_NO_V7_SIGNING_NO_PUBLICATION')
          PY
