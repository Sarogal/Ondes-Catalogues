name: Grosses Ondes — concerts, synchronisation cloud sécurisée

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Prévisualisation ou publication de concerts approuvés
        options: [preview, publish]
        default: preview
        required: true
  # Synchronisation après validation Tours (PR publique #119, privée #193).
  # Les cinq affiches du Bateau Ivre disposent de preuves nominatives signées.
  # Cette annotation déclenche le workflow existant sans modifier sa sécurité.
  # Réexécution contrôlée après l'approbation privée de six concerts du Rocher
  # de Palmer (PR GrossesOndes #76, 02/11/2026). Les futurs cycles restent
  # Synchronisation complémentaire : Gwendoline le 07/11, validation signée
  # GrossesOndes PR #80 ; aucun assouplissement des règles de publication.
  # automatiques toutes les trois heures ; cette annotation ne change aucune règle.
  # Réexécution de la publication protégée après la revue Joobieseaz + Belljars
  # du 16 décembre, signée en PR privée GrossesOndes #83 (aucune règle modifiée).
  # Synchronisation après deux concerts validés à La Carène à Brest et
  # approbation de la salle (PR privée GrossesOndes #87, 02/11/2026).
  # Aucun changement des règles de sécurité ni des autres catalogues.
  # Atabal Biarritz : relance après la revue signée (GrossesOndes PR #90)
  # et validation publique stricte (Ondes-Catalogues PR #49) du 02/11/2026.
  # Publier uniquement les trois concerts approuvés, sans heure inférée.
  # Sync après approbation indépendante de Hydrophone Face A et du concert
  # Revnoir + Ice Sealed Eyes, 2027-02-10 (PR privée #97, publique #51).
  # Synchronisation La Laiterie après signature privée de neuf affiches datées
  # (GrossesOndes PR #100, 03/11/2026) ; aucune règle de contrôle assouplie.
  # Nouvelle synchronisation La Laiterie : 5 concerts / 11 artistes validés
  # (approbation privée GrossesOndes PR #101, 03/11/2026).
  # Ni le schéma ni les contrôles de publication ne sont assouplis.
  # Synchronisation finale 15/15 des concerts La Laiterie avec correction
  # Arm's Length contrôlée par Live Nation, approbation privée PR #102.
  # Publier uniquement si toutes les validations habituelles passent.
  # Réexécution contrôlée après la veille publique #26 du 12/11/2026 :
  # deux concerts approuvés dans le registre privé et prévalidés par
  # l'éditeur (Molotov 17/12 et Bateau Ivre 21/01). Ce commentaire
  # déclenche uniquement le publisher EXISTANT ; aucun contrôle ou
  # horaire de synchronisation n'est modifié.
  # Re-execute this already-existing PUBLIC publisher after private PR #304
  # signed the independently verified Secret Place cancellation (27/06/2027).
  # No approval gate, scheduling, token scope or workflow logic is changed.
  # Synchronisation du 13/11/2026 après relecture officielle et preflight privé validés :
  # GREENLEAF Paris 14/12, UUHAI Wasquehal 20/03, DARVAZA Paris 10/12.
  # Déclenche le PUBLISHER EXISTANT ; ne touche pas aux règles ni aux secrets.
  # Rattrapage du 13/11 : relancer sur HEAD après l'intégration du paquet de
  # préparation Infomaniak ; même dossier privé et mêmes garde-fous, sans édition JSON.
  schedule:
    - cron: '17 */3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/grossesondes-concerts-cloud-sync.yml'
      - 'scripts/concerts_cloud_sync.py'
      - 'tests/test_concerts_cloud_sync.py'
      - 'docs/grossesondes/concerts.json'
      - 'docs/grossesondes/concerts-reference.json'

permissions:
  contents: write

# Preserve the common deployment lock AND do not replace older pending jobs.
# GitHub Actions queue:max allows up to 100 sequential waiting runs.
concurrency:
  group: ondes-cloud-publication
  queue: max
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    outputs:
      deploy: ${{ steps.decision.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Vérifier les scripts et la conservation des 127 concerts
        run: python -m unittest discover -s tests -p 'test_concerts_cloud_sync.py' -v

      - name: Préparer le catalogue Concerts sans mise à jour forcée
        id: sync
        env:
          GROSSES_ONDES_INTAKE_READ_TOKEN: ${{ secrets.GROSSES_ONDES_INTAKE_READ_TOKEN }}
          MODE: ${{ github.event_name != 'workflow_dispatch' && 'publish' || inputs.mode || 'preview' }}
          CLOUD_ENABLED: ${{ vars.GROSSES_ONDES_CONCERTS_CLOUD_SYNC }}
        run: |
          if [ "$MODE" = "publish" ] && [ "$CLOUD_ENABLED" != "enabled" ]; then
            MODE=preview
          fi
          python scripts/concerts_cloud_sync.py --mode "$MODE"
          if git diff --quiet -- docs/grossesondes/concerts.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Expliquer les approbations intégrées ou retenues
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path("/tmp/grossesondes_concerts/rapport.json").read_text(encoding="utf-8"))
          lines=[
              "### Concerts — synchronisation des approbations",
              f"Catalogue : {d['publicEventsBefore']} → {d['publicEventsAfter']} concerts",
              f"Nouvelles fiches : {d['newEvents']} ; nouveaux artistes : {d['newArtists']}",
              f"Salles géolocalisées après revue : {d.get('correctedVenues', 0)}",
              f"Approbations déjà publiées : {d['alreadyPublished']}",
              f"Approbations retenues : {len(d['held'])}",
              f"Flux privé accessible : {'oui' if d['privateApprovalFeedReadable'] else 'non'}",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as report:
              report.write("\n".join(lines)+"\n")
          if d['held']:
              print(f"::warning title=Concerts — validations retenues::{len(d['held'])} approbation(s) non publiées : consulter l'artefact du rapport privé.")
          if not d['privateApprovalFeedReadable']:
              print("::warning title=Concerts — flux d'approbation absent::Le catalogue est conservé sans nouveaux ajouts.")
          PY

      # The detailed candidate JSON and rejection reasons may contain private
      # unpublished approvals. Do NOT attach them to a PUBLIC workflow run.
      # Aggregated counts are already in GITHUB_STEP_SUMMARY above; detailed
      # diagnostics live only in RUNNER_TEMP for the duration of this job.

      - name: Déterminer l'autorisation de publication ou d'initialisation Pages
        id: decision
        env:
          CHANGED: ${{ steps.sync.outputs.changed }}
          EVENT_NAME: ${{ github.event_name }}
          CLOUD_ENABLED: ${{ vars.GROSSES_ONDES_CONCERTS_CLOUD_SYNC }}
          MODE: ${{ github.event_name != 'workflow_dispatch' && 'publish' || inputs.mode || 'preview' }}
        run: |
          if [ "$CHANGED" = "true" ] && [ "$CLOUD_ENABLED" = "enabled" ] && [ "$MODE" = "publish" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "push" ] && [ "$CHANGED" = "false" ]; then
            # Déploiement de la référence publique existante et des autres docs
            # SANS ajouter de concert ; utile au bootstrap du JSON GitHub Pages.
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Aucune publication : pas d'approbation, mode preview ou variable absente."
          fi

      - name: Conserver le nouveau JSON approuvé dans Git
        if: ${{ steps.sync.outputs.changed == 'true' && steps.decision.outputs.deploy == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/grossesondes/concerts.json
          git diff --cached --quiet && exit 1
          git commit -m "data(concerts): publier uniquement les concerts officiellement approuvés"
          # A concurrent main commit (e.g. on another catalog or site tooling)
          # must not make publication fail on a simple non-fast-forward. Never
          # rebase across a newer concert catalog, baseline, publisher code or
          # its security tests: those require a FRESH preflight and workflow run.
          git fetch --no-tags origin main
          REMOTE_HEAD="$(git rev-parse FETCH_HEAD)"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$REMOTE_HEAD"; then
            echo "::error::Main a été réécrit : publication interrompue"
            exit 1
          fi
          if ! git diff --quiet "$GITHUB_SHA" "$REMOTE_HEAD" -- \
            scripts/concerts_cloud_sync.py \
            tests/test_concerts_cloud_sync.py \
            docs/grossesondes/concerts.json \
            docs/grossesondes/concerts-reference.json; then
            echo "::error::Le catalogue ou ses garde-fous ont changé : relancer la revue sur main"
            exit 1
          fi
          git rebase "$REMOTE_HEAD"
          git push origin HEAD:main

      - name: Préparer GitHub Pages (tous les catalogues existants préservés)
        if: ${{ steps.decision.outputs.deploy == 'true' }}
        uses: actions/configure-pages@v6
      - name: Construire l'artefact GitHub Pages complet
        if: ${{ steps.decision.outputs.deploy == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          # A rerun uploads a second artifact into the same run. Name it per
          # attempt so deploy-pages never encounters ambiguous github-pages.
          name: github-pages-${{ github.run_attempt }}
          path: docs/

  deploy:
    needs: prepare
    if: ${{ needs.prepare.outputs.deploy == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.published.outputs.page_url }}
    steps:
      - name: Déployer le JSON Concerts avec Festivals et P'tites Ondes
        id: published
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
