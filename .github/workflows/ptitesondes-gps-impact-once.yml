name: P'tites Ondes — mesure ponctuelle gain GPS sans publication
on:
  push:
    branches: [ci/ptitesondes-gps-impact-20261112]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: public
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Sarogal/PtitesOndes
          ref: automation/ptitesondes-intake
          token: ${{ secrets.PRIVATE_INTAKE_READ_TOKEN }}
          path: private-state
          sparse-checkout: automation-intake/ptitesondes
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mesurer admissibilite sans publication ni fuite
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          from datetime import date
          from pathlib import Path
          sys.path.insert(0,str(Path("public/scripts").resolve()))
          from ptitesondes_candidate_promotion import (
              private_admission_diagnostics, unique_review_candidates
          )
          path=Path("private-state/automation-intake/ptitesondes/backlog.json")
          leads=json.loads(path.read_text())
          today=date(2026,11,12)
          report=private_admission_diagnostics(leads,today)
          eligible,raw,duplicates,conflicts=unique_review_candidates(leads,today)
          print(json.dumps({
              "mode":"read_only_no_publication",
              "backlog":len(leads),
              "eligible_raw":raw,
              "eligible_unique_uid_day":len(eligible),
              "duplicate_mirrors":duplicates,
              "conflicting_uid_day":conflicts,
              "admission_reason_counts":report["reason_counts"],
              "top_unverified_venue_count":len(report["top_unverified_venues"]),
              "remote_writes":0
          },ensure_ascii=False))
          PY
