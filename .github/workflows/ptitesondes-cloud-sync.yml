name: P'tites Ondes — synchronisation cloud securisee

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'docs/ptitesondes/lieux.json'
      - 'docs/ptitesondes/carte-lieux.html'
      - '.github/workflows/ptitesondes-cloud-sync.yml'
  schedule:
    # Synchronisation après collecte, prévalidation privée et audit indépendant.
    # Quatre passages UTC ; pas de nouveau commit si aucune nouveauté confirmée.
    - cron: '20 09 * * *'
    - cron: '20 12 * * *'
    - cron: '20 16 * * *'
    - cron: '20 20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Choisir previsualisation ou publication
        type: choice
        required: true
        default: preview
        options:
          - preview
          - publish

permissions:
  contents: write

# Preserve the common deployment lock AND do not replace older pending jobs.
# GitHub Actions queue:max allows up to 100 sequential waiting runs.
concurrency:
  group: ondes-cloud-publication
  queue: max
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || vars.PTITESONDES_CLOUD_SYNC == 'enabled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.decision.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Tests de conservation et de sécurité
        run: |
          python -m unittest discover -s tests -p 'test_cloud_policy.py' -v
          python -m unittest discover -s tests -p 'test_daily_outings_proof.py' -v
          python -m unittest discover -s tests -p 'test_ptitesondes_places.py' -v
      - name: Contrôler les lieux permanents (append-only)
        id: places
        run: |
          set -euo pipefail
          python scripts/ptitesondes_places.py docs/ptitesondes/lieux.json
          if [ "${{ github.event_name }}" = "push" ]; then
            if git cat-file -e HEAD^:docs/ptitesondes/lieux.json 2>/dev/null; then
              git show HEAD^:docs/ptitesondes/lieux.json > /tmp/ptitesondes-lieux-previous.json
              python scripts/ptitesondes_places.py docs/ptitesondes/lieux.json --previous /tmp/ptitesondes-lieux-previous.json
            fi
            if git diff --quiet HEAD^ HEAD -- docs/ptitesondes/lieux.json docs/ptitesondes/carte-lieux.html; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prévalidation publique indépendante des lieux permanents
        id: place_release
        env:
          PRIVATE_INTAKE_READ_TOKEN: ${{ secrets.PRIVATE_INTAKE_READ_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          USER_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          cp docs/ptitesondes/lieux.json /tmp/ptitesondes-lieux-before-release.json
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$USER_MODE" != "publish" ]; then
            python scripts/ptitesondes_place_preflight.py --mode preview
          else
            python scripts/ptitesondes_place_preflight.py --mode apply
          fi
          python scripts/ptitesondes_places.py docs/ptitesondes/lieux.json --previous /tmp/ptitesondes-lieux-before-release.json
      - name: Lire, contrôler et fusionner sans écriture distante
        id: sync
        env:
          PRIVATE_INTAKE_READ_TOKEN: ${{ secrets.PRIVATE_INTAKE_READ_TOKEN }}
        run: python scripts/run_cloud_sync.py
      - name: Calculer la permission de déploiement
        id: decision
        env:
          CHANGED: ${{ steps.sync.outputs.changed }}
          PLACES_CHANGED: ${{ steps.places.outputs.changed }}
          PLACE_RELEASE_CHANGED: ${{ steps.place_release.outputs.changed }}
          CLOUD_ENABLED: ${{ vars.PTITESONDES_CLOUD_SYNC }}
          USER_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if { [ "$CHANGED" = "true" ] || [ "$PLACES_CHANGED" = "true" ] || [ "$PLACE_RELEASE_CHANGED" = "true" ]; } && [ "$CLOUD_ENABLED" = "enabled" ] && { [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "push" ] || [ "$USER_MODE" = "publish" ]; }; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Prévisualisation seulement ou aucune fiche indépendante vérifiée."
          fi
      - name: Archiver le nouveau catalogue dans Git
        if: ${{ steps.decision.outputs.deploy == 'true' && (steps.sync.outputs.changed == 'true' || steps.place_release.outputs.changed == 'true') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/ptitesondes/sorties.json docs/ptitesondes/lieux.json
          git diff --cached --quiet && exit 1
          git commit -m "data(ptitesondes): publier les seuls événements indépendamment vérifiés"
          git push origin HEAD:main
      - name: Configurer GitHub Pages
        if: ${{ steps.decision.outputs.deploy == 'true' }}
        uses: actions/configure-pages@v6
      - name: Construire le site JSON Pages
        if: ${{ steps.decision.outputs.deploy == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/

  deploy:
    needs: prepare
    if: ${{ needs.prepare.outputs.deploy == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.published.outputs.page_url }}
    steps:
      - name: Déployer le catalogue JSON sur GitHub Pages
        id: published
        uses: actions/deploy-pages@v5
      - name: Charger la référence Git effectivement publiée
        uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Comparer les JSON réellement servis par GitHub Pages
        run: python scripts/ptitesondes_pages_verify.py
