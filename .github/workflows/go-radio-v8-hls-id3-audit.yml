name: GO v8 HLS ID3 evidence
on:
  push:
    branches: [audit/go-radio-v8-metadata-public-20261125]
    paths:
      - 'radio-catalog-lab/tools/go_radio_v8_hls_id3_probe.py'
      - 'radio-catalog-lab/tools/test_go_radio_v8_hls_id3_probe.py'
      - '.github/workflows/go-radio-v8-hls-id3-audit.yml'
permissions:
  contents: read
  actions: read
jobs:
  hls:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography
      - run: python -m unittest discover -s radio-catalog-lab/tools -p test_go_radio_v8_hls_id3_probe.py
      - uses: actions/download-artifact@v4
        with:
          name: go-radio-v8-metadata-first-pass
          run-id: 45565724854
          github-token: ${{ github.token }}
          path: /tmp/go-first-pass
      - name: Probe direct ID3 frames in bounded HLS samples
        run: python radio-catalog-lab/tools/go_radio_v8_hls_id3_probe.py --first /tmp/go-first-pass/go-radio-v8-metadata.json --output /tmp/go-radio-v8-hls-id3.json
      - uses: actions/upload-artifact@v4
        with:
          name: go-radio-v8-hls-id3-evidence
          path: /tmp/go-radio-v8-hls-id3.json
          retention-days: 7
          if-no-files-found: error
