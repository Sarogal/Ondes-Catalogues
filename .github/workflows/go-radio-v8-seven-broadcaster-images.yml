name: GO radio v8 — seven official radio station images SHA audit (READ ONLY)
on:
  push:
    branches:
      - feature/go-radio-v8-metalon-3-logos-20261123
    paths:
      - 'radio-catalog-lab/tools/audit_v8_seven_official_broadcaster_logos.py'
      - '.github/workflows/go-radio-v8-seven-broadcaster-images.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe-seven-real-broadcaster-image-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install safe image decoder
        run: python -m pip install 'pillow>=10,<12'
      - name: Enforce exact 7 station identities offline
        run: python radio-catalog-lab/tools/audit_v8_seven_official_broadcaster_logos.py --output "$RUNNER_TEMP/offline.json"
      - name: Retrieve publisher site and exact image bytes over safe HTTPS
        run: python radio-catalog-lab/tools/audit_v8_seven_official_broadcaster_logos.py --network --output "$RUNNER_TEMP/online.json"
      - name: Preserve human-review source evidence, no release or publication
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"online.json").read_text())
          assert r["scope"]=="GO_V8_SEVEN_BROADCASTER_SOURCE_IMAGES_READ_ONLY"
          assert len(r["records"])==7 and r["catalog_changed"] is False
          assert r["publication_allowed"] is False
          print("BROADCASTER_LOGOS_READ_ONLY",r["sha_verified"],"out_of",r["targets"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: go-v8-seven-broadcaster-logo-original-shas-read-only
          path: ${{ runner.temp }}/online.json
          retention-days: 14
