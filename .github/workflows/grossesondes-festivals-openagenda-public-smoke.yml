name: Grosses Ondes — source OpenData publique, lecture seule

on:
  pull_request:
    paths:
      - 'festival-automation/national_openagenda_research.py'
      - 'festival-automation/national_brand_domain_research.py'
      - 'festival-automation/test_national_brand_domain_research.py'
      - 'festival-automation/test_national_openagenda_research.py'
      - '.github/workflows/grossesondes-festivals-openagenda-public-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'festival-automation/national_openagenda_research.py'
      - 'festival-automation/national_brand_domain_research.py'
      - 'festival-automation/test_national_brand_domain_research.py'
      - '.github/workflows/grossesondes-festivals-openagenda-public-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-source-preflight:
    if: github.repository == 'Sarogal/Ondes-Catalogues'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier la provenance et les limites sans secrets ni état privé
        run: |
          python -m unittest discover -s festival-automation -p 'test_national_openagenda_research.py' -v
      - name: Lire une requête fixe JSON publique sans créer de festival
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python - <<'PY'
          import json
          import sys
          sys.path.insert(0, 'festival-automation')
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from national_openagenda_research import scan, fixed_query_urls
          today = datetime.now(ZoneInfo('Europe/Paris')).date().isoformat()
          catalog = json.loads(Path('docs/grossesondes/festivals.json')
                               .read_text(encoding='utf-8'))
          result = scan({'schema': 'grossesondes.source-watch.v1'},
                        today, catalog=catalog)
          assert result['requests_attempted'] == len(fixed_query_urls(today))
          assert result['requests_failed'] < result['requests_attempted']
          assert result['publications'] == 0
          assert result['publication_authorized'] is False
          print('OpenData publique:', result['status'],
                'requêtes:', result['requests_attempted'],
                'échecs:', result['requests_failed'],
                'pistes privées non vérifiées:', result['leads_count'],
                'éditions déjà publiées écartées:',
                result['already_published_leads_count'])
          print('Aucune donnée privée, aucune approbation, aucune publication.')
          from national_brand_domain_research import research_brand_domain, brand_domain_candidate
          # Derive candidates only from the public scan, no configured domains.
          leads = [lead for lead in result['leads']
                   if brand_domain_candidate(lead.get('name_hint'),
                                             lead.get('edition_year_hint'))]
          leads.sort(key=lambda lead: (
              (lead.get('calendar_hint_review_only') or {}).get('start_date', '9999'),
              lead['name_hint']))
          for lead in leads[:4]:
              title, _ = brand_domain_candidate(lead['name_hint'], lead['edition_year_hint'])
              review = research_brand_domain(lead, title, lead['edition_year_hint'], today)
              assert review['publication_authorized'] is False
              print('Brand domain:', title, review['status'],
                    'official dates:', review['dates_review_only'],
                    'diagnostics:', review.get('diagnostics', {}))
          print('Brand-domain eligible:', len(leads), 'checked:', min(4, len(leads)))
          PY
