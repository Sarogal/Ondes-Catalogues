name: "P'tites Ondes — v173 catégories jeunesse, tests hors production"

on:
  pull_request:
    paths:
      - 'previews/ptitesondes/**'
      - 'tests/ptitesondes_v173_frontend_preview.test.mjs'
      - '.github/workflows/ptitesondes-v173-preview-tests.yml'
  push:
    branches:
      - feat/ptitesondes-v173-nonmusic-preview-20261116
    paths:
      - 'previews/ptitesondes/**'
      - 'tests/ptitesondes_v173_frontend_preview.test.mjs'
      - '.github/workflows/ptitesondes-v173-preview-tests.yml'

permissions:
  contents: read

jobs:
  frontend-preview:
    if: github.repository == 'Sarogal/Ondes-Catalogues'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: JavaScript syntax checks
        run: |
          node --check previews/ptitesondes/sorties-v172-live-snapshot.js
          node --check previews/ptitesondes/sorties-v173-nonmusic-preview.js
      - name: "Tests catégories, territoires, filtres et marqueurs"
        run: node --test tests/ptitesondes_v173_frontend_preview.test.mjs
