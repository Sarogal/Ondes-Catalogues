name: GO radio TEST v7 — verify 13 dedupes against signed v6
on:
  push:
    branches:
      - feature/go-radio-v7-13-dedupe-20261123
    paths:
      - 'radio-catalog-lab/full-staging/UNSIGNED-radio-v7-13-programs-dedupe-20261123.json'
      - 'radio-catalog-lab/audits/2026-11-23/v7-13-group-merge-plan.json'
      - 'radio-catalog-lab/tools/test_go_radio_v7_13_dedupe.py'
      - 'radio-catalog-lab/schemas/radio_catalog_v1.schema.json'
      - '.github/workflows/go-radio-v7-13-dedupe-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-v6-to-v7-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline contract/schema/signature dependencies
        run: python -m pip install 'cryptography>=42,<47' 'jsonschema>=4.21,<5'
      - name: Validate original signed v6, strict identity continuity and 13 unsigned v7 merges
        run: python radio-catalog-lab/tools/test_go_radio_v7_13_dedupe.py
      - name: Pin unchanged public TEST v6 current pointer
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('grossesondes/radio-test-v2')
          ptr=json.loads((root/'current.json').read_bytes())
          assert ptr['release_sequence']==6
          assert ptr['content_sha256']=='40215a58967a8b7a83b322c9f02645a9bc2bf319385442e5d89277e0b0d6d861'
          body=(root/ptr['content_path']).read_bytes()
          assert hashlib.sha256(body).hexdigest()==ptr['content_sha256']
          assert not (root/'current-v7.json').exists()
          print('TEST_V6_SIGNED_POINTER_UNCHANGED; V7_NOT_SIGNED_NOT_PUBLISHED')
          PY
