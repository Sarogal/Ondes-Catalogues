name: Grosses Ondes — moteur Festivals public, état privé protégé

on:
  # React to validated source-engine changes on the trusted main branch.
  # A trusted successful main-branch refresh wakes the independent Publisher.
  # It remains private evidence, never automatic publication approval.
  push:
    branches: [main]
    paths:
      - 'festival-automation/institutional_event_card.py'
      - 'festival-automation/national_live_index_recheck.py'
      - '.github/workflows/grossesondes-festivals-private-intake-on-public-runners.yml'
      - 'scripts/grossesondes_archived_html_intake.py'
      - 'scripts/grossesondes_undated_edition.py'
      - 'scripts/grossesondes_official_html_edition.py'
      - 'scripts/grossesondes_structured_edition.py'
      - 'festival-automation/regional_festival_discovery.py'
      - 'festival-automation/national_openagenda_research.py'
      - 'festival-automation/national_openagenda_linked_primary_preflight.py'
      - 'festival-automation/national_professional_profile_discovery.py'
      - 'festival-automation/national_professional_official_detail.py'
      - 'festival-automation/national_professional_publisher_provenance.py'
      - 'scripts/grossesondes_openagenda_linked_edition.py'
      - 'festival-automation/regional_source_diagnostics.py'
      - 'festival-automation/regional_festival_indexes.json'
      - 'festival-automation/national_discovery_queue.py'
      - 'festival-automation/national_municipal_source_research.py'
      - 'festival-automation/national_municipal_pages_preflight.py'
      - 'festival-automation/national_openagenda_research.py'
      - 'festival-automation/national_generic_primary_domain_preflight.py'
      - 'festival-automation/national_directory_edition_preflight.py'
      - 'festival-automation/national_institutional_edition_preflight.py'
      - 'festival-automation/festival_to_concerts_handoff.py'
      - 'festival-automation/national_institutional_organizer_preflight.py'
      - 'festival-automation/national_organizer_domain_qualification.py'
      - 'festival-automation/dns_pinned_https.py'
      - 'scripts/grossesondes_institutional_edition.py'
      - 'festival-automation/national_candidate_promotion.py'
      - 'festival-automation/future_geo_preflight.py'
      - 'festival-automation/future_city_preflight.py'
      - 'festival-automation/national_admission_handoff.py'
      - 'festival-automation/national_generic_publisher_funnel.py'
      - 'festival-automation/national_blocker_inventory.py'
      - 'festival-automation/national_institutional_linked_primary_preflight.py'
      - 'scripts/grossesondes_institutional_linked_edition.py'
      - 'scripts/grossesondes_generic_directory_edition.py'
      - 'scripts/grossesondes_venue_reciprocal_edition.py'
      - 'scripts/grossesondes_first_party_direct_edition.py'
      - 'scripts/grossesondes_official_poster_ocr.py'
      - 'scripts/grossesondes_official_poster_rotation.py'
  workflow_dispatch:
    inputs:
      phase:
        description: Rotation officielle des sources
        type: choice
        options: [primary, catchup]
        default: primary
        required: true
  schedule:
    - cron: '24 6 * * *'
    - cron: '42 18 * * *'

# Only this public repository's trusted main branch executes the private intake.
# No pull_request, no pull_request_target and no reusable untrusted workflow.
permissions:
  contents: read

concurrency:
  group: grossesondes-festivals-public-private-intake
  cancel-in-progress: false

jobs:
  poster_dom_readonly:
    continue-on-error: true
    if: github.repository == 'Sarogal/Ondes-Catalogues' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    outputs:
      tick: ${{ steps.capture.outputs.tick }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Installer Chromium isolé sans secrets
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Autoriser uniquement le binaire Chromium à utiliser son sandbox AppArmor
        shell: bash
        run: |
          set -euo pipefail
          # Never disable AppArmor globally. Apply one exact executable profile
          # before running any untrusted website scripts.
          CHROME_BIN="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chromium_headless_shell-*/chrome-linux/headless_shell' -print -quit)"
          test -n "$CHROME_BIN" && test -x "$CHROME_BIN"
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile grossesondes-chromium %s flags=(unconfined) {\n  userns,\n}\n' "$CHROME_BIN" > "$RUNNER_TEMP/grossesondes-chromium.apparmor"
          sudo install -m 0644 "$RUNNER_TEMP/grossesondes-chromium.apparmor" /etc/apparmor.d/grossesondes-chromium
          sudo apparmor_parser -r /etc/apparmor.d/grossesondes-chromium
      - name: Vérifier localement le sandbox Chromium avant toute page externe
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, chromium_sandbox=True)
              try:
                  context = browser.new_context(
                      accept_downloads=False, service_workers='block')
                  page = context.new_page()
                  page.set_content('<main>Grosses Ondes browser smoke</main>')
                  assert 'Grosses Ondes browser smoke' in page.content()
              finally:
                  browser.close()
          PY
      - name: Capturer uniquement les DOM publics de la rotation OCR
        id: capture
        shell: bash
        run: |
          set -euo pipefail
          # A new trusted run advances the batch; a retry retains it.
          tick="$GITHUB_RUN_NUMBER"
          [[ "$tick" =~ ^[0-9]{1,10}$ ]]
          python scripts/grossesondes_official_poster_rotation.py --catalogue docs/grossesondes/festivals.json --limit 4 --tick "$tick" --browser --capture-rendered-evidence "$RUNNER_TEMP/poster-dom/evidence.json"
          echo "tick=$tick" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: grossesondes-public-poster-dom
          path: ${{ runner.temp }}/poster-dom/evidence.json
          retention-days: 1
          if-no-files-found: error

  watch:
    needs: [poster_dom_readonly]
    if: ${{ !cancelled() && github.repository == 'Sarogal/Ondes-Catalogues' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Vérifier uniquement la présence des secrets, sans les afficher
        id: access
        shell: bash
        env:
          INTAKE_READ_TOKEN: ${{ secrets.GROSSES_ONDES_INTAKE_READ_TOKEN }}
          INTAKE_WRITE_TOKEN: ${{ secrets.GROSSES_ONDES_INTAKE_WRITE_TOKEN }}
        run: |
          if [[ -n "$INTAKE_READ_TOKEN" && -n "$INTAKE_WRITE_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Veille Festivals interrompue : secrets Actions de lecture ou écriture privée absents"
            printf 'ÉCHEC : veille Festivals non exécutée, accès privé manquant.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Récupérer uniquement le moteur public validé
        if: steps.access.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          path: application
          persist-credentials: false

      - name: Charger l'état dans la branche privée, sans persister de credentials
        if: steps.access.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: Sarogal/GrossesOndes
          ref: automation/grossesondes-intake
          path: intake
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.GROSSES_ONDES_INTAKE_READ_TOKEN }}

      - name: Charger uniquement les configurations internes nécessaires
        if: steps.access.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: Sarogal/GrossesOndes
          ref: main
          path: confidential-config
          persist-credentials: false
          sparse-checkout: |
            festival-automation/curated_future_leads.json
            festival-automation/curated_source_leads.json
            festival-automation/curated_lineup_disputes.json
          sparse-checkout-cone-mode: false
          token: ${{ secrets.GROSSES_ONDES_INTAKE_READ_TOKEN }}

      - name: Préparer les données privées sans aucun artefact public
        if: steps.access.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for filename in curated_future_leads.json curated_source_leads.json curated_lineup_disputes.json; do
            test -s "confidential-config/festival-automation/$filename"
            cp "confidential-config/festival-automation/$filename" "application/festival-automation/$filename"
          done
          test -s intake/automation-intake/grossesondes/source-watch-state.json
          mkdir -p /tmp/grossesondes-official-watch /tmp/grossesondes-private-logs

      - uses: actions/setup-python@v5
        if: steps.access.outputs.ready == 'true'
        with:
          python-version: '3.12'

      - name: Préparer Chromium pour les preuves officielles dynamiques
        if: steps.access.outputs.ready == 'true'
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python -m playwright install --with-deps chromium

      - name: Exécuter la découverte et la qualification sans afficher les dossiers
        if: steps.access.outputs.ready == 'true'
        shell: bash
        env:
          PHASE: ${{ github.event_name == 'schedule' && github.event.schedule == '42 18 * * *' && 'catchup' || inputs.phase || 'primary' }}
        run: |
          set -euo pipefail
          run_private() {
            local name="$1"
            shift
            if ! "$@" >"/tmp/grossesondes-private-logs/$name.log" 2>&1; then
              if [[ "$name" == "blocker_inventory" ]]; then
                # Only a closed-vocabulary diagnostic category is ever public.
                local diagnostic
                diagnostic="$(grep -oE '^FESTIVALS_INVENTORY_DIAG=[A-Z_]+' "/tmp/grossesondes-private-logs/$name.log" | tail -n 1 || true)"
                case "$diagnostic" in
                  FESTIVALS_INVENTORY_DIAG=PUBLIC_SNAPSHOT_MISMATCH|FESTIVALS_INVENTORY_DIAG=DOSSIER_SET_MISMATCH|FESTIVALS_INVENTORY_DIAG=STAGE_REPORT_INVALID|FESTIVALS_INVENTORY_DIAG=PRIVATE_PATCH_INVALID|FESTIVALS_INVENTORY_DIAG=PRIVATE_PATCH_ITEMS_INVALID|FESTIVALS_INVENTORY_DIAG=PRIVATE_PATCH_SLUG_INVALID|FESTIVALS_INVENTORY_DIAG=PRIVATE_PATCH_ROW_INVALID|FESTIVALS_INVENTORY_DIAG=CONCERT_REFERRAL_ID_INVALID|FESTIVALS_INVENTORY_DIAG=MUNICIPAL_LINK_INVALID|FESTIVALS_INVENTORY_DIAG=MUNICIPAL_HISTORY_INVALID|FESTIVALS_INVENTORY_DIAG=MUNICIPAL_GIT_HISTORY_UNAVAILABLE|FESTIVALS_INVENTORY_DIAG=MUNICIPAL_GIT_SNAPSHOT_UNAVAILABLE|FESTIVALS_INVENTORY_DIAG=STAGE_ROWS_INVALID|FESTIVALS_INVENTORY_DIAG=DUPLICATE_DOSSIER|FESTIVALS_INVENTORY_DIAG=DOSSIER_SOURCES_INVALID|FESTIVALS_INVENTORY_DIAG=EDITORIAL_BLOCKERS_INVALID|FESTIVALS_INVENTORY_DIAG=PUBLIC_DATE_INVALID|FESTIVALS_INVENTORY_DIAG=PUBLIC_CATALOGUE_INVALID|FESTIVALS_INVENTORY_DIAG=INVENTORY_UNEXPECTED_FAILURE|FESTIVALS_INVENTORY_DIAG=INVENTORY_UNCLASSIFIED_INVALID_INPUT)
                    echo "::error::$diagnostic" ;;
                esac
              fi
              echo "::error::Étape $name échouée ; son journal confidentiel n'est pas publié"
              exit 1
            fi
          }
          ENGINE="application/festival-automation"
          INTAKE="intake/automation-intake/grossesondes"
          REPORT="/tmp/grossesondes-official-watch/report.json"
          run_private official python "$ENGINE/official_watch.py" --intake "$INTAKE" --phase "$PHASE" --limit 24
          run_private sources python "$ENGINE/source_qualification.py" --intake "$INTAKE" --report "$REPORT" --limit 6
          run_private institutions python "$ENGINE/institutional_agenda_discovery.py" --intake "$INTAKE" --report "$REPORT" --limit 2
          # First produce fixed, private OpenData names. Regional indexes then
          # compare ONLY exact visible name/year/region against trusted roots.
          # No OpenData URL may authorize a detail fetch or a publisher.
          run_private openagenda_public_research python "$ENGINE/national_openagenda_research.py" --intake "$INTAKE" --catalog application/docs/grossesondes/festivals.json
          run_private regions python "$ENGINE/regional_festival_discovery.py" --intake "$INTAKE" --report "$REPORT" --limit 8
          run_private future python "$ENGINE/curated_future_lead_watch.py" --intake "$INTAKE" --report "$REPORT" --limit 2
          run_private future_review python "$ENGINE/curated_future_review.py" --intake "$INTAKE" --report "$REPORT"
          run_private corroboration python "$ENGINE/curated_corroboration.py" --intake "$INTAKE" --report "$REPORT" --limit 2
          run_private secondary python "$ENGINE/curated_secondary_discovery.py" --intake "$INTAKE" --report "$REPORT" --limit 2 --detail-limit 1
          run_private targeted python "$ENGINE/curated_targeted_secondary.py" --intake "$INTAKE" --report "$REPORT" --limit 2 --detail-limit 1
          run_private history_homepages python "$ENGINE/historical_future_lead_watch.py" --intake "$INTAKE" --report "$REPORT" --limit 4
          run_private targeted_institutional_future python "$ENGINE/targeted_institutional_future_watch.py" --intake "$INTAKE" --report "$REPORT" --limit 1
          run_private press_2027 python "$ENGINE/targeted_press_edition_watch.py" --intake "$INTAKE" --report "$REPORT" --limit 2
          run_private first_party_2027 python "$ENGINE/targeted_first_party_edition_watch.py" --intake "$INTAKE" --report "$REPORT" --limit 2 --phase "$PHASE"
          # Public OPEN-DATA source: bounded, HTTPS pinned, only PRIVATE research.
          # An unavailable API never becomes a publication or blocks other sources.
          run_private queue python "$ENGINE/national_discovery_queue.py" --intake "$INTAKE" --report "$REPORT"
          # Geo + DILA verified dynamic commune/homepage hints, private only.
          # No new private cron, no site fetch, no publication authorization.
          run_private municipal_research python "$ENGINE/national_municipal_source_research.py" --intake "$INTAKE" --limit 3
          # LIVE Geo + DILA attribution is rederived independently before
          # fetching any newly found mairie homepage. At most 3 same-host
          # pages, PRIVATE research clues only: NEVER a publisher approval.
          run_private municipal_pages python "$ENGINE/national_municipal_pages_preflight.py" --intake "$INTAKE" --limit 2
          run_private details python "$ENGINE/national_detail_qualification.py" --intake "$INTAKE" --report "$REPORT" --limit 2
          # Newly found municipal agenda editions: strict visible dates and
          # two-day provenance review only, never a public patch or approval.
          run_private institutional_dates python "$ENGINE/national_institutional_edition_preflight.py" --intake "$INTAKE" --catalog application/docs/grossesondes/festivals.json --history application/docs/grossesondes/festival-history.json
          # A touring concert stop remains a private Concerts research lead.
          run_private concerts_handoff python "$ENGINE/festival_to_concerts_handoff.py" --intake "$INTAKE" --limit 2
          # NEW festivals without signed archive: only a verified institutional
          # index->detail->visible festival site link may select the HTTPS target.
          # Two days of evidence; private patch; independent publisher recheck.
          run_private institutional_linked python "$ENGINE/national_institutional_linked_primary_preflight.py" --intake "$INTAKE" --catalog application/docs/grossesondes/festivals.json --history application/docs/grossesondes/festival-history.json
          # Candidate organizer URLs from fresh institutional event links: PRIVATE research only.
          # No unknown organizer host is fetched or authorized at this step.
          run_private institutional_organizer_links python "$ENGINE/national_institutional_organizer_preflight.py" --intake "$INTAKE"
          # Probe only independently re-derived, two-day stable institutional links.
          # DNS pinning forbids private IPs and cross-domain redirects; output private.
          run_private organizer_domains python "$ENGINE/national_organizer_domain_qualification.py" --intake "$INTAKE"
          # Snapshot the private prior review locally BEFORE it is overwritten.
          # It never leaves the runner except as derived PRIVATE diagnostics.
          PREVIOUS="/tmp/grossesondes-official-watch/previous-editorial-review.json"
          if [[ -f "$INTAKE/national-festival-editorial-review.json" ]]; then
            cp -- "$INTAKE/national-festival-editorial-review.json" "$PREVIOUS"
          fi
          run_private reconcile python "$ENGINE/national_editorial_reconciliation.py" --intake "$INTAKE" --report "$REPORT"
          run_private candidate_preflight python "$ENGINE/national_candidate_promotion.py" --intake "$INTAKE" --catalog application/docs/grossesondes/festivals.json --history application/docs/grossesondes/festival-history.json
          run_private publisher_handoff python "$ENGINE/national_admission_handoff.py" --intake "$INTAKE" --catalog application/docs/grossesondes/festivals.json --history application/docs/grossesondes/festival-history.json
          # Exact current-edition JSON-LD geo claims from SIGNED public rows only.
          # Two-day observations stay PRIVATE. Never write a pin or patch here.
          run_private future_geo python "$ENGINE/future_geo_preflight.py" --intake "$INTAKE" --catalog application/docs/grossesondes/festivals.json --limit 4
          # Separately observe year-specific named communes; NO geocoder or
          # public coordinates here, only private two-day provenance.
          run_private future_city python "$ENGINE/future_city_preflight.py" --intake "$INTAKE" --catalog application/docs/grossesondes/festivals.json --limit 8
          # Research generic national domains beyond legacy one-event registry.
          # DNS-pinned rechecks and two-day observations, never a patch or approval.
          run_private generic_primary_domains python "$ENGINE/national_generic_primary_domain_preflight.py" --intake "$INTAKE" --catalog application/docs/grossesondes/festivals.json
          # NEW national festivals without any archive or hand-written source.
          # Directory path derives only from a sanitized festival title; every
          # unknown organizer host must be attributed on the live directory.
          # Two-day private observations; publisher independently refetches.
          run_private national_directory_first_party python "$ENGINE/national_directory_edition_preflight.py" --intake "$INTAKE" --catalog application/docs/grossesondes/festivals.json --history application/docs/grossesondes/festival-history.json
          # Independent provenance: OpenAgenda event -> linked first-party site
          # -> J/J+1 dates. New organizers require no pre-approved registry.
          run_private openagenda_linked_first_party python "$ENGINE/national_openagenda_linked_primary_preflight.py" --intake "$INTAKE" --catalog application/docs/grossesondes/festivals.json --history application/docs/grossesondes/festival-history.json
          run_private yield_diagnostics python "$ENGINE/national_yield_diagnostics.py" --intake "$INTAKE" --report "$REPORT" --previous-review "$PREVIOUS"
          # Official archived pages: TWO consecutive days, private patch only.
          # No private scheduled Actions, no proposed row goes to a public log.
          run_private archived_2027 env GROSSES_ONDES_BROWSER_INTAKE=enabled python application/scripts/grossesondes_archived_html_intake.py --intake "$INTAKE" --catalog application/docs/grossesondes/festivals.json --history application/docs/grossesondes/festival-history.json
          # Generic national publication FUNNEL: audit only the actual PRIVATE
          # patch after every preflight has finished. Structural contracts
          # are validated without named-festival whitelists or any HTTP.
          # Only the separate cloud publisher may authorize real additions.
          run_private generic_publisher_funnel python "$ENGINE/national_generic_publisher_funnel.py" --intake "$INTAKE" --catalog application/docs/grossesondes/festivals.json
          run_private blocker_inventory python "$ENGINE/national_blocker_inventory.py" --intake "$INTAKE" --catalog application/docs/grossesondes/festivals.json
          test -s "$REPORT"
          python - "$REPORT" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          assert report.get('schema') == 'grossesondes.source-watch-report.v1'
          assert report.get('regional_festival_publications', 0) == 0
          assert report.get('curated_future_leads_publications', 0) == 0
          assert report.get('curated_secondary_publications', 0) == 0
          print('Collecte et qualification terminées ; aucune publication directe autorisée.')
          PY

      - name: Charger uniquement les DOM publics de la rotation isolée
        if: steps.access.outputs.ready == 'true' && needs.poster_dom_readonly.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: grossesondes-public-poster-dom
          path: ${{ runner.temp }}/poster-dom/

      - name: OCR statique et DOM transportés, cache privé (sans autorité éditoriale)
        if: steps.access.outputs.ready == 'true'
        timeout-minutes: 5
        continue-on-error: true
        shell: bash
        env:
          OMP_THREAD_LIMIT: '2'
          POSTER_DOM_TICK: ${{ needs.poster_dom_readonly.outputs.tick }}
        run: |
          set -euo pipefail
          # Optional enrichment: failure must not block the primary intake.
          # No external browser here, no credentials, no public OCR artifact.
          if ! timeout 75s sudo apt-get install -y tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng python3-pil > /tmp/grossesondes-private-logs/poster-install.log 2>&1; then
            echo "::warning::OCR local indisponible ; collecte principale conservée"
            exit 0
          fi
          CACHE="intake/automation-intake/grossesondes/official-poster-ocr-cache.json"
          args=(--catalogue application/docs/grossesondes/festivals.json --limit 4 --private-cache "$CACHE")
          tick="$GITHUB_RUN_NUMBER"
          [[ "$tick" =~ ^[0-9]{1,10}$ ]] || exit 0
          args+=(--tick "$tick")
          if [[ "$POSTER_DOM_TICK" == "$tick" && -s "$RUNNER_TEMP/poster-dom/evidence.json" ]]; then
            args+=(--rendered-evidence "$RUNNER_TEMP/poster-dom/evidence.json")
          fi
          if ! timeout 195s /usr/bin/python3 application/scripts/grossesondes_official_poster_rotation.py "${args[@]}" > /tmp/grossesondes-private-logs/poster-ocr.log 2>&1; then
            echo "::warning::Rotation OCR non terminée ; collecte principale conservée"
            exit 0
          fi
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/grossesondes-private-logs/poster-ocr.log').read_text())
          assert report['review_only'] is True and report['publication_authorized'] is False
          print('OCR privé :', report['checked_hosts'], 'sites,',
                report['images_read'], 'affiches,',
                 sum(row.get('rendered_candidates', 0) for row in report['rows']), 'candidats DOM,',
                 sum(row.get('linked_candidates', 0) for row in report['rows']), 'candidats liés,',
                sum(image.get('cache_hit') is True
                    for row in report['rows'] for image in row.get('images', [])),
                'réutilisations du cache. Aucune publication directe.')
          PY

      - name: Enregistrer exclusivement les états dans la branche privée
        if: steps.access.outputs.ready == 'true'
        working-directory: intake
        shell: bash
        env:
          INTAKE_PUSH_TOKEN: ${{ secrets.GROSSES_ONDES_INTAKE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- automation-intake/grossesondes/source-watch-state.json \
            automation-intake/grossesondes/patch-*.json \
            automation-intake/grossesondes/curated-future-review.json \
            automation-intake/grossesondes/curated-multi-source-review.json \
            automation-intake/grossesondes/curated-secondary-sources-review.json \
            automation-intake/grossesondes/national-festival-discovery-review.json \
            automation-intake/grossesondes/national-municipal-source-research.json \
            automation-intake/grossesondes/national-municipal-pages-review.json \
            automation-intake/grossesondes/national-openagenda-research-review.json \
            automation-intake/grossesondes/national-festival-detail-review.json \
            automation-intake/grossesondes/national-institutional-edition-preflight.json \
            automation-intake/grossesondes/concert-tour-referrals.json \
            automation-intake/grossesondes/national-institutional-linked-dates.json \
            automation-intake/grossesondes/national-institutional-organizer-links.json \
