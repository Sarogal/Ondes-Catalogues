name: Ondes — surveillance publique en lecture seule

on:
  pull_request:
    paths:
      - 'monitoring/ondes_watchdog.php'
      - 'monitoring/README.md'
      - '.github/workflows/ondes-public-watchdog.yml'
  schedule:
    - cron: '29 04 * * *'
    - cron: '29 16 * * *'
  workflow_dispatch:
    inputs:
      audit_live:
        description: 'Auditer aussi les crons et les catalogues (peut signaler des incidents)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Vérifier le code et les tests locaux (aucune écriture)
        run: |
          php -l monitoring/ondes_watchdog.php
          php monitoring/ondes_watchdog.php --self-test
      - name: Vérifier le secret Healthchecks en mode manuel (sans ping)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          HEALTHCHECKS_ONDES_PING_URL: ${{ secrets.HEALTHCHECKS_ONDES_PING_URL }}
        run: |
          set -euo pipefail
          # Never print the value. A manual dispatch must not mask a missed cron
          # by sending a success heartbeat to the external monitor.
          if [[ -z "${HEALTHCHECKS_ONDES_PING_URL:-}" ]]; then
            echo "::error::Secret HEALTHCHECKS_ONDES_PING_URL absent ou vide."
            exit 1
          fi
          if [[ ! "${HEALTHCHECKS_ONDES_PING_URL}" =~ ^https://hc-ping\.com/[A-Za-z0-9_-]{32,128}/?$ ]]; then
            echo "::error::Le secret ne ressemble pas a une URL de ping Healthchecks valide."
            exit 1
          fi
          echo "Secret configure et format valide ; aucun ping effectue."
      - name: Contrôler les passages GitHub et les quatre catalogues servis
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.audit_live))
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: php monitoring/ondes_watchdog.php
      - name: Signaler une surveillance réussie au témoin externe (optionnel)
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
        env:
          HEALTHCHECKS_ONDES_PING_URL: ${{ secrets.HEALTHCHECKS_ONDES_PING_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${HEALTHCHECKS_ONDES_PING_URL:-}" ]]; then
            echo "Témoin externe non configuré : aucun ping envoyé."
            exit 0
          fi
          # Secret never appears in logs; accept only this expected provider.
          if [[ "${HEALTHCHECKS_ONDES_PING_URL}" != https://hc-ping.com/* ]]; then
            echo "::warning::Adresse du témoin externe invalide : attente d'une URL HTTPS hc-ping.com."
            exit 0
          fi
          # A ping never interferes with the publishing workflows. Healthchecks
          # warns independently when it does not receive an expected heartbeat.
          if ! curl --fail --silent --show-error --max-time 15 --retry 2 \
            --output /dev/null "${HEALTHCHECKS_ONDES_PING_URL}"; then
            echo "::warning::Le service de témoin externe n'a pas répondu."
          fi
