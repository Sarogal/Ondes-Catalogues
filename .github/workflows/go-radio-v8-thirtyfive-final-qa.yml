name: GO TEST radio v8 — full 35 original logo SHA Ed25519 continuity audit
on:
  push:
    branches:
      - feature/go-radio-v8-metalon-3-logos-20261123
    paths:
      - 'radio-catalog-lab/tools/test_go_radio_v8_35_official_sha_gate.py'
      - 'radio-catalog-lab/full-staging/UNSIGNED-radio-v8-35-official-sha-logos-20261123.json'
      - 'grossesondes/radio-test-v2/artwork/staging-exact-six-v8/**'
      - '.github/workflows/go-radio-v8-thirtyfive-final-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-35-shas-with-original-signed-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authentic Ed25519 predecessor and original image decoders
        run: python -m pip install 'pillow>=10,<12' 'cryptography>=42,<47' 'jsonschema>=4.21,<5'
      - name: Audit 35 distinct SHA source images, 320 GO IDs, 363 UUID owners
        run: python radio-catalog-lab/tools/test_go_radio_v8_35_official_sha_gate.py
      - name: Forbid signing TEST v8 or changing v7 live pointer
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('grossesondes/radio-test-v2')
          cur=json.loads((p/'current.json').read_text())
          assert cur['release_sequence']==7
          assert cur['content_sha256']=='f735884aa0841a86d88aaafe406e62b7a826cf9cd60f6a70285a0894326841aa'
          assert not (p/'current-v8.json').exists()
          print('GO_RADIO_TEST_V8_35_ONLY_UNSIGNED_TEST_V7_STILL_ACTIVE')
          PY
