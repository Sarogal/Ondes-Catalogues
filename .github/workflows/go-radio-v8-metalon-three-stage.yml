name: GO radio v8 — stage 3 Radio Metal ON originals as SHA blobs (DEV only)
on:
  push:
    branches:
      - feature/go-radio-v8-metalon-3-logos-20261123
    paths:
      - 'radio-catalog-lab/tools/stage_v8_metalon_official_logos.py'
      - '.github/workflows/go-radio-v8-metalon-three-stage.yml'
permissions:
  contents: write
  actions: read
jobs:
  stage-three-first-party-images:
    if: github.ref == 'refs/heads/feature/go-radio-v8-metalon-3-logos-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install signed release contract and decoder
        run: python -m pip install 'pillow>=10,<12' 'cryptography>=42,<47' 'jsonschema>=4.21,<5'
      - name: Download pinned actual Radio Metal ON image evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/metalon-official"
          gh run download 45161806138 --repo "$GITHUB_REPOSITORY" \
            --pattern go-v8-metalon-three-firstparty-logo-evidence \
            --dir "$RUNNER_TEMP/metalon-official"
      - name: Re-download original 3 images and create unsigned v8 only
        run: |
          python radio-catalog-lab/tools/stage_v8_metalon_official_logos.py \
            --artifact-root "$RUNNER_TEMP/metalon-official"
      - name: Verify cryptographic predecessor, JSON schema, identities and 3 SHA blobs
        run: |
          python - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          from jsonschema import Draft202012Validator,FormatChecker
          root=Path('.')
          signed=root/'grossesondes/radio-test-v2'
          src=signed/'releases/f735884aa0841a86d88aaafe406e62b7a826cf9cd60f6a70285a0894326841aa.json'
          draft=root/'radio-catalog-lab/full-staging/UNSIGNED-radio-v8-metalon-3-official-logos-20261123.json'
          schema=json.loads((root/'radio-catalog-lab/schemas/radio_catalog_v1.schema.json').read_text())
          old=json.loads(src.read_bytes())
          now=json.loads(draft.read_bytes())
          sys.path.insert(0,str(root/'radio-catalog-lab/tools'))
          from radio_catalog_release_packager import load_verified_predecessor,read_public_key
          from radio_catalog_guard import validate_catalog
          verified=load_verified_predecessor(signed,read_public_key(signed/'TEST_PUBLIC_KEY.b64'))
          assert verified==old
          assert not list(Draft202012Validator(schema,format_checker=FormatChecker()).iter_errors(now))
          assert not validate_catalog(now,mode='publish',previous=old,trusted_signed_history=True)
          assert now['release_sequence']==8 and old['release_sequence']==7
          assert len(now['stations'])==296 and len(now['tombstones'])==24
          assert now['tombstones']==old['tombstones']
          assert sum(s['status']['state']=='active' for s in now['stations'])==285
          assert sum(s['status']['state']=='active' and s['logo'] is None for s in now['stations'])==93
          before={s['go_station_id']:s for s in old['stations']}
          after={s['go_station_id']:s for s in now['stations']}
          assert before.keys()==after.keys()
          changed=[k for k in before if before[k]!=after[k]]
          assert set(changed)=={'go-station-000218','go-station-000046','go-station-000024'}
          for key in changed:
              assert before[key]['logo'] is None
              assert before[key]=={**after[key],'logo':None}
          blobs=list((signed/'artwork/staging-metalon-v8').glob('*'))
          assert len(blobs)==3
          for f in blobs:
              assert hashlib.sha256(f.read_bytes()).hexdigest()==f.stem
          assert json.loads((signed/'current.json').read_text())['release_sequence']==7
          print('GO_V8_3_METALON_STATION_LOGOS_SIGNABLE_GUARD_PASS')
          PY
      - name: Commit strict unsigned-catalog + 3 official SHA object allowlist on dev branch
        run: |
          test "$GITHUB_REF_NAME" = 'feature/go-radio-v8-metalon-3-logos-20261123'
          git add -- radio-catalog-lab/full-staging/UNSIGNED-radio-v8-metalon-3-official-logos-20261123.json \
            grossesondes/radio-test-v2/artwork/staging-metalon-v8/
          python - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          catalog='radio-catalog-lab/full-staging/UNSIGNED-radio-v8-metalon-3-official-logos-20261123.json'
          prefix='grossesondes/radio-test-v2/artwork/staging-metalon-v8/'
          assert len(paths)==4 and catalog in paths,paths
          assert len([p for p in paths if p.startswith(prefix) and p.endswith(('.webp','.jpg','.png'))])==3
          assert all(p==catalog or p.startswith(prefix) for p in paths)
          print('GO_V8_UNSIGNED_DEVELOPMENT_FOUR_FILE_ALLOWLIST_PASS')
          PY
          git -c user.name='Grosses Ondes TEST Logo Auditor' \
            -c user.email='go-logo-audit@localhost.invalid' \
            -c commit.gpgsign=false commit \
            -m 'test(radio v8): stage 3 official MetalON SHA logos, unsigned candidate'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "GO_V8_OFFICIAL_SHA_DEV_COMMIT_ONLY"
