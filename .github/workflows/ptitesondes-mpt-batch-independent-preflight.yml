name: "P'tites Ondes — aperçu lot familial MPT, source et GPS indépendants sans publication"

on:
  push:
    branches:
      - feat/ptitesondes-mpt-batch-independent-preflight-20261118
    paths:
      - scripts/ptitesondes_mpt_batch_independent_review.py
      - scripts/ptitesondes_mpt_batch_live_smoke.py
      - scripts/ptitesondes_mpt_independent_geo_pilot.py
      - scripts/ptitesondes_real_family_source_adapters.py
      - scripts/ptitesondes_mpt_listing_discovery.py
      - tests/test_ptitesondes_mpt_batch_independent_review.py
      - tests/test_ptitesondes_mpt_independent_geo_pilot.py
      - .github/workflows/ptitesondes-mpt-batch-independent-preflight.yml
  pull_request:
    paths:
      - scripts/ptitesondes_mpt_batch_independent_review.py
      - scripts/ptitesondes_mpt_batch_live_smoke.py
      - scripts/ptitesondes_mpt_independent_geo_pilot.py
      - scripts/ptitesondes_real_family_source_adapters.py
      - scripts/ptitesondes_mpt_listing_discovery.py
      - tests/test_ptitesondes_mpt_batch_independent_review.py
      - tests/test_ptitesondes_mpt_independent_geo_pilot.py
      - .github/workflows/ptitesondes-mpt-batch-independent-preflight.yml

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail-closed exact venue, MPT listing and national source tests
        run: |
          python -m py_compile scripts/ptitesondes_mpt_batch_independent_review.py
          python -m py_compile scripts/ptitesondes_mpt_batch_live_smoke.py
          python -m unittest discover -s tests -p 'test_ptitesondes_mpt_batch_independent_review.py' -v
          python -m unittest discover -s tests -p 'test_ptitesondes_mpt_independent_geo_pilot.py' -v
          python -m unittest discover -s tests -p 'test_ptitesondes_mpt_listing_discovery.py' -v
          python -m unittest discover -s tests -p 'test_ptitesondes_mpt_family_independent_preflight.py' -v
          python -m unittest discover -s tests -p 'test_ptitesondes_family_national_source_preflight.py' -v
  live-readonly:
    needs: offline
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bounded 24-page Montpellier official -> external IGN evidence preview
        run: python scripts/ptitesondes_mpt_batch_live_smoke.py
