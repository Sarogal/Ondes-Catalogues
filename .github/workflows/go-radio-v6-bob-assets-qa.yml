name: GO radio v6 TEST — verify 190 logos, redirects, 14 binary SHA objects
on:
  push:
    branches:
      - feature/go-radio-v6-dedupe-logo-audit-20261123
    paths:
      - 'radio-catalog-lab/tools/test_go_radio_v6_official_bob_assets.py'
      - 'radio-catalog-lab/full-staging/UNSIGNED-radio-v6-radcap-bob-3-duplicate-families-20261123.json'
      - 'grossesondes/radio-test-v2/artwork/staging-unpublished/**'
      - '.github/workflows/go-radio-v6-bob-assets-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-existing-signed-v5-and-unsigned-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema, Ed25519 and image decoder dependencies
        run: python -m pip install 'pillow>=10,<12' 'cryptography>=42,<47' 'jsonschema>=4.21,<5'
      - name: Verify real signed TEST v5, redirects, 190 logos and 14 SHA image binaries
        run: python radio-catalog-lab/tools/test_go_radio_v6_official_bob_assets.py
