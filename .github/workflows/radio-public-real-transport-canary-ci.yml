name: "Grosses Ondes — PUBLIC read-only radio stream network canary (5)"

on:
  push:
    branches:
      - feature/radio-release1-public-live-transport-canary-20261120
    paths:
      - ".github/workflows/radio-public-real-transport-canary-ci.yml"
      - "radio-catalog-lab/tools/radio_public_real_transport_canary.py"
      - "radio-catalog-lab/tools/test_radio_public_real_transport_canary.py"

permissions:
  contents: read

concurrency:
  group: go-public-real-radio-transport-canary
  cancel-in-progress: true

jobs:
  real-transport-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mandatory offline guard tests
        run: |
          set -euo pipefail
          python -m unittest discover -s radio-catalog-lab/tools -p "test_radio_public_real_transport_canary.py" -v
          python -m unittest discover -s radio-catalog-lab/tools -p "test_radio_catalog_batch_evidence_bridge.py" -v
      - name: Live HTTPS Radio Browser discovery + up to five audio probes
        run: |
          set -euo pipefail
          python radio-catalog-lab/tools/radio_public_real_transport_canary.py \
            --output-dir "$RUNNER_TEMP/go-public-real-transport" \
            --allow-network
      - name: Confirm no tracked file was modified
        run: |
          git diff --quiet --exit-code
          git diff --cached --quiet --exit-code
          echo "NO_STATION_APPROVED_NO_CATALOG_PUBLISHED"
      - name: Retain only URL-free public-directory technical evidence (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: go-radio-public-transport-canary-evidence
          path: ${{ runner.temp }}/go-public-real-transport/*.json
          retention-days: 7
          if-no-files-found: error
