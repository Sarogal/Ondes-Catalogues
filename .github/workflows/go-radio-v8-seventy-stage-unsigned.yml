name: GO TEST radio v8 — stage two exact owner channel SHA images UNSIGNED only
on:
  push:
    branches:
      - feature/go-radio-v8-metalon-3-logos-20261123
    paths:
      - 'radio-catalog-lab/tools/stage_v8_70_nts_pit_rockirk.py'
      - '.github/workflows/go-radio-v8-seventy-stage-unsigned.yml'
  workflow_dispatch:
permissions:
  contents: write
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  stage-two-owner-images-with-sha:
    if: github.ref == 'refs/heads/feature/go-radio-v8-metalon-3-logos-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install signed v7 Ed25519 and image verifiers
        run: python -m pip install 'Pillow==11.3.0' 'CairoSVG==2.8.2' 'defusedxml==0.7.1' 'cryptography>=42,<47' 'jsonschema>=4.21,<5'
      - name: Establish 68 authentic original SHAs and signed predecessor continuity
        run: python radio-catalog-lab/tools/test_go_radio_v8_68_channel_specific_sha_gate.py
      - name: Verify station owner pages and exact bytes twice, stage only unsigned DEV files
        run: python radio-catalog-lab/tools/stage_v8_70_nts_pit_rockirk.py
      - name: Verify new 70 SHA catalog locally before commit
        run: python radio-catalog-lab/tools/test_go_radio_v8_70_owner_sha_gate.py
      - name: Allowlist exactly two station-image blobs and one unsigned catalogue
        run: |
          git add -- radio-catalog-lab/full-staging/UNSIGNED-radio-v8-70-official-sha-logos-20261123.json grossesondes/radio-test-v2/artwork/staging-nts-rockirk-v8/
          python - <<'PY'
          import subprocess
          p=subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines()
          prefix="grossesondes/radio-test-v2/artwork/staging-nts-rockirk-v8/"
          catalog="radio-catalog-lab/full-staging/UNSIGNED-radio-v8-70-official-sha-logos-20261123.json"
          assert len(p)==3 and catalog in p,p
          assert len([x for x in p if x.startswith(prefix) and x.endswith(".jpg")])==2,p
          assert all(x==catalog or x.startswith(prefix) for x in p),p
          print("GO_V8_70_UNSIGNED_SHA_TWO_OWNER_IMAGE_ONLY_ALLOWLIST")
          PY
      - name: Commit three approved DEV files to feature branch only
        run: |
          git -c user.name='Grosses Ondes TEST Logo Auditor' -c user.email='go-logo-audit@localhost.invalid' -c commit.gpgsign=false commit -m 'test(radio v8): stage NTS The Pit and rock.irk first-party SHA art unsigned'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
