name: Grosses Ondes — Concerts nationaux sur runner public, revue privée

on:
  # One controlled post-merge cloud run for Concerts engine maintenance only.
  # Never execute on PR code with private credentials.
  push:
    branches: [main]
    paths:
      # Run the FIRST trusted post-merge cycle whenever relevant discovery,
      # qualification or independent review CODE changes on main. PRs never
      # execute with private credentials. Do not trigger on test-only changes.
      - 'automation/concerts/discover.py'
      - 'automation/concerts/feeds.py'
      - 'automation/concerts/triage.py'
      - 'automation/concerts/sources.json'
      - 'automation/concerts/generic_music_event.py'
      - 'automation/concerts/generic_visible_bill.py'
      - 'automation/concerts/generic_first_party_venue_specs_v1.json'
      - 'automation/concerts/official_html_evidence.py'
      - 'automation/concerts/published_watch.py'
      - 'automation/concerts/official_rss_jsonld_bridge.py'
      - 'automation/concerts/structured_first_party_preflight.py'
      - 'automation/concerts/dynamic_venue_evidence_preflight.py'
      - 'automation/concerts/test_dynamic_venue_evidence_preflight.py'
      - 'automation/concerts/venue_adapters.py'
      - 'automation/concerts/*_adapter.py'
      - 'automation/concerts/*_recheck.py'
      - 'automation/concerts/registry_funnel.py'
      - 'automation/concerts/artist_genre_knowledge.py'
      - 'automation/concerts/artist_genre_preflight.py'
      - 'automation/concerts/intake_archive.py'
      - 'automation/concerts/official_recheck.py'
      - 'automation/concerts/festival_tour_handoff.py'
      - 'automation/concerts/published_festival_tour_research.py'
      - 'automation/concerts/source_evidence_probe.py'
      - 'automation/concerts/tour_itinerary_evidence.py'
      - 'automation/concerts/verifier_contract.py'
      - 'automation/concerts/approval_preflight.py'
      - 'automation/concerts/backstage_recheck.py'
      - 'festival-automation/institutional_event_card.py'
      - 'festival-automation/festival_to_concerts_handoff.py'
      - '.github/workflows/grossesondes-concerts-private-intake-on-public-runners.yml'
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        description: Cycle de surveillance
        options: [normal, catchup]
        default: normal
        required: true
  schedule:
    - cron: '18 7 * * *'
    - cron: '11 13,20 * * *'

# Never run pull_request code with private tokens or Ticketmaster credentials.
permissions:
  contents: read

concurrency:
  group: grossesondes-concerts-public-private-intake
  cancel-in-progress: false

jobs:
  discover:
    if: github.repository == 'Sarogal/Ondes-Catalogues' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Vérifier la disponibilité des accès sans afficher de secret
        id: access
        shell: bash
        env:
          INTAKE_READ_TOKEN: ${{ secrets.GROSSES_ONDES_INTAKE_READ_TOKEN }}
          INTAKE_WRITE_TOKEN: ${{ secrets.GROSSES_ONDES_INTAKE_WRITE_TOKEN }}
        run: |
          if [[ -n "$INTAKE_READ_TOKEN" && -n "$INTAKE_WRITE_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Veille Concerts interrompue : secrets de lecture ou écriture de l'intake privé absents"
            echo "ÉCHEC : veille Concerts non exécutée, accès privé manquant." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.access.outputs.ready == 'true'
        with:
          ref: main
          path: public
          persist-credentials: false

      - name: Lire uniquement les états et approbations privés
        if: steps.access.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: Sarogal/GrossesOndes
          ref: main
          path: confidential
          token: ${{ secrets.GROSSES_ONDES_INTAKE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            automation/concerts/approved.json
            automation/concerts/intake/
          sparse-checkout-cone-mode: false

      # Read only the private festival intake branch. No new private schedule.
      - name: Lire les pistes de tournées transmises par Festivals
        if: steps.access.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: Sarogal/GrossesOndes
          ref: automation/grossesondes-intake
          path: festival-intake
          token: ${{ secrets.GROSSES_ONDES_INTAKE_READ_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            automation-intake/grossesondes/concert-tour-referrals.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        if: steps.access.outputs.ready == 'true'
        with:
          python-version: '3.12'

      - name: Préparer un espace de travail sans artefact ou log public
        if: steps.access.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s confidential/automation/concerts/approved.json
          test -s confidential/automation/concerts/intake/registry.json
          mkdir -p "$RUNNER_TEMP/concerts-discovery" \
            "$RUNNER_TEMP/concerts-tours" "$RUNNER_TEMP/concerts-organizers" \
            "$RUNNER_TEMP/concerts-private-logs"
          python -m compileall -q public/automation/concerts

      - name: Veille nationale des salles, agendas et Ticketmaster
        if: steps.access.outputs.ready == 'true'
        shell: bash
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: |
          set -euo pipefail
          if ! python public/automation/concerts/discover.py \
             --output "$RUNNER_TEMP/concerts-discovery" \
             > "$RUNNER_TEMP/concerts-private-logs/discovery.log" 2>&1; then
            echo "::error::La collecte Concerts a échoué ; les sorties restent confidentielles"
            exit 1
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "concerts-discovery/candidates.json"
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data.get("schema") == "grossesondes.concert.discovery.v1"
          assert data.get("publicationAllowed") is False
          assert data.get("automaticPublication") is False
          assert all(c.get("publicationAllowed") is False for c in data["candidates"])
          print("Collecte nationale réussie : pistes en quarantaine, aucune publication.")
          PY

      # Un passage couvre toutes les sources actives, même si GitHub retarde les schedules.
      - name: Découverte des tournées d'artistes déjà référencés
        if: steps.access.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! python public/automation/concerts/artist_tour_discovery.py \
              --max-sources 20 --output "$RUNNER_TEMP/concerts-tours" \
              > "$RUNNER_TEMP/concerts-private-logs/tours.log" 2>&1; then
            echo "::error::La veille des tournées a échoué ; aucune sortie privée publiée"
            exit 1
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "concerts-tours/candidates.json"
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data.get("schema") == "grossesondes.concert.discovery.v1"
          assert data.get("publicationAllowed") is False
          assert all(c.get("publicationAllowed") is False for c in data["candidates"])
          print("Tournées qualifiées en recherche seulement ; aucune date automatiquement approuvée.")
          PY

      # No band is selected from the catalogue here. Each event source is
      # independently scoped to a reviewed first-party concert organizer;
      # new names, places, genre, and dates remain private review evidence.
      - name: Découvrir les concerts officiels sans liste de groupes connus
        if: steps.access.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! python public/automation/concerts/organizer_event_discovery.py \
              --max-detail 6 --output "$RUNNER_TEMP/concerts-organizers" \
              > "$RUNNER_TEMP/concerts-private-logs/organizers.log" 2>&1; then
            echo "::error::La veille des organisateurs officiels a échoué ; aucun ajout privé"
            exit 1
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "concerts-organizers/candidates.json"
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data.get("schema") == "grossesondes.concert.discovery.v1"
          assert data.get("publicationAllowed") is False
          assert data.get("automaticPublication") is False
          assert all(c.get("publicationAllowed") is False
                     and c.get("reviewRequired") is True
                     and c.get("source") == "organizer_official_event_detail"
                     for c in data["candidates"])
          print("Découverte organisateurs vérifiée : quarantaine privée uniquement.")
          PY

      - name: Requalifier les tournées Festivals en pistes Concerts vérifiées
        if: steps.access.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # No authority flows from the private JSON: exact institutional
          # index -> event link -> detail must be re-fetched independently.
          if ! python public/automation/concerts/festival_tour_handoff.py \
              --input festival-intake/automation-intake/grossesondes/concert-tour-referrals.json \
              --output "$RUNNER_TEMP/concerts-festival-referrals/candidates.json" \
              --limit 5 \
              > "$RUNNER_TEMP/concerts-private-logs/festival-tour-handoff.log" 2>&1; then
            echo "::error::Transfert privé Festivals vers Concerts non vérifié"
            exit 1
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "concerts-festival-referrals/candidates.json"
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data.get("schema") == "grossesondes.concert.discovery.v1"
          assert data.get("publicationAllowed") is False
          assert data.get("automaticPublication") is False
          assert all(c.get("publicationAllowed") is False
                     and c.get("reviewRequired") is True
                     and c.get("source") == "festival_to_concerts_handoff"
                     and c.get("reviewBucket") == "tour_source_research"
                     and c.get("leadArtist") is None
                     and c.get("venue") is None
                     for c in data["candidates"])
          print("Transfert Festivals -> Concerts vérifié : revue privée uniquement.")
          PY

      - name: Recouper les étapes de tournées déjà publiées par Festivals
        if: steps.access.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Existing signed Festival rows may nominate concert research:
          # same official festival website, recurring named bill, distinct
          # future single-day dates/cities and EXPLICIT touring language.
          # No network, new publisher authority, or event reclassification.
          if ! python public/automation/concerts/published_festival_tour_research.py \
              --festivals public/docs/grossesondes/festivals.json \
              --output "$RUNNER_TEMP/concerts-festival-published/candidates.json" \
              > "$RUNNER_TEMP/concerts-private-logs/published-festival-tour-research.log" 2>&1; then
            echo "::error::Rattrapage des concerts déjà classés Festivals impossible"
            exit 1
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "concerts-festival-published/candidates.json"
          doc = json.loads(p.read_text(encoding="utf-8"))
          assert doc.get("schema") == "grossesondes.concert.discovery.v1"
          assert doc.get("publicationAllowed") is False
          assert doc.get("automaticPublication") is False
          assert doc.get("triageCounts", {}).get("tour_source_research") == len(doc["candidates"])
          assert all(c.get("publicationAllowed") is False
                     and c.get("reviewRequired") is True
                     and c.get("festivalCatalogueHintsOnly") is True
                     and c.get("requiresArtistAndVenueReproof") is True
                     and c.get("officialDetailFound") is False
                     and c.get("source") == "festival_published_tour_research"
                     and c.get("reviewBucket") == "tour_source_research"
                     for c in doc["candidates"])
          print("Anciennes étapes de tournées Festivals nommées pour revue Concerts privée.")
          PY

      - name: Archiver les découvertes et les tournées Festivals dans le registre privé
        if: steps.access.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          STORE="confidential/automation/concerts/intake/registry.json"
          for channel in concerts-discovery concerts-tours concerts-organizers concerts-festival-referrals concerts-festival-published; do
            if ! python public/automation/concerts/intake_archive.py \
                --source "$RUNNER_TEMP/$channel/candidates.json" \
                --store "$STORE" --summary "$RUNNER_TEMP/$channel/archive-summary.json" \
                > "$RUNNER_TEMP/concerts-private-logs/$channel-archive.log" 2>&1; then
              echo "::error::Archivage privé refusé : $channel"
              exit 1
            fi
          done

      - name: Revérification générique des concerts structurés (diagnostic privé)
        if: steps.access.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Evidence-only trial: no changes to approval signatures or public JSON.
          # Neither candidate identities nor official URLs appear in public logs.
          if ! python public/automation/concerts/structured_first_party_preflight.py \
              --registry confidential/automation/concerts/intake/registry.json \
              --sources public/automation/concerts/sources.json \
              --catalogue public/docs/grossesondes/concerts.json \
              --approvals confidential/automation/concerts/approved.json \
              --out confidential/automation/concerts/intake/structured-first-party-preflight.json \
              > "$RUNNER_TEMP/concerts-private-logs/structured-preflight.log" 2>&1; then
            echo "::warning::Prévalidation structurée indisponible : les approbations existantes restent inchangées."
          else
            echo "Revérification structurée générique enregistrée en privé, sans approbation."
          fi

      - name: Attester les concerts de lieux non agréés par des preuves indépendantes (privé seul)
        if: steps.access.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Official pages + independently named OSM geometry. Discovery
          # sources never authorize an event or venue; no public logs.
          if ! python public/automation/concerts/dynamic_venue_evidence_preflight.py \
              --registry confidential/automation/concerts/intake/registry.json \
              --sources public/automation/concerts/sources.json \
              --catalogue public/docs/grossesondes/concerts.json \
              --approvals confidential/automation/concerts/approved.json \
              --out confidential/automation/concerts/intake/dynamic-venue-evidence.json \
              > "$RUNNER_TEMP/concerts-private-logs/dynamic-venue-evidence.log" 2>&1; then
            echo "::warning::Diagnostic indépendant des lieux indisponible ; aucune admission."
          else
            echo "Diagnostic géographique officiel privé enregistré ; aucune approbation."
          fi

      - name: Vérifier les genres individuels sur les sources officielles d'artistes (privé seul)
        if: steps.access.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Source manifest committed on main, independent fresh HTTPS fetch,
          # robots checks. Never log performer identities or page contents.
          if ! python public/automation/concerts/artist_genre_preflight.py \
              --sources public/automation/concerts/artist-tour-sources.json \
              --catalogue public/docs/grossesondes/concerts.json \
              --out confidential/automation/concerts/intake/artist-genre-evidence.json \
              > "$RUNNER_TEMP/concerts-private-logs/artist-genre-preflight.log" 2>&1; then
            echo "::warning::Sources artistes indisponibles : aucune connaissance individuelle nouvelle."
          else
            echo "Genres officiels des artistes relus indépendamment, preuve privée sans approbation."
          fi

      - name: Valider les approbations avec données privées avant activation éventuelle
        if: steps.access.outputs.ready == 'true'
        shell: bash
        env:
          GROSSES_ONDES_CONCERTS_AUTOREVIEW: ${{ vars.GROSSES_ONDES_CONCERTS_AUTOREVIEW }}
        run: |
          set -euo pipefail
          if [ "$GROSSES_ONDES_CONCERTS_AUTOREVIEW" = "enabled" ]; then
            cp confidential/automation/concerts/approved.json public/automation/concerts/approved.json
            if ! python -m unittest discover -s public/automation/concerts -p 'test_*.py' -v \
                > "$RUNNER_TEMP/concerts-private-logs/private-approval-regression.log" 2>&1; then
              echo "::error::Tests privés Concerts échoués : aucune approbation appliquée"
              exit 1
            fi
            echo "Contrôle privé des approbations exécuté sans journal public."
          fi

      - name: Revérifier et approuver uniquement si le verrou existant le permet
        if: steps.access.outputs.ready == 'true'
        shell: bash
        env:
          GROSSES_ONDES_CONCERTS_AUTOREVIEW: ${{ vars.GROSSES_ONDES_CONCERTS_AUTOREVIEW }}
        run: |
          set -euo pipefail
          # Three daily UTC cron windows (07, 13, 20) use nonoverlapping
          # candidate cohorts. Formerly every run on a given day rechecked
          # exactly the same 10 registry rows.
          UTC_HOUR="$(date -u +%H)"
          SCAN_SLOT=$((10#$UTC_HOUR / 8))
          # Generate proposal only; persistent writes require publisher preflight.
          if ! python public/automation/concerts/official_recheck.py \
              --scan-slot "$SCAN_SLOT" \
              --registry confidential/automation/concerts/intake/registry.json \
              --approvals confidential/automation/concerts/approved.json \
              --out "$RUNNER_TEMP/concerts-official-approvals-preview.json" \
              --report "$RUNNER_TEMP/concerts-official-review.json" \
              > "$RUNNER_TEMP/concerts-private-logs/official-review.log" 2>&1; then
            echo "::error::La revue officielle Concerts a échoué : approbation suspendue"
            exit 1
          fi
          if [ "$GROSSES_ONDES_CONCERTS_AUTOREVIEW" = "enabled" ]; then
            echo "Contrôles privés et revue officielle validés ; approbations stockées uniquement en privé." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Revue officielle en prévisualisation : approbations inchangées." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prévalider chaque nouvelle approbation avec le vrai moteur de publication
        id: publisher_preflight
        if: steps.access.outputs.ready == 'true'
        shell: bash
        env:
          GROSSES_ONDES_CONCERTS_AUTOREVIEW: ${{ vars.GROSSES_ONDES_CONCERTS_AUTOREVIEW }}
        run: |
          set -euo pipefail
          OPTIONS=()
          if [ "$GROSSES_ONDES_CONCERTS_AUTOREVIEW" = "enabled" ]; then
            OPTIONS+=(--apply)
          fi
          # The old private diagnosis must not be mistaken for this run.
          # Git history preserves old reports; this is only runner workspace.
          rm -f confidential/automation/concerts/intake/approval-preflight.json
          # Sensitive evidence never enters a public artifact or log.
          if ! python public/automation/concerts/approval_preflight.py \
              --before confidential/automation/concerts/approved.json \
              --candidate "$RUNNER_TEMP/concerts-official-approvals-preview.json" \
              --reference public/docs/grossesondes/concerts-reference.json \
              --catalogue public/docs/grossesondes/concerts.json \
              --report confidential/automation/concerts/intake/approval-preflight.json \
              "${OPTIONS[@]}" \
              > "$RUNNER_TEMP/concerts-private-logs/approval-preflight.log" 2>&1; then
            # Keep decisions closed, but do not lose the private discoveries:
            # the registry and private diagnostics will be committed first.
            echo "outcome=blocked" >> "$GITHUB_OUTPUT"
            python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          log = Path(os.environ["RUNNER_TEMP"]) / "concerts-private-logs/approval-preflight.log"
          lines = log.read_text(encoding="utf-8", errors="replace").splitlines()
          reason = next((x[:300] for x in reversed(lines)
                         if x.startswith(("ValueError:", "TypeError:", "KeyError:"))),
                        "preflight_execution_error")
          target = Path("confidential/automation/concerts/intake/approval-preflight.json")
          # The private preflight has already saved detailed publisher
          # rejections when its controlled PublisherRejections error occurs.
          # Preserve that structured report; other exceptions use a generic
          # fallback. Never read an old-run report (deleted above).
          report = None
          if target.exists():
              try:
                  candidate = json.loads(target.read_text(encoding="utf-8"))
                  if (candidate.get("status") == "blocked"
                          and candidate.get("validatedByPublisher") is False
                          and candidate.get("applied") is False
                          and isinstance(candidate.get("rejected"), list)):
                      report = candidate
              except (OSError, ValueError, TypeError, AttributeError):
                  pass
          if report is None:
              report = {
                  "status": "blocked",
                  "validatedByPublisher": False,
                  "applied": False,
                  "reason": reason,
                  "recordedAt": dt.datetime.now(dt.timezone.utc).isoformat(),
              }
          target.write_text(json.dumps(
              report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
            echo "::warning::Prévalidation Concerts refusée ; sauvegarde privée des découvertes avant échec final."
          else
            echo "outcome=passed" >> "$GITHUB_OUTPUT"
            echo "Prévalidation officielle et compatibilité éditeur contrôlées sans fuite privée." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Vérifier les annulations, reports et incohérences des concerts publiés
        if: steps.access.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! python public/automation/concerts/published_watch.py \
              --report "$RUNNER_TEMP/concerts-published-watch.json" \
              --summary "$RUNNER_TEMP/concerts-published-watch.md" \
              --max-check 24 \
              > "$RUNNER_TEMP/concerts-private-logs/published-watch.log" 2>&1; then
            echo "::error::Contrôle des concerts publiés indisponible ; aucun rapport privé modifié"
            exit 1
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "concerts-published-watch.json"
          report = json.loads(p.read_text(encoding="utf-8"))
          assert isinstance(report.get("needsReview"), list)
          print("Contrôle des concerts publiés effectué ; modifications automatiques interdites.")
          PY

      - name: Relever les premières parties manquantes des concerts déjà publiés
        if: steps.access.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # This scans FUTURE published concerts regardless of venue host.
          # HTTPS network is DNS-pinned/robots-aware; exact official bill,
          # date and named site must match. No automatic catalogue mutation.
          UTC_HOUR="$(date -u +%H)"
          SCAN_SLOT=$((10#$UTC_HOUR / 8))
          if ! python public/automation/concerts/published_lineup_audit.py \
              --catalogue public/docs/grossesondes/concerts.json \
              --output confidential/automation/concerts/intake/published-lineup-audit.json \
              --slot "$SCAN_SLOT" --max 6 \
              > "$RUNNER_TEMP/concerts-private-logs/published-lineup-audit.log" 2>&1; then
            echo "::warning::Audit de complétude des plateaux indisponible ; aucune correction."
          else
            echo "Audit privé de complétude effectué sans modification des concerts."
          fi

      - name: Conserver les rapports sensibles uniquement dans le dépôt privé
        if: steps.access.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target="confidential/automation/concerts/intake"
          cp "$RUNNER_TEMP/concerts-official-review.json" "$target/official-review.json"
          cp "$RUNNER_TEMP/concerts-published-watch.json" "$target/published-watch.json"

      - name: Mesurer la couverture des sources et le progrès de la veille en privé
        if: steps.access.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! python public/automation/concerts/intake_metrics.py \
              --discovery "$RUNNER_TEMP/concerts-discovery/candidates.json" \
              --tours "$RUNNER_TEMP/concerts-tours/candidates.json" \
              --organizers "$RUNNER_TEMP/concerts-organizers/candidates.json" \
              --registry confidential/automation/concerts/intake/registry.json \
              --official "$RUNNER_TEMP/concerts-official-review.json" \
              --watch "$RUNNER_TEMP/concerts-published-watch.json" \
              --venue-archive "$RUNNER_TEMP/concerts-discovery/archive-summary.json" \
              --tour-archive "$RUNNER_TEMP/concerts-tours/archive-summary.json" \
              --organizer-archive "$RUNNER_TEMP/concerts-organizers/archive-summary.json" \
              --out confidential/automation/concerts/intake/daily-metrics.json \
              > "$RUNNER_TEMP/concerts-private-logs/intake-metrics.log" 2>&1; then
            # Metrics cannot destroy the already-collected private leads.
            echo "::warning::Bilan privé indisponible, archivage poursuivi."
          fi

      - name: Auditer en privé la conversion de tous les candidats Concerts
        if: steps.access.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          artist_genre_args=()
          if [ -s confidential/automation/concerts/intake/artist-genre-evidence.json ]; then
            artist_genre_args=(--artist-evidence confidential/automation/concerts/intake/artist-genre-evidence.json)
          fi
          if ! python public/automation/concerts/registry_funnel.py \
              --registry confidential/automation/concerts/intake/registry.json \
              --approvals confidential/automation/concerts/approved.json \
              --catalogue public/docs/grossesondes/concerts.json \
              "${artist_genre_args[@]}" \
              --output confidential/automation/concerts/intake/registry-funnel.json \
              > "$RUNNER_TEMP/concerts-private-logs/registry-funnel.log" 2>&1; then
            # Never publish the private diagnostic or interrupt the safe archive.
            echo "::warning::Entonnoir privé indisponible ; registre conservé."
          fi

      - name: Recenser les salles à agréer sans autoriser leur publication
        if: steps.access.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Public catalogue/source identity only. No approvals, credentials
          # or private registry are consulted; result stays private.
          if ! python public/automation/concerts/venue_admission_audit.py \
              --sources public/automation/concerts/sources.json \
              --catalogue public/docs/grossesondes/concerts.json \
              --output confidential/automation/concerts/intake/venue-admission-audit.json \
              > "$RUNNER_TEMP/concerts-private-logs/venue-admission-audit.log" 2>&1; then
            echo "::warning::Audit d'agrément des salles indisponible ; aucune autorisation accordée."
          fi

      - name: Découvrir les domaines officiels inconnus dans le registre privé
        if: steps.access.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Open-ended source leads from the WHOLE private backlog, not a
          # static list of known venues/organizers. OFFLINE and private only.
          # A candidate domain never gets publisher authority from this step.
          if ! python public/automation/concerts/source_admission_intake.py \
              --registry confidential/automation/concerts/intake/registry.json \
              --catalogue public/docs/grossesondes/concerts.json \
              --output confidential/automation/concerts/intake/source-admission-intake.json \
              > "$RUNNER_TEMP/concerts-private-logs/source-admission-intake.log" 2>&1; then
            echo "::warning::File de découverte des sources non générée ; aucun domaine agréé."
          else
            echo "File privée de qualification de sources constituée ; aucune confiance attribuée."
          fi

      - name: Examiner sans agrément les sources HTTPS inconnues (privé uniquement)
        if: steps.access.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Fresh HTTPS fetch on DNS-pinned public IPs, TLS SNI, robots,
          # NO redirects, host budget/rotation. Only private proof hints;
          # no dynamic authority registration or publisher/approvals write.
          if [ -s confidential/automation/concerts/intake/source-admission-intake.json ]; then
            UTC_HOUR="$(date -u +%H)"
            SCAN_SLOT=$((10#$UTC_HOUR / 8))
            if ! python public/automation/concerts/source_evidence_probe.py \
                --intake confidential/automation/concerts/intake/source-admission-intake.json \
                --output confidential/automation/concerts/intake/source-evidence-probe.json \
                --scan-slot "$SCAN_SLOT" --max-hosts 3 \
                > "$RUNNER_TEMP/concerts-private-logs/source-evidence-probe.log" 2>&1; then
              echo "::warning::Sondage sécurisé des nouveaux domaines indisponible : aucune admission."
            else
              echo "Preuves HTTPS privées collectées ; aucune autorité ni date de concert approuvée."
            fi
          fi

      - name: Retrouver les anciennes preuves indépendantes des domaines inconnus (privé)
        if: steps.access.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # A domain used by two independently signed AND published past
          # concerts may carry reusable provenance. This does NOT certify
          # current domain ownership or issue a new authority/approval.
          if [ -s confidential/automation/concerts/intake/source-admission-intake.json ]; then
            if ! python public/automation/concerts/source_historical_provenance.py \
                --intake confidential/automation/concerts/intake/source-admission-intake.json \
                --approvals confidential/automation/concerts/approved.json \
                --catalogue public/docs/grossesondes/concerts.json \
                --sources public/automation/concerts/sources.json \
                --output confidential/automation/concerts/intake/source-historical-provenance.json \
                > "$RUNNER_TEMP/concerts-private-logs/source-historical-provenance.log" 2>&1; then
              echo "::warning::Provenance historique non corroborée ; aucune autorité nouvelle."
            else
              echo "Preuves historiques privées rapprochées ; admission interdite sans preuve fraîche."
            fi
          fi

      - name: Croiser les annonces officielles de domaines différents (privé seul)
        if: steps.access.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Same date + lead artist + municipality across distinct domains
          # yields a RESEARCH LEAD, never an independently signed concert.
          # Venue name conflicts stay explicit blockers, not silent aliases.
          if ! python public/automation/concerts/source_cross_domain_corroboration.py \
              --registry confidential/automation/concerts/intake/registry.json \
              --catalogue public/docs/grossesondes/concerts.json \
              --output confidential/automation/concerts/intake/source-cross-domain-corroboration.json \
              > "$RUNNER_TEMP/concerts-private-logs/source-cross-domain-corroboration.log" 2>&1; then
            echo "::warning::Rapprochement multi-source indisponible : aucune admission."
          else
            echo "Rapprochements inter-domaines enregistrés en privé sans autorisation de publication."
          fi

      - name: Revérifier les mêmes concerts sur deux domaines officiels distincts (privé)
        if: steps.access.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Distinct domains must each serve the same named first-party
          # individual concert, date and venue, via pinned safe HTTPS.
          # This is EVENT corroboration, not a source ownership attestation.
          if [ -s confidential/automation/concerts/intake/source-cross-domain-corroboration.json ]; then
            UTC_HOUR="$(date -u +%H)"
            SCAN_SLOT=$((10#$UTC_HOUR / 8))
            if ! python public/automation/concerts/source_cross_domain_live_recheck.py \
                --input confidential/automation/concerts/intake/source-cross-domain-corroboration.json \
                --output confidential/automation/concerts/intake/source-cross-domain-fresh-evidence.json \
                --scan-slot "$SCAN_SLOT" --max-groups 3 \
                > "$RUNNER_TEMP/concerts-private-logs/source-cross-domain-fresh-evidence.log" 2>&1; then
              echo "::warning::Revérification croisée indisponible, aucune approbation."
            else
              echo "Revérification fraîche multiorigines terminée en privé, aucune source agréée."
            fi
          fi

      - name: Conserver uniquement le registre et les revues dans le dépôt privé
        if: steps.access.outputs.ready == 'true'
        working-directory: confidential
        shell: bash
        env:
          INTAKE_PUSH_TOKEN: ${{ secrets.GROSSES_ONDES_INTAKE_WRITE_TOKEN }}
          GROSSES_ONDES_CONCERTS_AUTOREVIEW: ${{ vars.GROSSES_ONDES_CONCERTS_AUTOREVIEW }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Sparse checkout uses a blobless promisor remote: git add may fetch
          # missing private objects. Keep scoped authentication for add/commit/push.
          # GitHub checkout credentials remain unpersisted in the repository.
          HEADER="$(printf 'x-access-token:%s' "$INTAKE_PUSH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $HEADER"
          git add --sparse -- automation/concerts/intake/registry.json automation/concerts/intake/official-review.json automation/concerts/intake/approval-preflight.json automation/concerts/intake/published-watch.json
          if [ -f automation/concerts/intake/daily-metrics.json ]; then
            git add --sparse -- automation/concerts/intake/daily-metrics.json
          fi
          if [ -f automation/concerts/intake/published-lineup-audit.json ]; then
            git add --sparse -- automation/concerts/intake/published-lineup-audit.json
          fi
          if [ -f automation/concerts/intake/registry-funnel.json ]; then
            git add --sparse -- automation/concerts/intake/registry-funnel.json
          fi
          if [ -f automation/concerts/intake/structured-first-party-preflight.json ]; then
            git add --sparse -- automation/concerts/intake/structured-first-party-preflight.json
          fi
          if [ -f automation/concerts/intake/dynamic-venue-evidence.json ]; then
            git add --sparse -- automation/concerts/intake/dynamic-venue-evidence.json
          fi
          if [ -f automation/concerts/intake/artist-genre-evidence.json ]; then
            git add --sparse -- automation/concerts/intake/artist-genre-evidence.json
          fi
          if [ -f automation/concerts/intake/venue-admission-audit.json ]; then
            git add --sparse -- automation/concerts/intake/venue-admission-audit.json
          fi
          if [ -f automation/concerts/intake/source-admission-intake.json ]; then
            git add --sparse -- automation/concerts/intake/source-admission-intake.json
          fi
          if [ -f automation/concerts/intake/source-evidence-probe.json ]; then
            git add --sparse -- automation/concerts/intake/source-evidence-probe.json
          fi
          if [ -f automation/concerts/intake/source-historical-provenance.json ]; then
            git add --sparse -- automation/concerts/intake/source-historical-provenance.json
          fi
          if [ -f automation/concerts/intake/source-cross-domain-corroboration.json ]; then
            git add --sparse -- automation/concerts/intake/source-cross-domain-corroboration.json
          fi
          if [ -f automation/concerts/intake/source-cross-domain-fresh-evidence.json ]; then
            git add --sparse -- automation/concerts/intake/source-cross-domain-fresh-evidence.json
          fi
          if [ "$GROSSES_ONDES_CONCERTS_AUTOREVIEW" = "enabled" ]; then
            # The private approvals file is staged only after real publisher
            # acceptance. A blocked proposal must never enter the commit.
            if [ "${{ steps.publisher_preflight.outputs.outcome }}" = "passed" ]; then
              git add -- automation/concerts/approved.json
            fi
          fi
          if git diff --cached --quiet; then
            echo "Aucune nouvelle piste à enregistrer."
          else
            git commit -m 'data(concerts): archiver la veille publique en registre privé'
            # Another PRIVATE main commit may land during the 10-12 minute
            # discovery (e.g. a maintenance PR). Never force-push or overwrite
            # a newer registry. Retry ONLY when a clean rebase can preserve
            # both histories; a real data conflict stops the cycle safely.
            pushed=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              if [ "$attempt" -ge 3 ]; then
                break
              fi
              if ! git fetch --no-tags origin main > "$RUNNER_TEMP/concerts-private-logs/git-fetch-retry.log" 2>&1; then
                echo "::error::Intake privé : mise à jour distante impossible, archivage suspendu."
                exit 1
              fi
              if ! git -c rebase.autoStash=false rebase --no-autostash origin/main > "$RUNNER_TEMP/concerts-private-logs/git-rebase-retry.log" 2>&1; then
                git rebase --abort > /dev/null 2>&1 || true
                echo "::error::Intake privé : modifications concurrentes incompatibles ; aucune écriture forcée."
                exit 1
              fi
              echo "::warning::Intake privé : commit concurrent réconcilié sans écrasement."
            done
            if [ "$pushed" != true ]; then
              echo "::error::Intake privé : impossible de sauvegarder après 3 tentatives ; aucune écriture forcée."
              exit 1
            fi
          fi
          echo "Concerts : moteur public exécuté ; registre et revue confidentiels, aucune publication directe." >> "$GITHUB_STEP_SUMMARY"

      - name: Refuser le cycle après archivage des pistes privées si prévalidation bloquée
        if: steps.access.outputs.ready == 'true' && steps.publisher_preflight.outputs.outcome == 'blocked'
        shell: bash
        run: |
          echo "::error::Prévalidation éditeur refusée ; découvertes et motif sauvegardés uniquement en privé."
          exit 1
