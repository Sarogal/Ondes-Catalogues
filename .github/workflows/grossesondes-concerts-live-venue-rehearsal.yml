name: Grosses Ondes — essai réel en lecture seule des trois salles

on:
  pull_request:
    paths:
      - 'automation/concerts/live_three_source_readonly.py'
      - '.github/workflows/grossesondes-concerts-live-venue-rehearsal.yml'

permissions:
  contents: read

jobs:
  live-rehearsal:
    if: github.repository == 'Sarogal/Ondes-Catalogues'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Three first-party live pages + independent publisher (NO secrets)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python automation/concerts/live_three_source_readonly.py
