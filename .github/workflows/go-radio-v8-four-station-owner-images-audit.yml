name: GO radio TEST v8 — four owner logo originals source audit (READ ONLY)
on:
  push:
    branches: [feature/go-radio-v8-metalon-3-logos-20261123]
    paths:
      - 'radio-catalog-lab/tools/audit_v8_four_rocker_idobi_zeno_sftd.py'
      - '.github/workflows/go-radio-v8-four-station-owner-images-audit.yml'
permissions:
  contents: read
jobs:
  sha-original-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow bounded image decoder
        run: python -m pip install 'pillow>=10,<12'
      - name: Guard named station identity and original stream offline
        run: python radio-catalog-lab/tools/audit_v8_four_rocker_idobi_zeno_sftd.py --output "$RUNNER_TEMP/offline.json"
      - name: Read publisher pages and SHA256 image originals
        run: python radio-catalog-lab/tools/audit_v8_four_rocker_idobi_zeno_sftd.py --network --output "$RUNNER_TEMP/online.json"
      - name: Verify no signed or public output is touched
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'online.json').read_text())
          assert d['scope']=='GO_V8_FOUR_ADDITIONAL_INDEPENDENT_RADIO_ORIGINALS_AUDIT'
          assert d['count']==4 and len(d['records'])==4
          assert d['signed'] is False and d['published'] is False
          print('FOUR_INDEPENDENT_RADIO_LOGOS_READ_ONLY_NO_PUBLICATION')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: go-radio-four-owner-logo-sha-evidence
          path: ${{ runner.temp }}/online.json
          retention-days: 14
