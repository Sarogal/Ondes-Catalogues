name: GO AA deferred artwork unit tests
on:
  push:
    branches: [audit/go-aa-deferred-artwork-lab-20261125]
    paths:
      - 'radio-catalog-lab/flutter/lib/central_media_artwork_hydration.dart'
      - 'radio-catalog-lab/flutter/test/central_media_artwork_hydration_test.dart'
      - 'radio-catalog-lab/flutter/lib/media_selection_intent.dart'
      - 'radio-catalog-lab/flutter/test/media_selection_intent_test.dart'
      - 'radio-catalog-lab/flutter/lib/media_icy_transition.dart'
      - 'radio-catalog-lab/flutter/test/media_icy_transition_test.dart'
      - '.github/workflows/go-aa-deferred-artwork-lab.yml'
permissions:
  contents: read
jobs:
  flutter-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: radio-catalog-lab/flutter
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze deferred hydration
        run: flutter analyze --fatal-infos lib/central_media_artwork_hydration.dart test/central_media_artwork_hydration_test.dart
      - name: Test generation-aware nonblocking artwork hydration
        run: flutter test --reporter expanded test/central_media_artwork_hydration_test.dart
      - name: Existing signed logo serialization and version controls
        run: flutter test --reporter expanded test/central_signed_artwork_work_queue_test.dart test/central_signed_artwork_version_guard_test.dart
      - name: Analyze selection intent
        run: flutter analyze --fatal-infos lib/media_selection_intent.dart test/media_selection_intent_test.dart
      - name: Verify competing asynchronous station selections
        run: flutter test --reporter expanded test/media_selection_intent_test.dart
      - name: Analyze ICY transition filter
        run: flutter analyze --fatal-infos lib/media_icy_transition.dart test/media_icy_transition_test.dart
      - name: Verify ICY source boundaries and same-track recurrence
        run: flutter test --reporter expanded test/media_icy_transition_test.dart
