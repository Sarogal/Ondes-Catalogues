name: GO radio TEST v8 — 13 publisher SHA logos full safety preflight
on:
  push:
    branches:
      - feature/go-radio-v8-metalon-3-logos-20261123
    paths:
      - 'radio-catalog-lab/tools/test_go_radio_v8_13_official_sha_gate.py'
      - 'radio-catalog-lab/full-staging/UNSIGNED-radio-v8-metalon-3-independent-3-firstparty-7-20261123.json'
      - 'grossesondes/radio-test-v2/artwork/staging-official-site-v8/**'
      - '.github/workflows/go-radio-v8-thirteen-firstparty-final-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-all-thirteen-images-with-original-signed-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original Ed25519 and image decoders
        run: python -m pip install 'cryptography>=42,<47' 'jsonschema>=4.21,<5' 'pillow>=10,<12'
      - name: Prove 13 exact original image SHAs and all historic radio/favorite IDs
        run: python radio-catalog-lab/tools/test_go_radio_v8_13_official_sha_gate.py
      - name: Refuse any signed TEST v7 pointer mutation or private signing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('grossesondes/radio-test-v2')
          ptr=json.loads((root/'current.json').read_text())
          assert ptr['release_sequence']==7
          assert ptr['content_sha256']=='f735884aa0841a86d88aaafe406e62b7a826cf9cd60f6a70285a0894326841aa'
          assert not (root/'current-v8.json').exists()
          print('GO_V8_UNSIGNED_CANDIDATE_ONLY_TEST_V7_STILL_ACTIVE')
          PY
