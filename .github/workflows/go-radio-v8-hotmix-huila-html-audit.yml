name: GO v8 — Hotmix Metal and HuilaGeek HTML radio channel attribution (read only)
on:
  push:
    branches: [feature/go-radio-v8-metalon-3-logos-20261123]
    paths:
      - 'radio-catalog-lab/tools/audit_v8_hotmix_huilageek_html_links.py'
      - '.github/workflows/go-radio-v8-hotmix-huila-html-audit.yml'
permissions:
  contents: read
jobs:
  official-radio-html-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install standard image backend for common URL validation
        run: python -m pip install 'Pillow==11.3.0'
      - name: Validate exact catalogue station IDs offline
        run: python radio-catalog-lab/tools/audit_v8_hotmix_huilageek_html_links.py --output "$RUNNER_TEMP/offline.json"
      - name: Bounded firstparty HTML channel image attribution audit
        run: python radio-catalog-lab/tools/audit_v8_hotmix_huilageek_html_links.py --network --output "$RUNNER_TEMP/online.json"
      - name: Ensure no signing, no production updates
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          o=json.loads((Path(os.environ['RUNNER_TEMP'])/'online.json').read_text())
          assert o['scope']=='GO_V8_HOTMIX_HUILAGEEK_HTML_OWNER_CHANNEL_RECON_READ_ONLY'
          assert len(o['rows'])==4
          assert o['signed'] is False and o['published'] is False
          print("HOTMIX_HUILAGEEK_HTML_DISCOVERY_READ_ONLY_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: go-v8-hotmix-huilageek-owner-html-evidence
          path: ${{ runner.temp }}/online.json
          retention-days: 14
