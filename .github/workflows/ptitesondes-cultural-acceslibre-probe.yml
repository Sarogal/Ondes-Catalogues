name: P'tites Ondes — comparaison culturelle Acceslibre
on:
  pull_request:
    paths:
      - 'scripts/ptitesondes_cultural_acceslibre_probe.py'
      - 'tests/test_ptitesondes_cultural_acceslibre_probe.py'
      - '.github/workflows/ptitesondes-cultural-acceslibre-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline concordance tests
        env:
          PYTHONPATH: scripts
        run: python -m unittest discover -s tests -p 'test_ptitesondes_cultural_acceslibre_probe.py' -v
      - name: Live aggregate comparison
        run: python scripts/ptitesondes_cultural_acceslibre_probe.py
