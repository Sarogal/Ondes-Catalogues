name: GO v8 — visually review BeGood Bloodstream official brand images (read only)
on:
  push:
    branches: [feature/go-radio-v8-metalon-3-logos-20261123]
    paths: [.github/workflows/go-radio-v8-begood-bloodstream-visual.yml]
permissions:
  contents: read
jobs:
  logo-preview-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned image decoders
        run: python -m pip install 'Pillow==11.3.0' 'CairoSVG==2.8.2' 'defusedxml==0.7.1'
      - name: Generate small owner-image previews without mutating catalog
        run: |
          python - <<'PY'
          import sys,hashlib,io,base64
          from PIL import Image
          sys.path.insert(0,"radio-catalog-lab/tools")
          from audit_v8_begood_bloodstream_owner_images import SOURCES,safe_svg_to_png
          from audit_open_radio_artwork_inventory import _request,MAX_IMAGE
          checks={
            "go-station-000142":("BEGOOD","a54cd85a72a4d9d707eb95e9df120aa71f6aaa370073286f3e0f39e8183722a2"),
            "go-station-000092":("BLOODSTREAM","c9f28689815b32b6ff9e9f7b867a49309d6e3a566d81aa09e001e94abd9857fe"),
          }
          for sid,(label,sha) in checks.items():
            name,home,stream,page,url,host,fmt,kind=SOURCES[sid]
            raw,mime,final=_request(url,max_bytes=MAX_IMAGE,accept=fmt)
            png=safe_svg_to_png(raw) if fmt=="image/svg+xml" else raw
            assert hashlib.sha256(png).hexdigest()==sha
            img=Image.open(io.BytesIO(png)).convert("RGBA")
            canvas=Image.new("RGB",img.size,(43,43,43))
            canvas.paste(img,mask=img.getchannel("A"))
            canvas.thumbnail((420,240))
            f=io.BytesIO();canvas.save(f,format="JPEG",quality=70)
            assert len(f.getvalue())<145000
            print("GO_OWNER_PREVIEW_"+label+"="+base64.b64encode(f.getvalue()).decode())
          print("BEGOOD_BLOODSTREAM_READ_ONLY_VISUAL_DONE")
          PY
