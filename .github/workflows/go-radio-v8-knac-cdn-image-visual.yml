name: GO v8 — review official KNAC logo CDN image visually READ ONLY
on:
  push:
    branches: [feature/go-radio-v8-metalon-3-logos-20261123]
    paths: [.github/workflows/go-radio-v8-knac-cdn-image-visual.yml]
permissions:
  contents: read
jobs:
  firstparty-linked-knac-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install decoded image verifier
        run: python -m pip install 'Pillow==11.3.0'
      - name: Print low-res non-published image preview
        run: |
          python - <<'PY'
          import base64,io,sys,hashlib
          from PIL import Image
          sys.path.insert(0,"radio-catalog-lab/tools")
          from audit_open_radio_artwork_inventory import _request,MAX_IMAGE
          url="https://mmo.aiircdn.com/2595/6a020bcf87eab.jpg"
          blob,mime,final=_request(url,max_bytes=MAX_IMAGE,accept="image/jpeg")
          assert hashlib.sha256(blob).hexdigest()=="2e1813c4fa908c345986839118d82562e3b272278e97e76f20cf949a29e94611"
          image=Image.open(io.BytesIO(blob)).convert("RGB")
          image.thumbnail((360,360))
          out=io.BytesIO();image.save(out,format="JPEG",quality=70)
          assert len(out.getvalue())<140000
          print("GO_KNAC_ICON_VISUAL="+base64.b64encode(out.getvalue()).decode())
          print("KNAC_ORIGINAL_SHA_AND_VISUAL_PREVIEW_READ_ONLY")
          PY
