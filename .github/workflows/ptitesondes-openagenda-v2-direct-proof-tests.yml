permissions:
  contents: read

jobs:
  offline-adversarial:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify direct API evidence without tokens or internet
        run: |
          python -m unittest discover -s tests \
            -p 'test_ptitesondes_openagenda_v2_direct_evidence.py' -v
          python -m unittest discover -s tests \
            -p 'test_ptitesondes_openagenda_v2_preintegration.py' -v
          python -m unittest discover -s tests \
            -p 'test_ptitesondes_openagenda_v2_dryrun_e2e.py' -v
          python -m unittest discover -s tests \
            -p 'test_ptitesondes_openagenda_v2_live_smoke.py' -v
          python -m unittest discover -s tests \
            -p 'test_ptitesondes_openagenda_v2_organizer_bridge.py' -v
          python -m unittest discover -s tests \
            -p 'test_ptitesondes_openagenda_v2_agenda_census.py' -v
          python -m unittest discover -s tests \
            -p 'test_ptitesondes_openagenda_v2_backlog_reconciliation.py' -v
          python -m unittest discover -s tests \
            -p 'test_ptitesondes_ods_direct_mirror_absence_audit.py' -v
          python -m unittest discover -s tests \
            -p 'test_ptitesondes_ods_direct_mirror_cycle.py' -v
          python -m unittest discover -s tests \
            -p 'test_ptitesondes_ods_direct_mirror_workflow_contract.py' -v
          python -m unittest discover -s tests \
            -p 'test_ptitesondes_generic_venue_osm_preflight.py' -v
          python -m unittest discover -s tests \
            -p 'test_ptitesondes_generic_venue_ign_corroboration.py' -v
          python -m unittest discover -s tests \
            -p 'test_ptitesondes_generic_venue_official_proof.py' -v
          python -m unittest discover -s tests \
            -p 'test_ptitesondes_dila_municipal_domains.py' -v
          python -m unittest discover -s tests \
            -p 'test_ptitesondes_municipal_official_page_reader.py' -v
          python -m unittest discover -s tests \
            -p 'test_ptitesondes_municipal_domain_coverage.py' -v
      - name: Ensure this change cannot publish, access secrets or add a cron
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          wf = Path(".github/workflows/ptitesondes-openagenda-v2-direct-proof-tests.yml").read_text()
          assert "contents: read" in wf
          assert not any(x.strip().startswith("schedule:") for x in wf.splitlines())
          assert not any(x in wf for x in ("se" + "crets.", "git" + " push", "deploy" + "-pages", "contents:" + " write"))
          source = Path("scripts/ptitesondes_openagenda_v2_direct_evidence.py").read_text()
          assert "publisher_connected" in source and "public_writes" in source
          assert "oa_pk_" in source and "oa_sk_" not in source
          preflight = Path("scripts/ptitesondes_openagenda_v2_preintegration.py").read_text()
          assert "publisher_connected" in preflight and "public_writes" in preflight
          assert not any(x in preflight for x in ("requests.post(", "git" + " push", "PRIVATE_INTAKE" + "_READ_TOKEN"))
          smoke = Path("scripts/ptitesondes_openagenda_v2_live_smoke.py").read_text()
          assert "public_writes" in smoke and "approval_granted" in smoke
          assert not any(x in smoke for x in ("requests.post(", "git" + " push", "PRIVATE_INTAKE" + "_READ_TOKEN"))
          organizer = Path("scripts/ptitesondes_openagenda_v2_organizer_bridge.py").read_text()
          assert "public_writes" in organizer and "approval_granted" in organizer
          assert not any(x in organizer for x in ("requests.post(", "git" + " push", "PRIVATE_INTAKE" + "_READ_TOKEN"))
          census = Path("scripts/ptitesondes_openagenda_v2_agenda_census.py").read_text()
          assert "public_writes" in census and "approval_granted" in census
          assert not any(x in census for x in ("requests.post(", "git" + " push", "PRIVATE_INTAKE" + "_READ_TOKEN"))
          funnel = Path("scripts/ptitesondes_openagenda_v2_backlog_reconciliation.py").read_text()
          assert "public_writes" in funnel and "approval_granted" in funnel
          assert not any(x in funnel for x in ("requests.post(", "git" + " push", "PRIVATE_INTAKE" + "_READ_TOKEN"))
          print("PASS: offline-only checks, no publisher, no private actions")
          PY
