name: GO radio TEST v7 — verify 5 original YouRadio station images (SHA evidence)
on:
  push:
    branches:
      - feature/go-radio-v7-13-dedupe-20261123
    paths:
      - 'radio-catalog-lab/tools/audit_v7_exclusively_broadcaster_images.py'
      - '.github/workflows/go-radio-v7-exclusively-broadcaster-logos.yml'
permissions:
  contents: read
jobs:
  only-first-party-station-images:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded image decoder
        run: python -m pip install 'pillow>=10,<12'
      - name: Verify original five browser-observed YouRadio links without network
        run: |
          python radio-catalog-lab/tools/audit_v7_exclusively_broadcaster_images.py \
            --output "$RUNNER_TEMP/exclusive-four-offline.json"
      - name: Fetch original broadcaster images and verify independent SHA-256 bytes
        run: |
          python radio-catalog-lab/tools/audit_v7_exclusively_broadcaster_images.py \
            --network --output "$RUNNER_TEMP/exclusive-four-network.json"
      - name: Print independent station image evidence
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'exclusive-four-network.json').read_text())
          assert d['scope']=='TEST_V7_EXCLUSIVELY_4_BROADCASTER_ORIGINAL_TILES'
          assert d['requested_stations']==5
          assert d['publication_allowed'] is False
          print('EXCLUSIVELY_BROADCASTER_ORIGINAL_SHA',d['verified_distinct_official_image_sha'],'/5')
          for r in d['records']:
              print('OFFICIAL_EXCLUSIVE_IMAGE',r['go_station_id'],r['status'],
                    r.get('sha256',''),r.get('mime_type',''),r.get('error',''))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: go-v7-exclusively-four-original-station-logo-sha
          path: |
            ${{ runner.temp }}/exclusive-four-network.json
            ${{ runner.temp }}/exclusive-four-offline.json
          retention-days: 14
