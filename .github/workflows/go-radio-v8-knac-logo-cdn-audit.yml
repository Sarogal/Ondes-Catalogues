name: GO v8 — KNAC.COM original icon hosted by its CDN read-only
on:
  push:
    branches: [feature/go-radio-v8-metalon-3-logos-20261123]
    paths:
      - 'radio-catalog-lab/tools/audit_v8_knac_owner_cdn_brand.py'
      - '.github/workflows/go-radio-v8-knac-logo-cdn-audit.yml'
permissions:
  contents: read
jobs:
  check-knac-official-page-and-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image verifier
        run: python -m pip install 'Pillow==11.3.0'
      - name: Verify KNAC channel and existing stream metadata
        run: python radio-catalog-lab/tools/audit_v8_knac_owner_cdn_brand.py --output "$RUNNER_TEMP/offline.json"
      - name: Verify original CDN JPEG SHA from KNAC owner page
        run: python radio-catalog-lab/tools/audit_v8_knac_owner_cdn_brand.py --network --output "$RUNNER_TEMP/online.json"
      - name: Audit cannot alter TEST or production
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ['RUNNER_TEMP'])/'online.json').read_text())
          assert x['scope']=='GO_V8_KNAC_OFFICIAL_CDN_ICON_READ_ONLY'
          assert x['count']==1 and len(x['records'])==1 and not x['signed'] and not x['published']
          print("KNAC_CDN_IMAGE_SOURCE_READ_ONLY")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: go-v8-knac-official-cdn-original-sha-evidence
          path: ${{ runner.temp }}/online.json
          retention-days: 14
