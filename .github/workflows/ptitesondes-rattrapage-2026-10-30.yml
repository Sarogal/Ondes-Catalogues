name: P'tites Ondes — rattrapage unique contrôlé du 30 octobre

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ptitesondes-rattrapage-2026-10-30.yml'

permissions:
  contents: write

concurrency:
  group: ptitesondes-cloud-publication
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Exécuter tous les tests de conservation et de preuve
        run: python -m unittest discover -s tests -v
      - name: Relire le patch privé et fusionner avec preuve indépendante
        env:
          PRIVATE_INTAKE_READ_TOKEN: ${{ secrets.PRIVATE_INTAKE_READ_TOKEN }}
        run: python scripts/run_cloud_sync.py
      - name: Garantir exactement les cinq nouveautés indépendamment validées
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("/tmp/ptitesondes-sync-report.json").read_text())
          catalogue=json.loads(Path("docs/ptitesondes/sorties.json").read_text())
          expected={
            "bordeaux-sons-dessus-dessous-2027-01-16",
            "paris-sur-les-pas-de-simeon-2027-02-28",
            "paris-au-fil-de-leau-2027-04-04",
            "nantes-lextraordinaire-betise-de-mathis-2027-04-17",
            "nantes-fourmi-de-pain-2027-04-25",
          }
          ids={e["id"] for e in catalogue["events"]}
          assert report["initial"]==494,report
          assert report["final"]==499,report
          assert report["ajoutes"]==5,report
          assert report["suppression"]==report["correction"]==0,report
          assert len(ids)==499 and expected<=ids
          assert len(catalogue["events"])==499
          print("Rattrapage unique autorisé : 494 -> 499, cinq IDs vérifiés, zéro suppression.")
          PY
      - name: Publier seulement le catalogue des sorties
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/ptitesondes/sorties.json
          git diff --cached --quiet && exit 1
          git commit -m "data(ptitesondes): rattrapage vérifié de cinq sorties du 30 octobre"
          git push origin HEAD:main
      - name: Configurer Pages
        uses: actions/configure-pages@v6
      - name: Archiver la totalité des catalogues GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/
  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.published.outputs.page_url }}
    steps:
      - name: Déployer Pages
        id: published
        uses: actions/deploy-pages@v5
