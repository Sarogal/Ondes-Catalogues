name: "P'tites Ondes — sonde municipale réelle, lecture seule"

on:
  pull_request:
    paths:
      - '.github/workflows/ptitesondes-municipal-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gosier-readonly-check:
    # Only the explicitly isolated draft branch can run this network probe
    # during PR review; never a scheduled or production publisher job.
    if: >-
      github.repository == 'Sarogal/Ondes-Catalogues' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == true &&
      github.head_ref == 'feat/ptitesondes-municipal-readonly-preflight-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: "Diagnostiquer la confiance TLS sans jamais la désactiver"
        shell: bash
        run: |
          set -eu
          python - <<'PY'
          import ssl
          p=ssl.get_default_verify_paths()
          print('TLS_DIAGNOSTIC',ssl.OPENSSL_VERSION,
                'cafile_present=', bool(p.cafile),
                'capath_present=', bool(p.capath))
          PY
          if curl --head --fail --silent --show-error \\
             --max-time 12 --proto '=https' \\
             --output /dev/null \\
             'https://www.villedugosier.fr/evenement/les-mercredis-timoun-3067'; then
            echo 'TLS_DIAGNOSTIC_CURL verified'
          else
            echo 'TLS_DIAGNOSTIC_CURL refused_or_unavailable'
          fi
      - name: "Neuf occurrences publiques du Gosier : calendrier + fiche officielle"
        env:
          PTITESONDES_MUNICIPAL_LIVE_CHECK: '1'
        run: |
          python -m unittest discover -s tests \
            -p 'test_ptitesondes_municipal_live_sources.py' -v
      - name: "Confirmer aucune écriture / aucun droit de publication"
        run: |
          echo "Test réseau lecture seule, sans secret, sans jeton, sans approbation ni patch."
