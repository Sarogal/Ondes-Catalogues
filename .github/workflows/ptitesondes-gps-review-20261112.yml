name: P'tites Ondes — validation GPS exacte Tourcoing Nantes
on:
  push:
    branches: [ci/ptitesondes-verified-gps-20261112]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ptitesondes-verified-gps-tourcoing-nantes-20261112
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests GPS, prequalification et preuves sans reseau
        run: |
          python -m unittest discover -s tests -p 'test_ptitesondes_candidate_promotion.py' -v
          python -m unittest discover -s tests -p 'test_daily_outings_proof.py' -v
          python -m unittest discover -s tests -p 'test_cloud_policy.py' -v
