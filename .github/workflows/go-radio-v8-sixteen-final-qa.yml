name: GO radio TEST v8 — 16 original publisher logo SHAs full preflight
# Re-run after the staged SHA objects arrived in the isolated development branch.
on:
  push:
    branches:
      - feature/go-radio-v8-metalon-3-logos-20261123
    paths:
      - 'radio-catalog-lab/full-staging/UNSIGNED-radio-v8-metalon-3-independent-3-firstparty-7-maximum-3-20261123.json'
      - 'grossesondes/radio-test-v2/artwork/staging-maximum-v8/**'
      - 'radio-catalog-lab/tools/test_go_radio_v8_16_firstparty_sha_gate.py'
      - '.github/workflows/go-radio-v8-sixteen-final-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-all-sixteen-logos-against-real-signed-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original SHA image, schema and Ed25519 verifiers
        run: python -m pip install 'pillow>=10,<12' 'jsonschema>=4.21,<5' 'cryptography>=42,<47'
      - name: Prove v8 16 original logos, historic identities and signed-v7 continuity
        run: python radio-catalog-lab/tools/test_go_radio_v8_16_firstparty_sha_gate.py
      - name: Do not sign, publish or mutate active TEST v7
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('grossesondes/radio-test-v2')
          assert json.loads((root/'current.json').read_text())['release_sequence']==7
          assert not (root/'current-v8.json').exists()
          print('GO_V8_16_UNSIGNED_ONLY_PRODUCTION_AND_TEST_UNCHANGED')
          PY
