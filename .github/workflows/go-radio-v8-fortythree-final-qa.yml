name: GO TEST v8 — 43 firstparty original SHA radio logos Ed25519 QA
on:
  push:
    branches:
      - feature/go-radio-v8-metalon-3-logos-20261123
    paths:
      - 'radio-catalog-lab/tools/test_go_radio_v8_43_official_sha_gate.py'
      - 'radio-catalog-lab/full-staging/UNSIGNED-radio-v8-43-official-sha-logos-20261123.json'
      - 'grossesondes/radio-test-v2/artwork/staging-eight-more-v8/**'
      - '.github/workflows/go-radio-v8-fortythree-final-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-source-and-catalogue-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ed25519 signature, bounded image and schema verifiers
        run: python -m pip install 'pillow>=10,<12' 'cryptography>=42,<47' 'jsonschema>=4.21,<5'
      - name: Verify all 43 distinct SHA logos and original TEST v7 signed continuity
        run: python radio-catalog-lab/tools/test_go_radio_v8_43_official_sha_gate.py
      - name: Guard against signed pointer and production changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('grossesondes/radio-test-v2')
          x=json.loads((p/'current.json').read_text())
          assert x['release_sequence']==7
          assert x['content_sha256']=='f735884aa0841a86d88aaafe406e62b7a826cf9cd60f6a70285a0894326841aa'
          assert not (p/'current-v8.json').exists()
          print('GO_V8_43_LOGOS_TEST_V7_AND_PRODUCTION_UNMODIFIED')
          PY
