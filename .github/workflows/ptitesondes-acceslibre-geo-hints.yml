name: "P'tites Ondes — découverte Acceslibre sans publication"
on:
  pull_request:
    paths:
      - scripts/ptitesondes_acceslibre_geo_hints.py
      - tests/test_ptitesondes_acceslibre_geo_hints.py
      - .github/workflows/ptitesondes-acceslibre-geo-hints.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/ptitesondes-acceslibre-geo-hints.yml
  schedule:
    - cron: '22 04 * * 1,4'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ptitesondes-public-private-intake
  queue: max
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify streaming schema and ambiguous venue refusal
        env:
          PYTHONPATH: scripts:tests
        run: python -m unittest -v test_ptitesondes_acceslibre_geo_hints
  live:
    needs: offline
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'Sarogal/Ondes-Catalogues'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Sarogal/PtitesOndes
          ref: automation/ptitesondes-intake
          path: state
          sparse-checkout: |
            automation-intake/ptitesondes
          token: ${{ secrets.PRIVATE_INTAKE_READ_TOKEN }}
          persist-credentials: false
      - name: Download one national export and measure coverage
        run: |
          python scripts/ptitesondes_acceslibre_geo_hints.py --catalogue docs/ptitesondes/sorties.json --day "$(TZ=Europe/Paris date +%F)" --private-output state/automation-intake/ptitesondes/acceslibre-geo-hints.json --live | tee "$RUNNER_TEMP/acceslibre-summary.json"
          python - "$RUNNER_TEMP/acceslibre-summary.json" <<'PY'
          import json, sys, os
          with open(sys.argv[1]) as f:
              report = json.load(f)
          assert report["publication_ready"] is False and report["public_writes"] == 0
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              for k in ("groups", "rows_scanned", "unique_hints", "ambiguous_groups", "unmatched_groups", "covered_missing_events"):
                  assert type(report[k]) is int and report[k] >= 0
                  f.write(f"- {k}: {report[k]}\n")
          PY
          git diff --exit-code -- docs/ptitesondes/sorties.json

      - name: Persist private advisory hints only
        env:
          PRIVATE_WRITE_TOKEN: ${{ secrets.PTITESONDES_INTAKE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          P="automation-intake/ptitesondes/acceslibre-geo-hints.json"
          git -C state add -- "$P"
          if git -C state diff --cached --quiet; then exit 0; fi
          test "$(git -C state diff --cached --name-only)" = "$P"
          git -C state config user.name 'github-actions[bot]'
          git -C state config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C state commit -m 'data(ptitesondes): refresh private Acceslibre discovery hints' > "$RUNNER_TEMP/acceslibre-commit.log" 2>&1
          AUTH="$(printf 'x-access-token:%s' "$PRIVATE_WRITE_TOKEN" | base64 -w0)"
          if ! git -C state -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:automation/ptitesondes-intake > "$RUNNER_TEMP/acceslibre-push.log" 2>&1; then
            echo "::error::Private hint checkpoint not saved."
            exit 1
          fi
