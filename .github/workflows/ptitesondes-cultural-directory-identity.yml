name: P'tites Ondes — identité culturelle indépendante

on:
  pull_request:
    paths:
      - 'scripts/ptitesondes_cultural_directory_identity.py'
      - 'tests/test_ptitesondes_cultural_directory_identity.py'
      - '.github/workflows/ptitesondes-cultural-directory-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test independent identity and exact address contract
        env:
          PYTHONPATH: scripts
        run: python -m unittest discover -s tests -p 'test_ptitesondes_cultural_directory_identity.py' -v
