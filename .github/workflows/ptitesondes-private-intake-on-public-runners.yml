          if [[ "$RUN_MODE" == 'write' ]]; then MODE='stage'; fi
          BATCH="$(python -c 'from datetime import datetime, timezone; n=datetime.now(timezone.utc); print(n.toordinal()*4+n.hour//6)')"
          if ! python public/scripts/ptitesondes_schemaorg_private_intake.py \
              --state-checkout state --mode "$MODE" --source-batch "$BATCH" \
              > "$LOG/schemaorg-private-hints-summary.json" 2>&1; then
            echo "::warning::Collecte Schema.org privée indisponible ; aucune piste publiée."
            exit 0
          fi
          if [[ "$RUN_MODE" == 'write' ]]; then
            git -C state add -- automation-intake/ptitesondes/html-schemaorg-hints.json
            if ! git -C state diff --cached --quiet; then
              git -C state config user.name 'github-actions[bot]'
              git -C state config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git -C state commit -m 'data(ptitesondes): conserver uniquement les indices Schema.org prives' \
                > "$LOG/schemaorg-private-commit.log" 2>&1
              AUTH="$(printf 'x-access-token:%s' "$PRIVATE_WRITE_TOKEN" | base64 -w0)"
              if ! git -C state -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
                  push origin HEAD:automation/ptitesondes-intake \
                  > "$LOG/schemaorg-private-push.log" 2>&1; then
                echo "::error::Stockage des pistes Schema.org refusé ; aucun catalogue affecté."
                exit 1
              fi
            fi
          fi
          echo "Pistes Schema.org structurées conservées exclusivement dans la branche privée ; sans preuve de séance ni publication." >> "$GITHUB_STEP_SUMMARY"

      - name: Revérifier les pistes Schema.org visibles avant une revue privée (opt-in)
        if: ${{ env.CYCLE != 'places' && vars.PTITESONDES_SCHEMAORG_HINTS == 'enabled' && vars.PTITESONDES_SCHEMAORG_RECHECK == 'enabled' }}
