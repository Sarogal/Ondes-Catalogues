name: P'tites Ondes — moteurs privés sur runners publics (bascule pilote)

# Basculer seulement après validation des secrets et d'une écriture privée sur runner public.
on:
  schedule:
    # Quatre collectes Sorties et une rotation Lieux, horaires UTC.
    # Minute 17/37 pour eviter les pointes de charge et re-enregistrer le cron GitHub.
    - cron: '17 07 * * *'
    - cron: '17 10 * * *'
    - cron: '17 14 * * *'
    - cron: '17 18 * * *'
    - cron: '37 21 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ptitesondes-private-intake-on-public-runners.yml'
  pull_request:
    paths:
      - '.github/workflows/ptitesondes-private-intake-on-public-runners.yml'
  workflow_dispatch:
    inputs:
      cycle:
        description: Collecte, lieux ou cycle complet
        type: choice
        required: true
        default: all
        options: [outings, places, all]
      mode:
        description: Preview sans ecriture ou sauvegarde uniquement dans le prive
        type: choice
        required: true
        default: preview
        options: [preview, write]
      recovery:
        description: Rattrapage de lots echus (secours externe authentifie uniquement)
        type: choice
        required: true
        default: none
        options: [none, catchup]

permissions:
  contents: read

# Une seule ecriture privée simultanée, y compris lors de relances manuelles.
concurrency:
  group: ptitesondes-public-private-intake
  queue: max
  cancel-in-progress: false

jobs:
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Vérifier que le pont ne publie rien et refuse les PR
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ptitesondes-private-intake-on-public-runners.yml')
          s = p.read_text(encoding='utf-8')
          assert "github.ref == 'refs/heads/main'" in s
          assert "github.event_name == 'workflow_dispatch'" in s
          assert "Sarogal/PtitesOndes" in s
          assert "automation/ptitesondes-intake" in s
          assert "persist-credentials: false" in s
          assert "PRIVATE_INTAKE_READ_TOKEN" in s and "PTITESONDES_INTAKE_WRITE_TOKEN" in s
          assert "OPENAGENDA_READ_KEY" in s
          assert "on:" in s and chr(10) + "  schedule:" + chr(10) in s
          schedules = [line.strip() for line in s.splitlines() if line.strip().startswith("- cron:")]
          assert schedules == [
            "- cron: '17 07 * * *'", "- cron: '17 10 * * *'",
            "- cron: '17 14 * * *'", "- cron: '17 18 * * *'",
            "- cron: '37 21 * * *'",
          ]
          assert "github.event.schedule == '37 21 * * *'" in s
          assert "vars.PTITESONDES_PUBLIC_INTAKE != 'paused'" in s
          assert ("deploy" + "-pages") not in s and "docs/ptitesondes/sorties.json" in s
          assert ("git push origin HEAD" + ":main") not in s
          assert "ptitesondes_schedule_catchup.py" in s
          assert "queue: max" in s
          assert 'mapfile -t REVIEW_SLOTS' in s
          assert "vars.PTITESONDES_HTML_QUEUE == 'enabled'" in s
          assert "ptitesondes_html_private_queue_cycle.py" in s
          assert "automation-intake/ptitesondes/html-review-candidates.json" in s
          print('Contrat public / données privées : OK. Activation des cycles via variable.')
          PY
          python -m unittest discover -s tests -p 'test_ptitesondes_schedule_catchup.py' -v
          python -m unittest discover -s tests -p 'test_ptitesondes_ultramarine_bridge_contract.py' -v
          node --test tests/test_ptitesondes_external_rescue_worker.mjs

  run-private:
    if: github.repository == 'Sarogal/Ondes-Catalogues' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'schedule' && vars.PTITESONDES_PUBLIC_INTAKE != 'paused'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RUN_MODE: ${{ github.event_name == 'schedule' && 'write' || inputs.mode || 'preview' }}
      CYCLE: ${{ github.event_name == 'schedule' && github.event.schedule == '37 21 * * *' && 'places' || github.event_name == 'schedule' && 'outings' || inputs.cycle || 'all' }}
      REVIEW_CRON: ${{ github.event.schedule }}
      RUN_EVENT: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery == 'catchup' && 'external_rescue' || github.event_name }}
      RECOVERY: ${{ inputs.recovery || 'none' }}
      PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_INTAKE_READ_TOKEN }}
      PRIVATE_WRITE_TOKEN: ${{ secrets.PTITESONDES_INTAKE_WRITE_TOKEN }}
      OPENAGENDA_READ_KEY: ${{ secrets.OPENAGENDA_READ_KEY }}
    steps:
      - name: Valider les accès requis sans les afficher
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PRIVATE_READ_TOKEN" ]]; then
            echo "::error::Token de lecture privée P'tites Ondes absent : cycle suspendu."
            exit 1
          fi
          if [[ "$RUN_MODE" == "write" && -z "$PRIVATE_WRITE_TOKEN" ]]; then
            echo "::error::Token d'écriture privée P'tites Ondes absent : aucune persistance."
            exit 1
          fi
          if [[ "$CYCLE" != "places" && -z "$OPENAGENDA_READ_KEY" ]]; then
            if [[ "$RUN_MODE" == "write" ]]; then
              echo "::error::Clé OpenAgenda absente : aucune collecte complète sauvegardée."
              exit 1
            fi
            echo "::warning::Prévisualisation partielle sans OpenAgenda : couverture nationale non validée, aucune écriture."
          fi
          [[ "$CYCLE" == "outings" || "$CYCLE" == "places" || "$CYCLE" == "all" ]]
          [[ "$RUN_MODE" == "preview" || "$RUN_MODE" == "write" ]]
          if [[ "$RECOVERY" == 'catchup' ]]; then
            if [[ "$RUN_EVENT" != 'external_rescue' || "$RUN_MODE" != 'write' || "$CYCLE" != 'outings' ]]; then
              echo "::error::Le rattrapage externe exige sorties + ecriture privee."
              exit 1
            fi
          fi

      - name: Charger le code source privé approuvé (jamais de branche PR)
        uses: actions/checkout@v4
        with:
          repository: Sarogal/PtitesOndes
          ref: main
          token: ${{ secrets.PRIVATE_INTAKE_READ_TOKEN }}
          path: src
          sparse-checkout: |
            automation
          persist-credentials: false

      - name: Charger la branche de stockage exclusivement privée
        uses: actions/checkout@v4
        with:
          repository: Sarogal/PtitesOndes
          ref: automation/ptitesondes-intake
          token: ${{ secrets.PRIVATE_INTAKE_READ_TOKEN }}
          path: state
          fetch-depth: 0
          sparse-checkout: |
            automation-intake/ptitesondes
          persist-credentials: false

      - name: Charger la référence publique indépendante, en lecture seule
        uses: actions/checkout@v4
        with:
          ref: main
          path: public
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vérifier présence des fichiers privés sans affichage de leur contenu
        shell: bash
        run: |
          set -euo pipefail
          test -s src/automation/outings_intake.py
          test -s src/automation/place_discovery.py
          test -s src/automation/merge_verified.py
          test -s src/automation/test_oa_v2_backlog_binding.py
          test -s src/automation/sources.json
          test -s src/automation/place_official_sources.json
          test -s state/automation-intake/ptitesondes/backlog.json
          test -s state/automation-intake/ptitesondes/lieux-backlog.json
          test -s public/docs/ptitesondes/sorties.json
          test -s public/docs/ptitesondes/lieux.json
          test -s public/scripts/ptitesondes_place_agenda_watch.py
          test -s public/scripts/ptitesondes_place_agenda_sources.json
          test -s public/scripts/ptitesondes_place_agenda_preflight.py
          mkdir -p "$RUNNER_TEMP/ptitesondes-private-logs" "$RUNNER_TEMP/ptitesondes-outings" "$RUNNER_TEMP/ptitesondes-verified" "$RUNNER_TEMP/ptitesondes-lieux"

      - name: Tester la logique privée sélectionnée hors réseau
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CYCLE" != "places" ]]; then
            if ! python -m unittest discover -s public/tests -p 'test_ptitesondes_schedule_catchup.py' -v > "$RUNNER_TEMP/ptitesondes-private-logs/tests-catchup.log" 2>&1; then
              echo "::error::Tests de rattrapage des créneaux échoués ; aucune collecte."
              exit 1
            fi
            if ! python -m unittest discover -s src/automation -p 'test_outings_intake.py' -v > "$RUNNER_TEMP/ptitesondes-private-logs/tests-outings.log" 2>&1; then
              echo "::error::Tests privés sorties échoués ; journaux non publiés."
              exit 1
            fi
            if ! python -m unittest discover -s src/automation -p 'test_merge_verified.py' -v > "$RUNNER_TEMP/ptitesondes-private-logs/tests-merge.log" 2>&1; then
              echo "::error::Tests privés de fusion échoués ; journaux non publiés."
              exit 1
            fi
            if ! python -m unittest discover -s src/automation -p 'test_oa_v2_backlog_binding.py' -v > "$RUNNER_TEMP/ptitesondes-private-logs/tests-oa-v2.log" 2>&1; then
              echo "::error::Tests privés de liaison OpenAgenda v2 échoués ; journaux non publiés."
              exit 1
            fi
          fi
          if [[ "$CYCLE" != "outings" ]]; then
            for f in test_place_discovery.py test_place_osm_discovery.py test_place_ministry_discovery.py test_place_ministry_current_audit.py test_place_qualification.py test_place_official_proof.py test_place_release_gate.py; do
              if ! python -m unittest discover -s src/automation -p "$f" -v > "$RUNNER_TEMP/ptitesondes-private-logs/$f.log" 2>&1; then
                echo "::error::Tests privés lieux échoués ($f) ; journaux non publiés."
                exit 1
              fi
            done
            if ! python -m unittest discover -s public/tests -p 'test_ptitesondes_place_agenda_watch.py' -v > "$RUNNER_TEMP/ptitesondes-private-logs/tests-venue-agendas.log" 2>&1; then
              echo "::error::Tests de surveillance des programmes de lieux échoués ; aucune collecte."
              exit 1
            fi
            if ! python -m unittest discover -s public/tests -p 'test_ptitesondes_place_agenda_preflight.py' -v > "$RUNNER_TEMP/ptitesondes-private-logs/tests-venue-preflight.log" 2>&1; then
              echo "::error::Tests de recontrole des seances des lieux echoues ; aucune collecte."
              exit 1
            fi
          fi

      - name: Collecter les sorties et effectuer une vérification indépendante
        if: ${{ env.CYCLE != 'places' }}
        shell: bash
        run: |
          set -euo pipefail
          DAY="$(TZ=Europe/Paris date +%F)"
          STATE="state/automation-intake/ptitesondes"
          LOG="$RUNNER_TEMP/ptitesondes-private-logs"
          OUT="$RUNNER_TEMP/ptitesondes-outings"
          VERIFIED="$RUNNER_TEMP/ptitesondes-verified"
          push_private() {
            if [[ "$RUN_MODE" != "write" ]]; then return 0; fi
            git -C state config user.name 'github-actions[bot]'
            git -C state config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            if git -C state diff --cached --quiet; then return 0; fi
            git -C state commit -m "$1" > "$LOG/git-commit.log" 2>&1
            local auth
            auth="$(printf 'x-access-token:%s' "$PRIVATE_WRITE_TOKEN" | base64 -w0)"
            if ! git -C state -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:automation/ptitesondes-intake > "$LOG/git-push.log" 2>&1; then
              echo "::error::Sauvegarde privée indisponible : aucune publication effectuée."
              exit 1
            fi
          }
          if ! python src/automation/outings_intake.py --config src/automation/sources.json --patch-dir "$STATE" --output-dir "$OUT" > "$LOG/collecte-sorties.log" 2>&1; then
            echo "::error::Collecte sorties échouée ; journal confidentiel non exposé."
            exit 1
          fi
          test -s "$OUT/backlog.json"
          test -s "$OUT/patch-$DAY.json"
          cp "$OUT/backlog.json" "$STATE/backlog.json"
          cp "$OUT/patch-$DAY.json" "$STATE/patch-$DAY.json"
          mkdir -p "$STATE/reports"
          cp "$OUT/daily-report.json" "$STATE/reports/$DAY.json"
          if [[ "$RUN_MODE" == "write" ]]; then
            git -C state add -- "automation-intake/ptitesondes/backlog.json" "automation-intake/ptitesondes/patch-$DAY.json" "automation-intake/ptitesondes/reports/$DAY.json"
            push_private 'data(ptitesondes): collecter sur runner public, pistes privées'
          fi
          # Optional ultra-marine probes. Both remain STRICTLY discovery-only.
          # The approved private main branch, never a PR branch, supplies code.
          # Reports are stored on the private state branch only, never in Pages
          # or the public GitHub Actions logs. No new schedule or permissions.
          # Cache each successful daily probe in the private state branch:
          # avoid 14 redundant municipal requests at every collection slot.
          GOSIER_DAY="$(TZ=America/Guadeloupe date +%F)"
          if [[ -s src/automation/municipal_gosier_discovery.py ]] && \
             [[ "$RUN_MODE" != "write" || ! -s "$STATE/reports/municipal-gosier-$GOSIER_DAY.json" ]]; then
            if python src/automation/municipal_gosier_discovery.py \
                --days 14 --output "$OUT/gosier-discovery.json" \
                > "$LOG/gosier-discovery.log" 2>&1 && \
               python -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["schema"]=="ptitesondes.municipal_gosier_leads.v1"; assert r["approved"]==r["published"]==0; assert len(r["leads"])<=100; assert all(x["safe_to_publish"] is False and x["openagenda_uid"] is None for x in r["leads"])' \
                "$OUT/gosier-discovery.json" > "$LOG/gosier-contract.log" 2>&1; then
              if [[ "$RUN_MODE" == "write" ]]; then
                cp "$OUT/gosier-discovery.json" "$STATE/reports/municipal-gosier-$GOSIER_DAY.json"
                git -C state add -- "automation-intake/ptitesondes/reports/municipal-gosier-$GOSIER_DAY.json"
              fi
            else
              echo "::warning::Veille municipale ultramarine incomplète ; aucune piste promue."
            fi
          fi
          # When the reviewed private code AND independently verified public
          # building exist on approved main, produce PRIVATE evidence and
          # editorial review dossiers. No patch, approval or catalogue write.
          # Never load PR code in scheduled production or leak sessions in logs.
          if [[ -s "$OUT/gosier-discovery.json" &&
                -s src/automation/gosier_qualification.py &&
                -s src/automation/gosier_review_candidates.py &&
                -s src/automation/gosier_access_conditions.py ]]; then
            GOSIER_VENUE="$OUT/gosier-reviewed-venue.json"
            GOSIER_PROOF="$OUT/gosier-evidence.json"
            GOSIER_REVIEW="$OUT/gosier-review.json"
            GOSIER_ACCESS="$OUT/gosier-access.json"
            GOSIER_GEO_OK=0
            if python - "$GOSIER_VENUE" > "$LOG/gosier-geo.log" 2>&1 <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "public/scripts")
          from venue_registry import VENUES
          matches = [p for p in VENUES
           if p.get("city") == "Le Gosier"
           and "Médiathèque Raoul Georges Nicolo" in p.get("aliases", ())]
          if len(matches) != 1:
              raise ValueError("reviewed_building_unavailable")
          Path(sys.argv[1]).write_text(
              json.dumps(matches[0], ensure_ascii=False), encoding="utf-8")
          PY
            then
              GOSIER_GEO_OK=1
            fi
            if [[ "$GOSIER_GEO_OK" == 1 ]] && \
               python src/automation/gosier_qualification.py \
                  --discovery "$OUT/gosier-discovery.json" \
                  --catalogue public/docs/ptitesondes/sorties.json \
                  --venue-registry-entry "$GOSIER_VENUE" \
                  --output "$GOSIER_PROOF" > "$LOG/gosier-evidence.log" 2>&1 && \
               python src/automation/gosier_review_candidates.py \
                  --qualification "$GOSIER_PROOF" \
                  --catalogue public/docs/ptitesondes/sorties.json \
                  --output "$GOSIER_REVIEW" > "$LOG/gosier-review.log" 2>&1 && \
               python src/automation/gosier_access_conditions.py \
                  --review "$GOSIER_REVIEW" \
                  --output "$GOSIER_ACCESS" > "$LOG/gosier-access.log" 2>&1 && \
               python - "$GOSIER_PROOF" "$GOSIER_REVIEW" "$GOSIER_ACCESS" \
                  > "$LOG/gosier-review-contract.log" 2>&1 <<'PY'
          import json
          import sys
          evidence, review, access = [json.load(open(p, encoding="utf-8")) for p in sys.argv[1:]]
          assert evidence["schema"] == "ptitesondes.gosier_private_evidence.v1"
          assert review["schema"] == "ptitesondes.gosier_private_review_candidates.v1"
          assert evidence["approved"] == evidence["published"] == 0
          assert review["approved"] == review["published"] == 0
          assert review["mode"] == "private_review_only_no_patch_no_publication"
          assert access["schema"] == "ptitesondes.gosier_access_review.v1"
          assert access["mode"] == "private_access_review_only_no_patch"
          assert access["approved"] == access["published"] == 0
          assert len(access["reviewed"]) == len(review["candidates"])
          assert all(x["safe_to_publish"] is False and x["approved"] is False
           and x["published"] is False for x in access["reviewed"])
          assert "additions" not in access and "updates" not in access
          assert len(review["candidates"]) == review["needs_category_and_access_review"]
          assert all(c["safe_to_publish"] is False and c["approved"] is False
           and c["published"] is False for c in review["candidates"])
          assert "additions" not in review and "updates" not in review
          PY
            then
              if [[ "$RUN_MODE" == "write" ]]; then
                cp "$GOSIER_PROOF" "$STATE/reports/municipal-gosier-evidence-$GOSIER_DAY.json"
                cp "$GOSIER_REVIEW" "$STATE/reports/municipal-gosier-review-$GOSIER_DAY.json"
                cp "$GOSIER_ACCESS" "$STATE/reports/municipal-gosier-access-$GOSIER_DAY.json"
                git -C state add -- \
                    "automation-intake/ptitesondes/reports/municipal-gosier-evidence-$GOSIER_DAY.json" \
                    "automation-intake/ptitesondes/reports/municipal-gosier-review-$GOSIER_DAY.json" \
                    "automation-intake/ptitesondes/reports/municipal-gosier-access-$GOSIER_DAY.json"
              fi
            else
              echo "::warning::Dossier municipal non publiable ou preuve incomplète ; aucun patch ni approbation."
            fi
          fi
          CINOR_DAY="$(TZ=Indian/Reunion date +%F)"
          if [[ -s src/automation/resolve_cinor_agenda.py && -n "$OPENAGENDA_READ_KEY" ]] && \
             [[ "$RUN_MODE" != "write" || ! -s "$STATE/reports/cinor-agenda-review-$CINOR_DAY.json" ]]; then
            if python src/automation/resolve_cinor_agenda.py \
                --output "$OUT/cinor-directory-review.json" \
                > "$LOG/cinor-directory.log" 2>&1 && \
               python -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["schema"]=="ptitesondes.cinor_agenda_probe.v1"; assert r["automatically_admitted"] is False; assert r["published"]==0' \
                "$OUT/cinor-directory-review.json" > "$LOG/cinor-contract.log" 2>&1; then
              if [[ "$RUN_MODE" == "write" ]]; then
                cp "$OUT/cinor-directory-review.json" "$STATE/reports/cinor-agenda-review-$CINOR_DAY.json"
                git -C state add -- "automation-intake/ptitesondes/reports/cinor-agenda-review-$CINOR_DAY.json"
              fi
            else
              echo "::warning::Identité de l'agenda CINOR non certifiée ; aucun UID activé."
            fi
          fi
          if [[ "$RUN_MODE" == "write" ]]; then
            push_private 'data(ptitesondes): conserver les sondes ultramarines en privé uniquement'
          fi
          # A single delayed scheduled run can catch up to four DUE,
          # not-yet-reviewed batches. One intake collection per run (no
          # claim that historical missed network collections occurred).
          # A valid private per-slot report prevents duplicate review.
          # Manual/push preview retain one slot; only an explicit authenticated
          # workflow_dispatch recovery=catchup may reuse scheduled catch-up.
          # The external scheduler gets no permission on the private repository.
          if ! python public/scripts/ptitesondes_schedule_catchup.py \
            --date "$DAY" --event "$RUN_EVENT" --cron "$REVIEW_CRON" \
            --reports-dir "$STATE/reports" --output "$VERIFIED/review-slots.txt" \
            > "$LOG/schedule-catchup.log" 2>&1; then
            echo "::error::Rattrapage sûr des créneaux impossible ; aucune validation écrite."
            exit 1
          fi
          mapfile -t REVIEW_SLOTS < "$VERIFIED/review-slots.txt"
          for REVIEW_SLOT in "${REVIEW_SLOTS[@]}"; do
            [[ "$REVIEW_SLOT" =~ ^[0-3]$ ]] || { echo "::error::Créneau hors limites."; exit 1; }
            WORK="$VERIFIED/slot-$REVIEW_SLOT"
            mkdir -p "$WORK"
            if ! python public/scripts/ptitesondes_candidate_promotion.py \
              --date "$DAY" --limit 15 --slot "$REVIEW_SLOT" \
              --skip-published-prebatch \
              --backlog-file "$STATE/backlog.json" \
              --catalogue-file public/docs/ptitesondes/sorties.json \
              --output-dir "$WORK" \
              > "$LOG/verification-sorties-slot$REVIEW_SLOT.log" 2>&1; then
              echo "::error::Prévalidation indépendante échouée ; aucune approbation appliquée."
              exit 1
            fi
            if ! python src/automation/merge_verified.py \
              --date "$DAY" --existing "$STATE/patch-$DAY.json" \
              --candidate "$WORK/preview-patch.json" --report "$WORK/report.json" \
              --backlog "$STATE/backlog.json" \
              --public public/docs/ptitesondes/sorties.json \
              --output "$WORK/patch-$DAY.json" \
              > "$LOG/fusion-verifiee-slot$REVIEW_SLOT.log" 2>&1; then
              echo "::error::Réconciliation cumulative refusée ; aucune approbation écrite."
              exit 1
            fi
            # Only bounded, redacted categories in the PRIVATE branch.
            # Raw evidence, candidates, URLs and reasons stay on the runner.
            if ! python public/scripts/ptitesondes_private_qualification_diagnostics.py \
              --date "$DAY" --slot "$REVIEW_SLOT" \
              --report "$WORK/report.json" \
              --output "$WORK/qualification-summary.json" \
              > "$LOG/qualification-diagnostics-slot$REVIEW_SLOT.log" 2>&1; then
              echo "::error::Diagnostic privé incohérent ; aucun rapport transmis."
              exit 1
            fi
            test -s "$WORK/patch-$DAY.json"
            test -s "$WORK/qualification-summary.json"
            cp "$WORK/patch-$DAY.json" "$STATE/patch-$DAY.json"
            if [[ "$RUN_MODE" == "write" ]]; then
              cp "$LOG/fusion-verifiee-slot$REVIEW_SLOT.log" "$STATE/reports/verification-$DAY.json"
              cp "$WORK/qualification-summary.json" "$STATE/reports/qualification-$DAY-slot$REVIEW_SLOT.json"
              # Bilan privé Accoord par occurrence. Aucune donnée de preuve ni
              # URL n'est copiée ; le diagnostic ne sert jamais à approuver.
              if python public/scripts/ptitesondes_accoord_status.py \
                --date "$DAY" \
                --backlog "$STATE/backlog.json" \
                --catalogue public/docs/ptitesondes/sorties.json \
                --patch "$STATE/patch-$DAY.json" \
                --preview "$WORK/preview-patch.json" \
                --report "$WORK/report.json" \
                --previous "$STATE/reports/accoord-status.json" \
                --output "$STATE/reports/accoord-status.json" \
                > "$LOG/accoord-status-slot$REVIEW_SLOT.log" 2>&1; then
                git -C state add -- "automation-intake/ptitesondes/reports/accoord-status.json"
              else
                echo "::warning::Diagnostic privé des séances Accoord indisponible ; aucune validation affectée."
              fi
              git -C state add -- \
                "automation-intake/ptitesondes/patch-$DAY.json" \
                "automation-intake/ptitesondes/reports/verification-$DAY.json" \
                "automation-intake/ptitesondes/reports/qualification-$DAY-slot$REVIEW_SLOT.json"
              push_private 'data(ptitesondes): conserver les diagnostics anonymisés des preuves'
            fi
          done
          # Dashboard redacted, stored in PRIVATE state only. Its failure never
          # prevents intake collection, qualification, or recovery.
          if [[ "$RUN_MODE" == "write" ]]; then
            if python public/scripts/ptitesondes_daily_quality_dashboard.py \
              --reports-dir "$STATE/reports" \
              --catalogue public/docs/ptitesondes/sorties.json \
              --date "$DAY" \
              --output "$STATE/reports/dashboard.json" \
              --markdown "$STATE/reports/dashboard.md" \
              > "$LOG/dashboard.log" 2>&1; then
              git -C state add -- \
                automation-intake/ptitesondes/reports/dashboard.json \
                automation-intake/ptitesondes/reports/dashboard.md
              push_private 'data(ptitesondes): résumer la veille en tableau privé'
            else
              echo "::warning::Tableau de bord privé non disponible ; collecte et garde-fous préservés."
            fi
          fi
          echo "Une collecte sorties réalisée, ${#REVIEW_SLOTS[@]} lots indépendants vérifiés ou rattrapés ; aucune écriture publique." >> "$GITHUB_STEP_SUMMARY"

      - name: Préparer les séances HTML pour une file exclusivement privée (opt-in)
        if: ${{ env.CYCLE != 'places' && vars.PTITESONDES_HTML_QUEUE == 'enabled' }}
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/ptitesondes-private-logs"
          MODE='preview'
          if [[ "$RUN_MODE" == 'write' ]]; then MODE='stage'; fi
          # Daily shifting round-robin batches. No hardcoded town filter;
          # only trusted source/adapter pairs can be executed.
          BATCH="$(python -c 'from datetime import datetime, timezone; n=datetime.now(timezone.utc); slot=0 if n.hour<9 else 1 if n.hour<12 else 2 if n.hour<17 else 3; print(n.toordinal()*4+slot)')"
          if ! python public/scripts/ptitesondes_html_private_queue_cycle.py \
              --state-checkout state --mode "$MODE" --batch "$BATCH" \
              > "$LOG/html-private-queue-summary.json" 2>&1; then
            echo "::warning::File HTML privée non préparée ; état historique conservé, aucune publication."
            exit 0
          fi
          if [[ "$RUN_MODE" == 'write' ]]; then
            git -C state add -- automation-intake/ptitesondes/html-review-candidates.json
            if ! git -C state diff --cached --quiet; then
              git -C state config user.name 'github-actions[bot]'
              git -C state config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git -C state commit -m 'data(ptitesondes): conserver les séances HTML à revoir en privé' \
                > "$LOG/git-html-commit.log" 2>&1
              AUTH="$(printf 'x-access-token:%s' "$PRIVATE_WRITE_TOKEN" | base64 -w0)"
              if ! git -C state -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
                  push origin HEAD:automation/ptitesondes-intake \
                  > "$LOG/git-html-push.log" 2>&1; then
                echo "::error::Stockage privé HTML indisponible ; aucune publication."
                exit 1
              fi
            fi
          fi
          echo "Séances HTML triées en mémoire, sauvegarde autorisée seulement dans le privé ; aucune publication." >> "$GITHUB_STEP_SUMMARY"

      - name: Rechercher et qualifier les lieux permanents pour enfants
        if: ${{ env.CYCLE != 'outings' }}
        shell: bash
        run: |
          set -euo pipefail
          DAY="$(TZ=Europe/Paris date +%F)"
          STATE="state/automation-intake/ptitesondes"
          OUT="$RUNNER_TEMP/ptitesondes-lieux"
          LOG="$RUNNER_TEMP/ptitesondes-private-logs"
          if ! python src/automation/place_discovery.py --date "$DAY" --backlog "$STATE/backlog.json" --existing "$STATE/lieux-backlog.json" --public public/docs/ptitesondes/lieux.json --public-sources public/scripts/ptitesondes_place_sources.json --output "$OUT/lieux-backlog.json" --report "$OUT/report.json" > "$LOG/lieux-discovery.log" 2>&1; then
            echo "::error::Découverte des lieux échouée ; aucune donnée nouvelle publiée."
            exit 1
          fi
          if ! python src/automation/place_qualification.py --date "$DAY" --backlog "$OUT/lieux-backlog.json" --existing-report "$STATE/lieux-qualification.json" --official-sources src/automation/place_official_sources.json --public public/docs/ptitesondes/lieux.json --output "$OUT/lieux-qualification.json" --summary "$OUT/lieux-qualification-summary.json" > "$LOG/lieux-qualification.log" 2>&1; then
            echo "::error::Qualification des lieux échouée."
            exit 1
          fi
          if ! python src/automation/place_ministry_current_audit.py --date "$DAY" --backlog "$OUT/lieux-backlog.json" --output "$OUT/lieux-current-municipal-audit.json" --summary "$OUT/lieux-current-municipal-summary.json" > "$LOG/lieux-ministry.log" 2>&1; then
            echo "::error::Audit municipal échoué."
            exit 1
          fi
          # Index OSM : 2 communes par jour, aucun GPS ni publication.
          # Moteur public, données d'entrée privées, sortie privée uniquement.
          if ! python public/scripts/ptitesondes_osm_poi_triage.py --date "$DAY" --municipal "$OUT/lieux-current-municipal-audit.json" --backlog "$OUT/lieux-backlog.json" --existing "$STATE/lieux-osm-poi-triage.json" --output "$OUT/lieux-osm-poi-triage.json" --summary "$OUT/lieux-osm-poi-triage-summary.json" > "$LOG/lieux-osm-poi-triage.log" 2>&1; then
            echo "::error::Recherche OSM privée échouée ; aucune donnée publique modifiée."
            exit 1
          fi
          if ! python src/automation/place_official_proof.py --date "$DAY" --report "$OUT/lieux-qualification.json" --public public/docs/ptitesondes/lieux.json --sources src/automation/place_official_sources.json --output "$OUT/lieux-official-proof.json" --summary "$OUT/lieux-official-proof-summary.json" > "$LOG/lieux-proof.log" 2>&1; then
            echo "::error::Preuve officielle des lieux échouée."
            exit 1
          fi
          if ! python src/automation/place_release_gate.py --date "$DAY" --prequalification "$OUT/lieux-qualification.json" --official-proof "$OUT/lieux-official-proof.json" --public public/docs/ptitesondes/lieux.json --sources src/automation/place_official_sources.json --output "$OUT/lieux-release-review.json" --summary "$OUT/lieux-release-review-summary.json" > "$LOG/lieux-release.log" 2>&1; then
            echo "::error::Contrôle de sécurité des lieux échoué."
            exit 1
          fi
          # Calendriers officiels : empreintes et indices structurés conservés
          # dans la branche PRIVÉE uniquement. Un échec de site n'interrompt
          # jamais la recherche nationale de lieux.
          WATCH_OK=0
          if python public/scripts/ptitesondes_place_agenda_watch.py \
              --sources public/scripts/ptitesondes_place_agenda_sources.json \
              --catalogue public/docs/ptitesondes/lieux.json \
              --existing "$STATE/lieux-agenda-watch.json" \
              --output "$OUT/lieux-agenda-watch.json" \
              --report "$OUT/lieux-agenda-candidates.json" > "$LOG/lieux-agenda-watch.log" 2>&1; then
            WATCH_OK=1
          else
            echo "::warning::Surveillance des programmes indisponible ; aucune piste promue."
          fi
          PREFLIGHT_OK=0
          if [[ "$WATCH_OK" == 1 ]]; then
            if python public/scripts/ptitesondes_place_agenda_preflight.py \
                --input "$OUT/lieux-agenda-candidates.json" \
                --sources public/scripts/ptitesondes_place_agenda_sources.json \
                --places public/docs/ptitesondes/lieux.json \
                --outings public/docs/ptitesondes/sorties.json \
                --date "$DAY" \
                --output "$OUT/lieux-agenda-preflight.json" > "$LOG/lieux-agenda-preflight.log" 2>&1; then
              PREFLIGHT_OK=1
            else
              echo "::warning::Recontrole des seances indisponible ; aucun feu vert de publication."
            fi
          fi
          if [[ "$RUN_MODE" == "write" ]]; then
            for f in lieux-backlog.json lieux-qualification.json lieux-current-municipal-audit.json lieux-osm-poi-triage.json lieux-official-proof.json lieux-release-review.json; do
              test -s "$OUT/$f"
              cp "$OUT/$f" "$STATE/$f"
            done
            git -C state config user.name 'github-actions[bot]'
            git -C state config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C state add -- automation-intake/ptitesondes/lieux-backlog.json automation-intake/ptitesondes/lieux-qualification.json automation-intake/ptitesondes/lieux-current-municipal-audit.json automation-intake/ptitesondes/lieux-osm-poi-triage.json automation-intake/ptitesondes/lieux-official-proof.json automation-intake/ptitesondes/lieux-release-review.json
            if [[ "$WATCH_OK" == 1 ]]; then
              cp "$OUT/lieux-agenda-watch.json" "$STATE/lieux-agenda-watch.json"
              cp "$OUT/lieux-agenda-candidates.json" "$STATE/lieux-agenda-candidates.json"
              git -C state add -- automation-intake/ptitesondes/lieux-agenda-watch.json automation-intake/ptitesondes/lieux-agenda-candidates.json
            fi
            if [[ "$PREFLIGHT_OK" == 1 ]]; then
              cp "$OUT/lieux-agenda-preflight.json" "$STATE/lieux-agenda-preflight.json"
              git -C state add -- automation-intake/ptitesondes/lieux-agenda-preflight.json
            fi
            if ! git -C state diff --cached --quiet; then
              git -C state commit -m 'data(ptitesondes): lieux nationaux depuis runner public' > "$LOG/git-lieux-commit.log" 2>&1
              AUTH="$(printf 'x-access-token:%s' "$PRIVATE_WRITE_TOKEN" | base64 -w0)"
              if ! git -C state -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:automation/ptitesondes-intake > "$LOG/git-lieux-push.log" 2>&1; then
                echo "::error::Échec de stockage privé des lieux ; aucun catalogue modifié."
                exit 1
              fi
            fi
          fi
          echo "Lieux recherchés et qualifiés ; états et preuves exclusivement privés." >> "$GITHUB_STEP_SUMMARY"

      - name: Vérifier absence d'écriture ou de publication dans le dépôt public
        shell: bash
        run: |
          set -euo pipefail
          git -C public diff --exit-code -- docs/ptitesondes/sorties.json docs/ptitesondes/lieux.json
          echo "Aucune écriture vers le catalogue public ; synchronisation et publication autonomes restent indépendantes." >> "$GITHUB_STEP_SUMMARY"
