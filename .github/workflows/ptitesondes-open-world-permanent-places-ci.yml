name: P'tites Ondes — recherche générique des lieux permanents
on:
  pull_request:
    paths:
      - 'scripts/ptitesondes_open_world_permanent_place_*.py'
      - 'tests/test_ptitesondes_open_world_permanent_place_*.py'
      - '.github/workflows/ptitesondes-open-world-permanent-places-ci.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify unknown places, safe research and fair rotation
        env:
          PYTHONPATH: scripts
        run: python -m unittest discover -s tests -p 'test_ptitesondes_open_world_permanent_place_*.py' -v
