name: GO radio v8 — eight more broadcaster-original logos SHA audit (READ ONLY)
on:
  push:
    branches: [feature/go-radio-v8-metalon-3-logos-20261123]
    paths:
      - 'radio-catalog-lab/tools/audit_v8_eight_more_original_logos.py'
      - '.github/workflows/go-radio-v8-eight-more-original-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-eight-new-logo-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded original image decoder
        run: python -m pip install 'pillow>=10,<12'
      - name: Check immutable channel identities offline
        run: python radio-catalog-lab/tools/audit_v8_eight_more_original_logos.py --output "$RUNNER_TEMP/offline.json"
      - name: Read publisher pages and SHA-original image bytes
        run: python radio-catalog-lab/tools/audit_v8_eight_more_original_logos.py --network --output "$RUNNER_TEMP/online.json"
      - name: Confirm never-changing public release
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'online.json').read_text())
          assert r['scope']=='GO_V8_EIGHT_FURTHER_BROADCASTER_ORIGINAL_LOGOS_READ_ONLY'
          assert len(r['rows'])==8
          assert not r['published'] and not r['catalog_changed']
          print('GO_V8_EIGHT_NEW_BROADCASTER_LOGOS_READ_ONLY')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: go-v8-eight-additional-firstparty-original-sha-evidence
          path: ${{ runner.temp }}/online.json
          retention-days: 14
