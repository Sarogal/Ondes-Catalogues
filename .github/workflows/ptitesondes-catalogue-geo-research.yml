name: "P'tites Ondes — inventaire GPS du catalogue publié"
on:
  pull_request:
    paths:
      - 'scripts/ptitesondes_catalogue_geo_research.py'
      - 'tests/test_ptitesondes_catalogue_geo_research.py'
      - '.github/workflows/ptitesondes-catalogue-geo-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate read-only contract
        env:
          PYTHONPATH: scripts:tests
        run: python -m unittest -v test_ptitesondes_catalogue_geo_research
      - name: Produce research queue
        run: |
          python scripts/ptitesondes_catalogue_geo_research.py --catalogue docs/ptitesondes/sorties.json --day "$(TZ=Europe/Paris date +%F)" > /tmp/ptitesondes-geo-research.json
          git diff --exit-code -- docs/ptitesondes/sorties.json
      - uses: actions/upload-artifact@v4
        with:
          name: ptitesondes-public-geo-research
          path: /tmp/ptitesondes-geo-research.json
          retention-days: 7
