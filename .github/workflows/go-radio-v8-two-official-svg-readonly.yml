name: GO v8 — audit official SVG broadcast logos to secure PNG (READ ONLY)
on:
  push:
    branches: [feature/go-radio-v8-metalon-3-logos-20261123]
    paths:
      - 'radio-catalog-lab/tools/audit_v8_two_official_svg_logos.py'
      - '.github/workflows/go-radio-v8-two-official-svg-readonly.yml'
permissions:
  contents: read
jobs:
  secure-svg-origin-and-conversion-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducible rasterizer, guarded XML and decoder
        run: python -m pip install 'Pillow==11.3.0' 'CairoSVG==2.8.2' 'defusedxml==0.7.1'
      - name: Confirm owner channel exact IDs and stream identity offline
        run: python radio-catalog-lab/tools/audit_v8_two_official_svg_logos.py --output "$RUNNER_TEMP/offline.json"
      - name: Verify safe owner SVG and exact derived PNG SHA bytes
        run: python radio-catalog-lab/tools/audit_v8_two_official_svg_logos.py --network --output "$RUNNER_TEMP/online.json"
      - name: Confirm output is strictly read only
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          a=json.loads((Path(os.environ['RUNNER_TEMP'])/'online.json').read_text())
          assert a['scope']=='GO_V8_TWO_OFFICIAL_SVG_RADIO_LOGOS_SAFE_PNG_READ_ONLY'
          assert a['targets']==2 and len(a['rows'])==2
          assert not a['signed'] and not a['published']
          print('TWO_OFFICIAL_SVG_TO_PNG_SAFE_READ_ONLY')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: go-v8-two-official-svg-to-png-sha-audit
          path: ${{ runner.temp }}/online.json
          retention-days: 14
