name: GO TEST v7 — audit five Exclusively station images (read only)
on:
  push:
    branches:
      - feature/go-radio-v7-13-dedupe-20261123
    paths:
      - 'radio-catalog-lab/tools/audit_v7_exclusively_logo_candidates.py'
      - '.github/workflows/go-radio-v7-exclusively-logo-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-five-directory-station-images:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded image verification
        run: python -m pip install 'pillow>=10,<12'
      - name: Validate five source mappings without making network requests
        run: |
          python radio-catalog-lab/tools/audit_v7_exclusively_logo_candidates.py \
            --output "$RUNNER_TEMP/exclusively-v7-offline.json"
      - name: Verify each directory page identity and original image SHA
        run: |
          python radio-catalog-lab/tools/audit_v7_exclusively_logo_candidates.py \
            --network --output "$RUNNER_TEMP/exclusively-v7-network-evidence.json"
      - name: Print sanitized results and guarantee no publication
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          obj=json.loads((Path(os.environ['RUNNER_TEMP'])/'exclusively-v7-network-evidence.json').read_text())
          assert obj['scope']=='TEST_V7_EXCLUSIVELY_5_STATION_LOGOS_READ_ONLY'
          assert obj['missing_source_stations']==5
          assert obj['publication_allowed'] is False
          print('EXCLUSIVELY_STATION_LOGO_SHA_VERIFIED',
                obj['verified_page_and_image_count'],'/5')
          for entry in obj['records']:
              print('EXCLUSIVELY_STATION',entry['go_station_id'],
                    entry['program'],entry['status'],
                    entry.get('sha_evidence',{}).get('sha256',''),
                    entry.get('error_type',''))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: go-v7-exclusively-five-station-logo-evidence-only
          path: |
            ${{ runner.temp }}/exclusively-v7-offline.json
            ${{ runner.temp }}/exclusively-v7-network-evidence.json
          retention-days: 14
